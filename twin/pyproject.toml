[project]
name = "twin-layer"
version = "0.1.0"
description = "City Brain Convergence - Twin layer service and partner mocks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "numpy>=2.5.3",  # tools/inspect_glb.py
]
# not used by the two-block city; kept for when the engine loads a real map or asks an LLM
osm = ["osmnx>=2.1.1"]
llm = ["groq>=1.7.0", "python-dotenv>=1.2.3"]
# the decision model (engine/decision): CPU build, the plain xgboost wheel drags in ~350 MB of GPU libraries
decision = ["xgboost-cpu>=3.4.1"]

[tool.uv]
default-groups = ["dev", "decision"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin"]
