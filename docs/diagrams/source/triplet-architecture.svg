<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 1472 640" width="1472" height="640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="-40" y="-40" width="1472" height="640" fill="#07090c"/><style>
.node rect{fill:#0e1217;stroke-width:2}.node .t{font:700 34px Inter,Arial,sans-serif;fill:#eef1f5}
.node .q{font:500 19px Inter,Arial,sans-serif;fill:#aab2bf}.node .m{font:400 14px "JetBrains Mono",Consolas,monospace;fill:#8a93a3}
.wire{fill:none;stroke-width:2;stroke-dasharray:6 8;opacity:.55;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}.lbl{font:500 15px "JetBrains Mono",Consolas,monospace}
</style>
      <defs>
        <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g class="wires">
        <!-- twin -> guardian -->
        <path id="w1" class="wire" stroke="#f0a53a" d="M380 150 C 640 150, 760 90, 1000 90"/>
        <!-- guardian -> brain (verdict) -->
        <path id="w2" class="wire" stroke="#2fc27e" d="M1180 175 L1180 375"/>
        <!-- brain -> guardian (audited calls) back to twin -->
        <path id="w3" class="wire" stroke="#4c7dff" d="M1000 450 C 760 450, 640 400, 380 400"/>
        <path id="w4" class="wire" stroke="#2fc27e" d="M1000 125 C 760 125, 640 190, 380 190" style="opacity:.3"/>
        <text class="lbl" x="560" y="112" fill="#f0a53a">signed readings · HMAC + seq · 1/s</text>
        <text class="lbl" x="1196" y="282" fill="#2fc27e">signed verdict</text>
        <text class="lbl" x="560" y="470" fill="#4c7dff">actuator calls + trust_ref</text>
        <text class="lbl" x="560" y="222" fill="#2fc27e" opacity=".7">containment · audited calls</text>
        <circle r="7" fill="#f0a53a" filter="url(#gl)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
        <circle r="7" fill="#f0a53a" filter="url(#gl)"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
        <circle r="7" fill="#2fc27e" filter="url(#gl)"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
        <circle r="7" fill="#4c7dff" filter="url(#gl)"><animateMotion dur="2.6s" begin=".6s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
        <circle r="6" fill="#2fc27e" filter="url(#gl)" opacity=".7"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>
      </g>
      <g class="node n1">
        <rect x="0" y="90" width="380" height="370" rx="20" stroke="#f0a53a"/>
        <text class="m" x="34" y="140">01 · GROUND TRUTH</text>
        <text class="t" x="34" y="196" fill="#f0a53a" style="fill:#f0a53a">Twin</text>
        <text class="q" x="34" y="234">What is really happening?</text>
        <text class="m" x="34" y="300">city engine at 10 Hz</text>
        <text class="m" x="34" y="328">signs every reading</text>
        <text class="m" x="34" y="356">checks every call it receives</text>
        <text class="m" x="34" y="416" opacity=".6">python · fastapi · three.js</text>
      </g>
      <g class="node n2">
        <rect x="1000" y="0" width="392" height="175" rx="20" stroke="#2fc27e"/>
        <text class="m" x="1030" y="42">03 · TRUST</text>
        <text class="t" x="1030" y="92" style="fill:#2fc27e">Guardian</text>
        <text class="q" x="1030" y="128">Is this data telling the truth?</text>
        <text class="m" x="1030" y="156">7 checks · 9 attack patterns</text>
      </g>
      <g class="node n3">
        <rect x="1000" y="375" width="392" height="175" rx="20" stroke="#4c7dff"/>
        <text class="m" x="1030" y="417">02 · DECISION</text>
        <text class="t" x="1030" y="467" style="fill:#4c7dff">City Brain</text>
        <text class="q" x="1030" y="503">What should we do?</text>
        <text class="m" x="1030" y="531">rules · agents · solvers · 1 gate</text>
      </g>
    </svg>