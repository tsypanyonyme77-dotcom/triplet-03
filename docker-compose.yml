# Starts the whole city: docker compose up --build
# Each layer must provide <layer>/Dockerfile. Partner addresses come from .env (see .env.example).
# Optional: Traefik, Prometheus, Grafana, Loki, Promtail and Jaeger around the Brain (see brain/docs/OBSERVABILITY.md):
#   OTLP_ENDPOINT=http://jaeger:4318 docker compose --profile obs up --build
include:
  - path: brain/deploy/compose/observability.yaml

x-partners: &partners
  TWIN_URL: ${TWIN_URL:-http://twin:8001}
  BRAIN_URL: ${BRAIN_URL:-http://brain:8002}
  GUARDIAN_URL: ${GUARDIAN_URL:-http://guardian:8003}
  TWIN_TOKEN: ${TWIN_TOKEN:-change-me}
  BRAIN_TOKEN: ${BRAIN_TOKEN:-change-me}
  GUARDIAN_TOKEN: ${GUARDIAN_TOKEN:-change-me}
  TWIN_HMAC_SECRET: ${TWIN_HMAC_SECRET:-dev-only-twin-secret}
  BRAIN_HMAC_SECRET: ${BRAIN_HMAC_SECRET:-dev-only-brain-secret}
  GUARDIAN_HMAC_KEY: ${GUARDIAN_HMAC_KEY:-dev-only-guardian-key}   # the Guardian signs verdicts, the Brain checks them
  BRAIN_API_KEY: ${BRAIN_API_KEY:-dev-only-brain-api-key}          # the Brain's login on the Guardian (X-API-Key)

services:
  twin:
    build: ./twin
    environment: *partners
    ports: ["8001:8001"]
  guardian:
    build: ./guardian
    environment: *partners
    ports: ["8003:8003"]
    depends_on: [twin]
  # The City Brain listens on BRAIN_URL's port (8002), reads TWIN_URL and GUARDIAN_URL (a bare http://host:port for the Twin means its MCP endpoint, /mcp),
  # writes its city graph to Neo4j and keeps its knowledge vectors in Qdrant (both below). Without them it runs from memory and says so.
  brain:
    build: ./brain
    command: ["serve", "--host", "0.0.0.0", "--port", "8002", "--config", "deploy/compose/partners.compose.yaml"]
    environment:
      <<: *partners
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-citybrain-local-pw}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}   # the obs profile's Jaeger: one span per timeline event
    ports: ["127.0.0.1:8002:8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes: [brain-state:/app/state, brain-logs:/app/logs]
    depends_on:
      twin: {condition: service_started}
      guardian: {condition: service_started}
      neo4j: {condition: service_healthy}
      qdrant: {condition: service_healthy}

  # The Brain's two stores: Neo4j keeps the City Graph (explore it at http://127.0.0.1:7474), Qdrant the knowledge vectors.
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-citybrain-local-pw}
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"   # the Neo4j Browser connects to this from your browser
    volumes: [neo4j-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  brain-state:
  brain-logs:
  neo4j-data:
  qdrant-data:
