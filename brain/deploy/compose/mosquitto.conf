# Broker for the MQTT Twin adapter. Reachable on the private Compose network and on 127.0.0.1 only.
# Anonymous access is for the demo stack; with real partners set `password_file` and `allow_anonymous false`,
# and give the listener a certificate (`cafile`, `certfile`, `keyfile`, port 8883) as docs/SECURITY.md describes.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# Keep QoS 1 messages for a Brain that is restarting: its persistent session is what makes a restart lose nothing.
max_queued_messages 10000
