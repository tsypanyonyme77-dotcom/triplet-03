<style>
/* Tokens. Light is the default whatever the OS prefers: this screen is read on a projector in a lit hall. */
:root {
  --board: #E6E9E4; --board-2: #D9DDD7; --strip: #FFFFFF; --ink: #111417; --ink-2: #3F464A; --muted: #636B6F;
  --rule: #AEB5AF; --rule-strong: #111417; --wash: rgba(17, 20, 23, .055);
  --good: #18794A; --warning: #A85F00; --critical: #C0311E; --action: #1B49CF; --on-mark: #FFFFFF;
  --font: "B612", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Ledger Dot", "B612 Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --cols: 9rem minmax(0, 1.25fr) minmax(9.4rem, .9fr) minmax(0, 2fr) minmax(9.4rem, .75fr) minmax(0, 1.3fr);
  --cock: 3.25rem;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
:root[data-theme="dark"] {
  --board: #0F1113; --board-2: #181B1E; --strip: #1B1F22; --ink: #F3F5F2; --ink-2: #C2C8CA; --muted: #949CA0;
  --rule: #4A5257; --rule-strong: #C2C8CA; --wash: rgba(243, 245, 242, .07);
  --good: #4CC38A; --warning: #F2B33D; --critical: #FF7A66; --action: #8FB0FF; --on-mark: #0F1113;
}
html { font-size: 16px; }
@media (min-width: 1700px) { html { font-size: 18px; } }
@media (min-width: 2300px) { html { font-size: 22px; } }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--board); color: var(--ink); font-family: var(--font); line-height: 1.3;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100vh; overflow: hidden;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
::selection { background: var(--action); color: var(--on-mark); }
:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.nw { white-space: nowrap; }
svg.i { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Head rule */
.head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1.5rem; padding: .7rem 1.25rem; border-bottom: 2px solid var(--rule-strong); background: var(--strip); }
.name { display: flex; align-items: baseline; gap: .75rem; white-space: nowrap; }
.name b { font-size: 1.3rem; letter-spacing: -.01em; }
.sim { font-size: .85rem; color: var(--ink-2); display: none; }
.chart h2 small { font-size: .82rem; font-weight: 400; color: var(--ink-2); margin-left: .5rem; }
.link { display: inline-flex; align-items: center; gap: .4rem; font-size: .85rem; color: var(--ink-2); }
button.link { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
button.link:hover { color: var(--ink); }
.link[hidden] { display: none; }
.head { position: relative; }
.bars { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; }
.needs { display: flex; gap: 1rem; align-items: center; padding: .55rem 1.25rem; background: var(--strip); border-bottom: 3px solid var(--critical); font-weight: 600; }
.needs[hidden] { display: none; }
.needs button { margin-left: auto; }
.approve { background: var(--strip); border-bottom: 3px solid var(--warning); }
.approve[hidden] { display: none; }
.approve .ask { display: flex; gap: .8rem; align-items: center; padding: .55rem 1.25rem; font-weight: 600; }
.approve .ask + .ask { border-top: 1px solid var(--rule); }

.approve .ask button:first-of-type { margin-left: auto; box-shadow: inset 0 0 0 2px var(--good); color: var(--ink); font-weight: 700; }
.approve .ask button:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
.link i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--muted); }
.link[data-state="live"] i { background: var(--good); }
.link[data-state="lost"] i { background: var(--critical); border-radius: 0; }
.keys { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; min-width: 0; }
.key {
  display: inline-flex; align-items: center; gap: .55rem; padding: .45rem .8rem .45rem .5rem; cursor: pointer;
  background: var(--action); color: var(--on-mark); border: 0; border-radius: 3px; font-weight: 700; font-size: .95rem; white-space: nowrap;
  transition: transform .15s var(--ease), filter .15s;
}
.key kbd { font: 700 .8rem var(--mono); background: var(--on-mark); color: var(--action); border-radius: 2px; padding: .1rem .4rem; }
.key:hover { filter: brightness(1.12); }
.key:active { transform: translateY(1px); }
.key[aria-busy="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
/* More scenarios than fit on one line: keys shrink to their numbers and only the one in play keeps its name. */
.keys.compact { flex-wrap: nowrap; gap: .4rem; }
.keys.compact .key { padding: .45rem .5rem; }
.keys.compact .key:not(.current) .name { display: none; }
.head:has(.keys.dense) { gap: 1rem; }
.keys.dense { gap: .09rem; }
.keys.dense .key { justify-content: center; width: 1.46rem; padding: .36rem 0; background: color-mix(in srgb, var(--action) 11%, transparent); color: var(--action); }
.keys.dense .key kbd { background: transparent; color: inherit; padding: 0; font-size: .76rem; }
.keys.dense .key .name { display: none; }
.keys.dense .key.current { background: var(--action); color: var(--on-mark); }
.keys.dense .key[aria-busy="true"] { outline-width: 2px; outline-offset: 1px; }
.keys.dense .key:disabled { background: transparent; color: var(--muted); box-shadow: none; }
.keys.dense .key:disabled kbd { background: transparent; color: inherit; }
.keys.dense .key.current:disabled { background: var(--action); color: var(--on-mark); }
.keys.compact.wrap { flex-wrap: wrap; row-gap: .3rem; }  /* more keys than one row beside the clock holds: a second row, never under the clock */
.key:disabled { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--rule); cursor: default; filter: none; }
.key:disabled kbd { background: var(--rule); color: var(--strip); }
.ghost { background: transparent; border: 0; box-shadow: inset 0 0 0 1.5px var(--rule); border-radius: 3px; padding: .4rem .65rem; cursor: pointer; font-size: .85rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: .4rem; }
.ghost:hover { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
.ghost[aria-pressed="true"] { background: var(--ink); color: var(--strip); box-shadow: none; }
.span { display: flex; align-items: center; gap: .9rem; justify-content: flex-end; white-space: nowrap; }
.span .clock { font-size: .95rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
/* What is in play, named once and in one place, so the key rail never changes width and the frame below it never jumps. */
.run { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; min-width: 0; }
.run b { font-size: .98rem; max-width: 15rem; overflow: hidden; text-overflow: ellipsis; }
.run b:empty { display: none; }
.run .clock { font-size: .82rem; }
.verdict { position: relative; }
.verdict > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: .45rem; font-weight: 700; font-size: .95rem; padding: .3rem .5rem; border-radius: 3px; }
.verdict > summary::-webkit-details-marker { display: none; }
.verdict > summary:hover { background: var(--wash); }
.checks { position: absolute; right: 0; top: calc(100% + .5rem); z-index: 20; width: min(34rem, 86vw); margin: 0; padding: .75rem 1rem; list-style: none; background: var(--strip); border: 2px solid var(--rule-strong); font-size: .85rem; }
.checks li { display: flex; gap: .5rem; padding: .2rem 0; align-items: flex-start; }

/* Marks: the only place status colour lives */
.mark { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 3px; color: var(--on-mark); background: var(--muted); flex: none; }
.mark svg { width: 1rem; height: 1rem; stroke-width: 3; }
.mark.good { background: var(--good); } .mark.warning { background: var(--warning); } .mark.critical { background: var(--critical); }
.state { display: inline-flex; align-items: center; gap: .5rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: .95rem; }

/* Rack */
main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(20rem, 1fr); min-height: 0; }
.rack { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; position: relative; }
.heads { display: grid; grid-template-columns: var(--cols); padding: 0 calc(var(--cock) + .9rem) 0 .9rem; background: var(--board-2); border-bottom: 2px solid var(--rule-strong); }
.heads > div { padding: .5rem .7rem .45rem; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); border-left: 1px solid var(--rule); }
.heads > div:first-child { border-left: 0; }
.heads b { display: block; color: var(--ink); font-size: .95rem; letter-spacing: .06em; }
.strips { overflow-y: auto; padding: .7rem calc(var(--cock) + .9rem) 1.2rem .9rem; display: flex; flex-direction: column; gap: .45rem; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.strip { display: grid; grid-template-columns: var(--cols); grid-auto-rows: minmax(3rem, auto); background: var(--strip); border: 1px solid var(--rule-strong); flex: none; }
.strip.cocked { transform: translateX(var(--cock)); }
.strip.current { box-shadow: 0 0 0 3px var(--ink); }
.cell { padding: .42rem .65rem; border-left: 1px solid var(--rule-strong); min-width: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: .08rem; }
.cell:first-child { border-left: 0; }
.cell.sub { border-top: 1px solid var(--rule); }
.cell .v { font-size: 1.12rem; font-weight: 700; overflow-wrap: break-word; }
.cell .s { font-size: .9rem; color: var(--ink-2); overflow-wrap: break-word; }
.cell .t { font: .9rem var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 0 .5rem; align-items: center; }
.cell .state { font-size: .9rem; }
.c-sensed .t .nw { white-space: normal; overflow-wrap: anywhere; }
/* The time leads the strip, as on a real one. */
.c-time .v { font-size: 1.32rem; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em; }
.c-time .v .ms { font-size: .95rem; letter-spacing: 0; }
.c-wide { grid-column: 4 / 7; }
.c-wide .v { font-weight: 400; }
.c-wide .v b { font-weight: 700; }
.struck { text-decoration: line-through; text-decoration-thickness: 2px; }
.tag { align-self: center; font: 700 .76rem var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: .08rem .35rem; border: 1.5px solid currentColor; border-radius: 2px; color: var(--ink-2); }
button.cell { text-align: left; background: transparent; border-top: 0; border-right: 0; border-bottom: 0; cursor: pointer; }
button.cell.sub { border-top: 1px solid var(--rule); }
button.cell:hover { background: var(--wash); }
button.cell.picked { background: var(--wash); box-shadow: inset 0 0 0 3px var(--action); }
.team { grid-column: 4 / 7; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-left: 1px solid var(--rule-strong); border-top: 1px solid var(--rule); background: var(--wash); }
.team > div { padding: .4rem .65rem; border-left: 1px solid var(--rule); min-width: 0; }
.team > div:first-child { border-left: 0; }
.team .who { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; font-size: .84rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; }
.team .who span { font: .84rem var(--mono); letter-spacing: 0; text-transform: none; font-weight: 400; }
.team .v { font-size: 1rem; font-weight: 700; margin-top: .12rem; overflow-wrap: break-word; }
.team .s { font-size: .88rem; color: var(--ink-2); overflow-wrap: break-word; }
.team .wait { color: var(--muted); font-weight: 400; }
.quiet { grid-auto-rows: minmax(2.2rem, auto); border-color: var(--rule); color: var(--ink-2); }
.quiet .cell { border-left-color: var(--rule); padding-block: .3rem; justify-content: center; }
.quiet .v { font-size: .92rem; font-weight: 400; }
.quiet .c-time .v { font-size: 1rem; letter-spacing: 0; }
.quiet .mark { width: 1.1rem; height: 1.1rem; } .quiet .mark svg { width: .75rem; height: .75rem; }
.quiet .state { font-size: .8rem; }
.specimen { border-style: dashed; border-color: var(--rule); color: var(--ink-2); }
.specimen .cell { border-left-style: dashed; border-left-color: var(--rule); }
.specimen .v, .specimen .c-time .v { font-weight: 400; font-size: 1rem; }
.hint { padding: 1.2rem .2rem 0; margin: 0; max-width: 46rem; color: var(--ink-2); font-size: 1rem; }
.hint kbd { font: 700 .85rem var(--mono); border: 1.5px solid var(--rule-strong); border-radius: 2px; padding: 0 .35rem; color: var(--ink); }
/* When a panel holds more than fits, say so on a clean edge instead of cutting a strip in half. */
.more { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: center; gap: .5rem; padding: .4rem 1rem; border: 0; border-top: 2px solid var(--rule-strong); background: var(--board-2); font-weight: 700; font-size: .9rem; cursor: pointer; width: 100%; }
.more:hover { background: var(--strip); }
.more[hidden] { display: none; }

/* Side: chart and readout */
.side { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--strip); border-left: 2px solid var(--rule-strong); position: relative; }
.chart { padding: .5rem 1rem .45rem; border-bottom: 2px solid var(--rule-strong); }
.chart h2, .read h2 { margin: 0 0 .25rem; font-size: 1.05rem; }
.chart svg.city { display: block; width: 100%; height: auto; max-height: 26vh; }
.city .road { stroke: var(--rule); stroke-width: 2; }
.city .trail { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
.city .zone { fill: var(--strip); stroke: var(--ink); stroke-width: 2; }
.city .zone.held { stroke-width: 6; }
.city .scene { fill: none; stroke: var(--ink); stroke-width: 2.5; }
.city text { fill: var(--ink); font-family: var(--font); font-size: 15.5px; }
.city text.small { font-size: 13px; fill: var(--ink-2); letter-spacing: .05em; }
.city text.id { font-family: var(--mono); font-size: 13.5px; font-weight: 700; }
.city .solid { fill: var(--ink); stroke: var(--strip); stroke-width: 2; }
.city .hollow { fill: var(--strip); stroke: var(--ink); stroke-width: 2.5; }
.city [data-tip] { cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: .2rem 1rem; margin: .3rem 0 0; padding: 0; list-style: none; font-size: .82rem; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: .35rem; }
.legend svg { width: 1rem; height: 1rem; }
.read { overflow-y: auto; padding: .55rem 1rem .6rem; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.read section + section { margin-top: .55rem; padding-top: .5rem; border-top: 1px solid var(--rule); }
.read p { margin: .2rem 0; font-size: .95rem; }
.read .big { font-size: 1.2rem; font-weight: 700; }
.read .dim { color: var(--ink-2); }
.read ul { margin: .25rem 0 0; padding: 0; list-style: none; }
.read li { display: flex; gap: .5rem; align-items: baseline; padding: .12rem 0; font-size: .92rem; }
.read li .mark { align-self: flex-start; width: 1.25rem; height: 1.25rem; } .read li .mark svg { width: .85rem; height: .85rem; }
.read li .mono { font-size: .86rem; color: var(--ink-2); white-space: nowrap; }
/* The explanation of a decision or a held action: a ruled ladder of what happened, in order, then the gate, the sources, the margins. */
.read h3 { margin: .55rem 0 .15rem; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; }
.read .lead { font-weight: 700; font-size: 1rem; }
.read ol.ladder { margin: .25rem 0 0; padding: 0; list-style: none; border-left: 2px solid var(--rule-strong); }
.read ol.ladder li { display: grid; grid-template-columns: 4.3rem 4.4rem minmax(0, 1fr); column-gap: .5rem; align-items: baseline; padding: .2rem 0 .2rem .6rem; border-bottom: 1px solid var(--rule); font-size: .9rem; }
.read ol.ladder .at { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.read ol.ladder .who { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; }
.read li.flip b { white-space: normal; }
.read .go { margin-top: .65rem; padding: .45rem .8rem; background: transparent; color: var(--action); border: 0; box-shadow: inset 0 0 0 2px var(--action); border-radius: 3px; font: inherit; font-weight: 700; font-size: .92rem; cursor: pointer; }
.read .go:hover { background: var(--wash); }
.read .go:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
.meter { position: relative; height: 1rem; background: var(--board-2); border-radius: 0 4px 4px 0; margin: .45rem 0 1.4rem; }
.meter .fill { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 0 4px 4px 0; transition: width .25s var(--ease); }
.meter .tick { position: absolute; top: -.25rem; bottom: -.25rem; border-left: 2px solid var(--strip); outline: 1px solid var(--muted); }
.meter .tick span { position: absolute; top: 1.4rem; left: 0; transform: translateX(-50%); font-size: .8rem; color: var(--ink-2); white-space: nowrap; }
.scoreline { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.scoreline .num { font-size: 1.5rem; font-weight: 700; }
.cite b { font: 700 .86rem var(--mono); white-space: nowrap; }
.empty { color: var(--muted); font-size: .95rem; }

/* Scrubber */
.scrub { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto auto; gap: .6rem; align-items: center; padding: .5rem 1.25rem; border-top: 2px solid var(--rule-strong); background: var(--strip); }
.scrub input[type=range] { width: 100%; accent-color: var(--action); height: 1.5rem; }
.scrub .where { font: .88rem var(--mono); color: var(--ink-2); white-space: nowrap; min-width: 17rem; text-align: right; overflow: hidden; text-overflow: ellipsis; }
.step { width: 2.4rem; height: 2.1rem; padding: 0; justify-content: center; }

.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--strip); font-size: .85rem; padding: .35rem .55rem; border-radius: 3px; max-width: 18rem; opacity: 0; transition: opacity .12s; }
.tip.on { opacity: 1; }

/* Motion: strips feed in, boxes stamp, a held strip slides out of line. Nothing else moves. */
@keyframes feed { from { opacity: .3; translate: 3rem 0; } to { opacity: 1; translate: 0 0; } }
@keyframes stamp { 0%, 25% { background: var(--ink); color: var(--strip); } 100% { background: transparent; } }
@keyframes ink { 0%, 25% { color: var(--strip); } }
@keyframes cock { from { transform: translateX(0); } to { transform: translateX(var(--cock)); } }
.fresh { animation: feed .4s var(--ease); }
.stamped { animation: stamp .75s var(--ease); }
.stamped .s, .stamped .t, .stamped .who, .stamped .who span { animation: ink .75s var(--ease); }
.cocking { animation: cock .6s var(--ease); }
@media (prefers-reduced-motion: reduce) { .fresh, .stamped, .stamped *, .cocking, .meter .fill, .key { animation: none; transition: none; } }

@media (max-width: 1500px) {
  :root { --cock: 2.4rem; --cols: 8.2rem minmax(0, 1.15fr) minmax(9.1rem, .9fr) minmax(0, 2fr) minmax(7.6rem, .72fr) minmax(0, 1.3fr); }
  .c-time .v { font-size: 1.2rem; }
  .c-gate .t { display: none; }
  .cell { padding: .32rem .6rem; }
  .cell .t { font-size: .84rem; }
  .team > div { padding: .3rem .6rem; }
}
/* Narrower screens: side moves under the rack, then strips unfold into labelled blocks. */
@media (max-width: 1180px) {
  body { height: auto; min-height: 100vh; overflow: visible; }
  main { grid-template-columns: minmax(0, 1fr); }
  .strips { overflow: visible; }
  .side { grid-template-rows: auto auto; border-left: 0; border-top: 2px solid var(--rule-strong); }
  .read { overflow: visible; }
  .more { display: none; }
  .head { grid-template-columns: 1fr; gap: .6rem; }
  .sim { display: inline; }
  .span { justify-content: flex-start; flex-wrap: wrap; }
  .scrub { position: sticky; bottom: 0; grid-template-columns: auto auto minmax(0, 1fr) auto; }
  .scrub .where, .scrub .speed { display: none; }
}
@media (max-width: 760px) {
  :root { --cock: 1rem; }
  .heads { display: none; }
  .name { flex-wrap: wrap; row-gap: .1rem; white-space: normal; }
  .strips { padding: .6rem calc(var(--cock) + .6rem) 1rem .6rem; }
  .strip { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-auto-rows: auto; }
  .strip > .cell, .strip > .team { grid-column: 1 / -1 !important; grid-row: auto !important; border-left: 0; border-top: 1px solid var(--rule); }
  .strip > .c-time { border-top: 0; flex-direction: row; gap: .75rem; align-items: baseline; }
  .strip > .c-sensed, .strip > .c-vouched { grid-column: auto !important; }
  .strip > .c-vouched { border-left: 1px solid var(--rule); }
  .cell[data-label]::before { content: attr(data-label); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .team { grid-template-columns: 1fr; }

    <button class="ghost" id="theme" type="button" aria-pressed="false" title="Dark board (D)"><svg class="i" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 3v14" /><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg><span class="sr">Dark board</span></button>

<script>
"use strict";
/* Everything on this page is derived from the event list: state = reduce(events up to the cursor).
   The rack is then reconciled in place, box by box, so a box that did not change keeps its node
   and a box that just filled can animate. Event text is always inserted as text, never as markup. */

const ICON = {
  check: "M4 10.5l4 4 8-9", cross: "M5 5l10 10M15 5L5 15", warn: "M10 3.2l7.3 12.6H2.7zM10 8.4v3.6M10 14.4v.1",
  hold: "M10 2.8a7.2 7.2 0 1 0 0 14.4a7.2 7.2 0 0 0 0-14.4zM6.4 10h7.2", wait: "M10 2.8a7.2 7.2 0 1 0 0 14.4a7.2 7.2 0 0 0 0-14.4zM10 6v4.2l2.8 1.8",
};
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") node.className = v; else if (k === "on") for (const [ev, fn] of Object.entries(v)) node.addEventListener(ev, fn);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid);
  return node;
}
function svg(tag, attrs, ...kids) {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) node.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid != null) node.append(kid);
  return node;
}
const icon = name => svg("svg", { class: "i", viewBox: "0 0 20 20", "aria-hidden": "true" }, svg("path", { d: ICON[name] }));
const mark = (tone, name) => el("span", { class: "mark " + tone }, icon(name));
const state = (tone, name, word) => el("span", { class: "state" }, mark(tone, name), word);

const VERDICT = {
  trusted: ["good", "check", "Trusted"], suspicious: ["warning", "warn", "Suspicious"],
  untrusted: ["critical", "cross", "Untrusted"], unavailable: ["critical", "wait", "No verdict"],
};
const READING = { citizen_activity: "Citizen sighting", cctv_anomaly: "Camera anomaly", gunshot: "Gunshot sensor", emergency_call: "Emergency call", unit_status: "Unit report", traffic_camera: "Traffic camera", water_level: "Water level sensor", power_load: "Power load meter", air_quality: "Air quality sensor" };
const FIELD = { level_m: ["level", "m"], flow_rate_m3s: ["flow", "m³/s"], congestion_score: ["congestion", ""], avg_speed_kmh: ["speed", "km/h"], vehicle_count: ["vehicle count", ""], load_kw: ["load", "kW"], voltage_v: ["voltage", "V"], aqi: ["AQI", ""], pm25_ugm3: ["PM2.5", "µg/m³"], pm10_ugm3: ["PM10", "µg/m³"] };
const INCIDENT = { jam: "traffic jam", overload: "power overload", smog: "smog" };  /* the other types (crime, fire, flood, accident) read as they are */
const CHECK = { trust: "evidence not trusted", trust_ref: "no trusted verdict", evidence: "too few trusted sources", quarantine: "actuator quarantined", resources: "no unit available", budget: "action budget spent", capability: "Twin cannot do this", surprise: "reading far outside its history", allowlist: "outside the department's remit", schema: "call breaks the contract", human_approval: "needs human approval", incident: "incident already closed", cooling: "driven too recently",
  replay_or_out_of_order: "replayed or out of order", signature_invalid: "signature does not match", signature_missing: "not signed", schema_invalid: "breaks the contract", value_invalid: "value breaks the contract", bad_contract_version: "unknown contract version", reading_stale: "too old or too new" };
const UNIT = { en_route: "en route", pursuing: "pursuing", in_position: "in position", on_scene: "on scene", apprehended: "suspect apprehended", lost: "lost the suspect", returning: "returning to station", returned: "its last unit is back" };
const POSTED = { pursuit: "pursuit", contain: "perimeter" };  /* anything else was sent to the scene */

const pad = (n, w = 2) => String(n).padStart(w, "0");
function clockParts(ms) { const d = new Date(ms); return [`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`, `.${pad(d.getMilliseconds(), 3)}`]; }
const clock = ms => clockParts(ms).join("");
const plural = (n, word) => `${n} ${word.toLowerCase()}${n === 1 ? "" : "s"}`;

/* ---------------------------------------------------------------- reducer */

function reduce(events, upto) {
  const s = { heldById: new Map(), zones: new Map(), topology: null, strips: [], byTrace: new Map(), decisions: new Map(), unitRow: new Map(),
    incidents: new Map(), suspects: new Map(), units: new Map(), alerts: new Set(), held: new Set(),
    scenario: null, finished: null, guardianDown: false, t0: null, tEnd: null, last: null, team: null, crew: null,
    c: newCanopyState(),
    attention: { lit: new Map(), waiting: new Set(), uncovered: new Map(), funnel: { readings: 0, salient: 0, lit: 0, runs: 0, actions: 0 } } };
  for (let i = 0; i < upto; i++) apply(s, events[i], i);
  s.last = upto ? events[upto - 1] : null;
  return s;
}

function stripFor(s, e, i) {
  const trace = e.traceid || `free:${e.id}`;
  let strip = s.byTrace.get(trace);
  if (!strip) {
    strip = { trace, first: i, t0: Date.parse(e.time), rows: [], verdict: null, sensor: null, source: e.source };
    s.byTrace.set(trace, strip); s.strips.push(strip);
  }
  return strip;
}
const zoneName = (s, id) => (s.zones.get(id) || {}).name || id || "";
/* Server text names zones by id; the hall should read their names. */
const names = (s, text) => String(text || "").replace(/zone-\d+/g, id => zoneName(s, id));

function describe(s, action, params) {
  const where = zoneName(s, params.zone_id);
  if (action === "dispatch_unit" && params.mode === "pursuit") return [`Pursue ${params.target_id}`, `one ${params.unit_type} unit, starting in ${where}`];
  if (action === "dispatch_unit" && params.mode === "contain") return [`Hold ${where}`, `one ${params.unit_type} unit on the perimeter`];
  if (action === "dispatch_unit" && params.unit_type === "police") return [`Send a ${params.unit_type} unit`, `to the scene in ${where}, after no one in particular`];
  if (action === "dispatch_unit") return [`Send ${params.unit_type === "ambulance" ? "an ambulance" : `a ${params.unit_type} unit`}`, `to the scene in ${where}`];

/* items: [{key, sig, make, touch?}]. A node is rebuilt only when its signature changes, and only
   nodes that are out of place are moved, so an animation in progress on an untouched node keeps running. */
function reconcile(parent, items) {
  const known = parent._known || new Map(), next = new Map(), nodes = [];
  for (const item of items) {
    let entry = known.get(item.key);
    if (!entry || entry.sig !== item.sig) entry = { sig: item.sig, node: item.make() };
    next.set(item.key, entry); nodes.push(entry.node);
    if (item.touch) item.touch(entry.node);
  }
  parent._known = next;
  nodes.forEach((node, k) => { if (parent.children[k] !== node) parent.insertBefore(node, parent.children[k] || null); });
  while (parent.children.length > nodes.length) parent.lastElementChild.remove();
  return nodes;
}

  const raw = new Map(zones.map((z, k) => { const a = 2 * Math.PI * k / zones.length; return [z.id, hasXY ? [z.x, z.y] : [1 + Math.cos(a), 1 + Math.sin(a)]]; }));
  const xs = [...raw.values()].map(p => p[0]), ys = [...raw.values()].map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const P = id => {
    const [x, y] = raw.get(id), u = maxX === minX ? .5 : (x - minX) / (maxX - minX), v = maxY === minY ? .5 : (y - minY) / (maxY - minY);
    const vv = .12 + v * .72, scale = far + (near - far) * vv, px = bx + bw / 2 + (u - .5) * bw * .86 * scale;
    return [px, by + vv * bh, scale];
  };
  for (const [a, b] of topo.adjacency) { const [x1, y1] = P(a), [x2, y2] = P(b); board.append(svg("line", { class: "road", x1, y1, x2, y2 })); }
  const scenes = new Set([...s.incidents.values()].filter(i => i.status === "open").map(i => i.zone));
  const spots = new Map();
  for (const z of zones) {
    const [x, y, k] = P(z.id), held = s.held.has(z.id), r = 11 * k + 3;
    spots.set(z.id, [x, y, k]);
    const node = svg("g", { "data-tip": `${z.name}${held ? " · held by a unit" : ""}${scenes.has(z.id) ? " · incident scene" : ""}`, tabindex: "0" });
    if (scenes.has(z.id)) node.append(svg("circle", { class: "scene", cx: x, cy: y, r: r + 9 * k }));
    node.append(svg("circle", { class: "zone" + (held ? " held" : ""), cx: x, cy: y, r }));
    const label = svg("text", { x, y: y + r + 14, "text-anchor": "middle" }); label.textContent = z.name; node.append(label);
    if (s.alerts.has(z.id)) { const t = svg("text", { class: "small", x, y: y + r + 27, "text-anchor": "middle" }); t.textContent = "ALERT SENT"; node.append(t); }
    board.append(node);
  }
  for (const sus of s.suspects.values()) {
    if (sus.level === "none" || !spots.has(sus.zone)) continue;
    const [x, y, k] = spots.get(sus.zone), cx = x - 20 * k - 6, cy = y - 16 * k, size = 8 * k + 3;
    const node = svg("g", { "data-tip": `${sus.id} · ${sus.level === "suspect" ? "suspect" : "person of interest"} · score ${Number(sus.score).toFixed(2)}`, tabindex: "0" },
      svg("path", { class: sus.level === "suspect" ? "solid" : "hollow", d: `M${cx} ${cy - size}l${size} ${size}-${size} ${size}-${size}-${size}z` }));
    const id = svg("text", { class: "small", x: cx - size - 3, y: cy + 4, "text-anchor": "end" }); id.textContent = sus.id; node.append(id); board.append(node);
  }
  const stack = new Map(), targets = [];
  for (const u of s.units.values()) {
    if (!spots.has(u.zone)) continue;
    const [x, y, k] = spots.get(u.zone), n = stack.get(u.zone) || 0; stack.set(u.zone, n + 1);
    const cx = x + (20 + n * 6) * k, cy = y - (16 + n * 14) * k, size = 9 * k + 3;
    const node = svg("g", { "data-tip": `${u.id} · ${POSTED[u.mode] || "sent to the scene"} · ${UNIT[u.state] || u.state}`, tabindex: "0" },
      svg("path", { class: u.mode === "pursuit" ? "solid" : "hollow", d: `M${cx} ${cy - size}l${size} ${size * 1.8}h${-2 * size}z` }));
    const id = svg("text", { class: "small", x: cx + size + 3, y: cy + size }); id.textContent = u.id.replace(/^unit-/, ""); node.append(id); board.append(node);
    targets.push([cx, cy - size]);
  }
  for (const id of s.alerts) if (spots.has(id)) { const [x, y, k] = spots.get(id); targets.push([x - (14 * k + 6), y - 11 * k]); }
  /* The puppeteer's crossbar sits under the gate; each string hangs from it to its target. */
  if (!targets.length) return;
  const left = gate.x + gate.w * .08, right = gate.x + gate.w * .92, barY = gate.y + gate.h + 7;
  strings.append(svg("line", { class: "bar", x1: left, y1: barY, x2: right, y2: barY }));
  targets.sort((p, q) => p[0] - q[0]).forEach(([tx, ty], k) => {
    const hx = left + (right - left) * (targets.length === 1 ? .5 : k / (targets.length - 1));
    strings.append(svg("path", { class: "string", d: `M${hx} ${barY} C${hx} ${barY + (ty - barY) * .5}, ${tx} ${ty - (ty - barY) * .5}, ${tx} ${ty}` }), svg("circle", { class: "hand", cx: tx, cy: ty, r: 3.5 }));
  });
}

function renderSleepBox(s) {
  const boxEl = $("sleepbox"), r = sleepReport, c = s.c.sleep;
  boxEl.classList.toggle("shown", !!c.state);
  const rows = [];
  rows.push(el("h2", {}, "Sleep", el("button", { class: "ghost", type: "button", id: "sleepnow", on: { click: sleepNow } }, c.state === "sleeping" ? "Sleeping" : "Sleep now")));
  if (!r) rows.push(el("p", {}, "The Brain has not slept yet. Quiet time is for learning: it replays what it kept and promotes only what passes every check."));
  else {
    rows.push(el("p", {}, `Last sleep: ${plural(r.episodes, "episode")} read, ${plural((r.promoted || []).length, "lesson")} promoted, ${(r.rejected || []).length} turned away.`));
    rows.push(el("ul", {},
      ...(r.promoted || []).map(p => el("li", {}, mark("good", "check"), el("span", {}, `${p.rule} promoted: for a crime in ${zoneName(s, (p.signature || [])[0])} with the suspect last seen in ${zoneName(s, (p.signature || [])[1])}${(p.signature || [])[2] ? ` heading to ${zoneName(s, p.signature[2])}` : ""}, the team's plan now runs as a reflex. It passed ${(p.checks || []).map(c => c.name).join(", ")}.`))),
      ...(r.rejected || []).map(p => el("li", {}, mark("critical", "cross"), el("span", {}, `${p.rule} stopped at ${p.check}: ${p.reason}`)))));
  }
  boxEl.replaceChildren(...rows);
}
async function sleepNow() {
  try { const r = await fetch("/api/sleep", { method: "POST" }); if (!r.ok) throw new Error((await r.json()).detail || r.statusText); } catch (error) { alertLine(`Could not sleep: ${error.message}`); }
}

function setView(next) {
  view = next === "canopy" ? "canopy" : "strip";
  document.body.dataset.view = view; $("canopy").hidden = view !== "canopy"; $("view").setAttribute("aria-pressed", String(view === "canopy"));
  $("view").lastChild.textContent = view === "canopy" ? "Strips" : "Canopy";
  if (view !== "canopy") delete document.body.dataset.world;
  loadSleep();
  render();
}
/* Quiet time: with nothing arriving for a while and no run in play, the brain sleeps and the sleep report comes forward. */
setInterval(() => {
  const asleep = view === "canopy" && live && !running && events.length > 0 && Date.now() - lastEventWall > 6000;
  if ($("canopy").classList.contains("asleep") !== asleep) { $("canopy").classList.toggle("asleep", asleep); if (asleep) loadSleep(); }
}, 1000);

/* Deep links for rehearsal and screenshots: ?theme=dark, ?view=canopy, ?pick=dec-0002, ?at=23 */
const query = new URLSearchParams(location.search);
if (query.get("theme") === "dark") toggleTheme();
const startAt = query.has("at") ? Number(query.get("at")) : null;

/* Which view opens first: ?view= wins, then the Brain's own setting (brain.default_view), then the strips. */
fetch("/health").then(r => r.json()).then(h => setView(query.get("view") || h.default_view)).catch(() => setView(query.get("view")));
loadScenarios(); connect(); render();
/* Applied once the backlog has replayed: the replay begins with a reset, which clears any selection. */
setTimeout(() => { if (query.get("pick")) picked = query.get("pick"); startAt != null ? go(startAt) : render(); }, 600);
</script>
