[project]
name = "brain"
version = "0.1.0"
description = "City Brain layer: department agents over a city knowledge graph, behind a deterministic actuation gate"
authors = [
    { name = "City Brain team (triplet-03)" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.12",
    "neo4j>=5.26",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "ortools>=9.15.6755",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
brain = "brain.cli:main"

[project.optional-dependencies]
llm = [
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.6",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
]
mqtt = [
    "aiomqtt>=2.3",
]
otel = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
# Pyflakes (unused and undefined names), import order, bugbear, and blind excepts. A broad `except Exception` is deliberate where the Brain
# must outlive a partner or a collector; each one carries `noqa: BLE001` and, where the line does not already say, the reason.
select = ["F", "I", "B", "BLE"]
ignore = [
    "B023",  # a closure built in a loop and called in the same pass: every case here is safe
    "B905",  # zip(strict=...): the pairs are always of equal length by construction
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811", "F841", "B008"]  # a fixture is named in the signature that uses it; a few tests keep a value for the reader
"docs/diagrams/*.py" = ["F841"]        # a drawing names each box it places, whether or not a line is drawn to it
