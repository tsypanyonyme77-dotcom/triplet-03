<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three ways the Guardian can be wired. Panel A: our contract, where the Brain sends each reading to the Guardian and acts on the verdict. Panel B: the Guardian team's contract 1.0, where the Twin also sends readings to the Guardian, the Brain asks for verdicts by id, and valve, grid, signal and dispatch calls pass through the Guardian to the Twin. Panel C: inline, where the verdict rides with the reading; built in the Brain, offered by no Guardian." viewBox="0 0 1240 984" width="1240" height="984"><title>The Guardian wired three ways</title><style>
svg { font-family: Arial, Helvetica, sans-serif; }
.box, .card { fill: #fff; stroke: #000; stroke-width: 1.4; }
.box.new, .card.new { fill: #e3e3e3; }
.box.partner, .card.partner { fill: #fff; stroke-dasharray: 6 4; }
.box.gate, .card.gate { fill: #fff; stroke-width: 3.2; }
.frame { fill: none; stroke: #777; stroke-width: 1.2; }
.tile { fill: #fff; stroke: #999; stroke-width: 1; }
.arrow { fill: none; stroke: #000; stroke-width: 1.6; }
.arrow.ember { stroke-dasharray: 7 4; stroke-width: 2.2; }
.headfill, .headember { fill: #000; }
.t { font: 700 15px Arial, Helvetica, sans-serif; fill: #000; }
.s { font: 400 12.5px Arial, Helvetica, sans-serif; fill: #222; }
.k { font: 400 12px "Courier New", monospace; fill: #333; letter-spacing: .04em; }
.an { font: 400 12px Arial, Helvetica, sans-serif; fill: #333; text-transform: uppercase; letter-spacing: .06em; }
.cortex { fill: #f1f1f1; stroke: #000; stroke-width: 1.4; }
.cbl { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; stroke-dasharray: 3 4; }
.stem { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; }
.wire { fill: none; stroke: #444; stroke-width: 1.5; }
.wire.out { stroke: #000; stroke-width: 2.4; stroke-dasharray: 7 4; }
.tipfill { fill: #000; }
.dot { fill: #555; stroke: #000; stroke-width: 1; }
.dot.gate { fill: #000; }
.dot.agent { fill: #fff; stroke-width: 2.4; }
.dot.twin { fill: #fff; stroke-dasharray: 3 2; }
image { filter: grayscale(1) contrast(1.1); }
</style><rect width="100%" height="100%" fill="#fff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headfill"/></marker><marker id="headember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headember"/></marker></defs><g><rect class="box partner" x="20" y="48" width="220" height="112" rx="6"/><text class="t" x="34" y="74">Twin</text><text class="s" x="34" y="94">Streams signed readings, runs</text><text class="s" x="34" y="110">actuator calls.</text><text class="s" x="34" y="126">Today: the Brain's mock.</text></g><g><rect class="box partner" x="1000" y="48" width="220" height="112" rx="6"/><text class="t" x="1014" y="74">Guardian</text><text class="s" x="1014" y="94">Our mock: scripted verdicts, a</text><text class="s" x="1014" y="110">bad signature is always</text><text class="s" x="1014" y="126">untrusted.</text></g><g><rect class="box " x="500" y="223" width="240" height="132" rx="6"/><text class="t" x="514" y="249">City Brain</text><text class="s" x="514" y="269">Perception, then the Guardian's</text><text class="s" x="514" y="285">verdict, then the gate. Adapter:</text><text class="s" x="514" y="301">guardian_rest.py.</text></g><rect class="frame " x="10" y="8" width="1220" height="371" rx="10"/><text class="k" x="24" y="28">A · THE DEFAULT, OUR CONTRACT · guardian.adapter: rest · what the mock Guardian speaks</text><path class="arrow " d="M160 160 V249 H500" marker-end="url(#head)"/><text class="k" x="172" y="243" text-anchor="start">readings · MCP, HTTP or MQTT</text><path class="arrow ember" d="M500 287 H100 V160" marker-end="url(#headember)"/><text class="k" x="172" y="281" text-anchor="start">signed calls · all six actions</text><path class="arrow " d="M740 249 H1040 V160" marker-end="url(#head)"/><text class="k" x="750" y="243" text-anchor="start">POST /verdicts with the reading</text><path class="arrow " d="M1190 160 V323 H740" marker-end="url(#head)"/><text class="k" x="750" y="317" text-anchor="start">TrustVerdict</text><text class="k" x="750" y="369" text-anchor="start">the gate asks GET /quarantine/{id} before any call</text><g><rect class="box partner" x="20" y="437" width="220" height="112" rx="6"/><text class="t" x="34" y="463">Twin</text><text class="s" x="34" y="483">Streams signed readings, runs</text><text class="s" x="34" y="499">actuator calls.</text><text class="s" x="34" y="515">Today: the Brain's mock.</text></g><g><rect class="box partner" x="1000" y="437" width="220" height="150" rx="6"/><text class="t" x="1014" y="463">Guardian</text><text class="s" x="1014" y="483">The Guardian team's: six trust</text><text class="s" x="1014" y="499">layers, signed verdicts,</text><text class="s" x="1014" y="515">audits every actuator call,</text><text class="s" x="1014" y="531">checks its effect,</text><text class="s" x="1014" y="547">quarantines.</text></g><g><rect class="box " x="500" y="612" width="240" height="132" rx="6"/><text class="t" x="514" y="638">City Brain</text><text class="s" x="514" y="658">Adapter: guardian_v1.py.</text><text class="s" x="514" y="674">GuardianV1Adapter asks;</text><text class="s" x="514" y="690">GuardianGateway routes the gate's</text><text class="s" x="514" y="706">calls.</text></g><rect class="frame " x="10" y="397" width="1220" height="371" rx="10"/><text class="k" x="24" y="417">B · THE GUARDIAN TEAM'S GUARDIAN, CONTRACT 1.0 · guardian.adapter: v1 (gateway: true), twin.dialect: guardian-v1 · run against theirs piece by piece</text><path class="arrow " d="M160 549 V638 H500" marker-end="url(#head)"/><text class="k" x="172" y="632" text-anchor="start">readings · MCP, HTTP or MQTT</text><path class="arrow ember" d="M500 676 H100 V549" marker-end="url(#headember)"/><text class="k" x="172" y="670" text-anchor="start">signed calls · broadcast, recall</text><path class="arrow " d="M740 638 H1040 V587" marker-end="url(#head)"/><text class="k" x="750" y="632" text-anchor="start">POST /v1/verdicts/request by id</text><path class="arrow " d="M1190 587 V712 H740" marker-end="url(#head)"/><text class="k" x="750" y="706" text-anchor="start">signed verdict</text><path class="arrow ember" d="M740 676 H1100 V587" marker-end="url(#headember)"/><text class="k" x="750" y="670" text-anchor="start">actuator calls: valve, grid, signal, dispatch</text><path class="arrow " d="M240 467 H1000" marker-end="url(#head)"/><text class="k" x="620" y="459" text-anchor="middle">POST /v1/readings: the Twin pushes (or the Guardian pulls)</text><path class="arrow ember" d="M1000 513 H240" marker-end="url(#headember)"/><text class="k" x="620" y="505" text-anchor="middle">POST /tools/{action}: audited calls forwarded, and containment</text><text class="k" x="750" y="758" text-anchor="start">the gate asks GET /v1/containment before any call</text><rect class="frame " x="10" y="786" width="1220" height="176" rx="10"/><text class="k" x="24" y="806">C · INLINE · guardian.mode: inline · built in the Brain (runtime._verdict), offered by no Guardian, no test</text><g><rect class="box partner" x="30" y="822" width="200" height="96" rx="6"/><text class="t" x="44" y="848">Twin</text><text class="s" x="44" y="868">Streams readings.</text></g><g><rect class="box partner" x="520" y="822" width="200" height="96" rx="6"/><text class="t" x="534" y="848">Guardian, inline</text><text class="s" x="534" y="868">Judges each reading,</text><text class="s" x="534" y="884">attaches the verdict as</text><text class="s" x="534" y="900">reading.trust.</text></g><g><rect class="box " x="1010" y="822" width="200" height="96" rx="6"/><text class="t" x="1024" y="848">City Brain</text><text class="s" x="1024" y="868">Reads reading.trust and</text><text class="s" x="1024" y="884">asks nobody. With no trust</text><text class="s" x="1024" y="900">it asks as in A.</text></g><path class="arrow " d="M230 870 H520" marker-end="url(#head)"/><text class="k" x="375" y="862" text-anchor="middle">readings</text><path class="arrow " d="M720 870 H1010" marker-end="url(#head)"/><text class="k" x="865" y="862" text-anchor="middle">reading + verdict</text><text class="k" x="30" y="928" text-anchor="start">Not used by the Brain in any panel: the Guardian's WS /v1/ws/verdicts, GET /v1/alerts and GET /v1/threat.</text><text class="k" x="30" y="941" text-anchor="start">The Brain learns of a threat only from a verdict or a quarantine.</text></svg>
