<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The City Brain between the Twin and the Guardian. The Twin sends readings to the Brain and, with the Guardian team's Guardian, to the Guardian too. The Guardian sends verdicts to the Brain, audits the Brain's actuator calls on their way to the Twin, and contains devices." viewBox="0 0 1240 720" width="1240" height="720"><title>The City Brain between its partners</title><style>
svg { font-family: Arial, Helvetica, sans-serif; }
.box, .card { fill: #fff; stroke: #000; stroke-width: 1.4; }
.box.new, .card.new { fill: #e3e3e3; }
.box.partner, .card.partner { fill: #fff; stroke-dasharray: 6 4; }
.box.gate, .card.gate { fill: #fff; stroke-width: 3.2; }
.frame { fill: none; stroke: #777; stroke-width: 1.2; }
.tile { fill: #fff; stroke: #999; stroke-width: 1; }
.arrow { fill: none; stroke: #000; stroke-width: 1.6; }
.arrow.ember { stroke-dasharray: 7 4; stroke-width: 2.2; }
.headfill, .headember { fill: #000; }
.t { font: 700 15px Arial, Helvetica, sans-serif; fill: #000; }
.s { font: 400 12.5px Arial, Helvetica, sans-serif; fill: #222; }
.k { font: 400 12px "Courier New", monospace; fill: #333; letter-spacing: .04em; }
.an { font: 400 12px Arial, Helvetica, sans-serif; fill: #333; text-transform: uppercase; letter-spacing: .06em; }
.cortex { fill: #f1f1f1; stroke: #000; stroke-width: 1.4; }
.cbl { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; stroke-dasharray: 3 4; }
.stem { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; }
.wire { fill: none; stroke: #444; stroke-width: 1.5; }
.wire.out { stroke: #000; stroke-width: 2.4; stroke-dasharray: 7 4; }
.tipfill { fill: #000; }
.dot { fill: #555; stroke: #000; stroke-width: 1; }
.dot.gate { fill: #000; }
.dot.agent { fill: #fff; stroke-width: 2.4; }
.dot.twin { fill: #fff; stroke-dasharray: 3 2; }
image { filter: grayscale(1) contrast(1.1); }
</style><rect width="100%" height="100%" fill="#fff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headfill"/></marker><marker id="headember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headember"/></marker></defs><g><rect class="box new" x="400" y="10" width="440" height="80" rx="6"/><text class="t" x="414" y="36">Other teams and their agents (Phase 2)</text><text class="s" x="414" y="56">Call the Brain's tools over MCP, read its agent card, run the</text><text class="s" x="414" y="72">conformance kit against it.</text></g><g><rect class="box " x="414" y="156" width="204" height="96" rx="6"/><text class="t" x="428" y="182">Ports and adapters</text><text class="s" x="428" y="202">Twin: MCP, HTTP or MQTT.</text><text class="s" x="428" y="218">Guardian: REST, or the v1</text><text class="s" x="428" y="234">contract.</text></g><g><rect class="box new" x="622" y="156" width="204" height="96" rx="6"/><text class="t" x="636" y="182">Senses and trust</text><text class="s" x="636" y="202">Contract, signature,</text><text class="s" x="636" y="218">replay, forward models,</text><text class="s" x="636" y="234">belief.</text></g><g><rect class="box new" x="414" y="290" width="204" height="96" rx="6"/><text class="t" x="428" y="316">Decide</text><text class="s" x="428" y="336">Reflex rules, OR-Tools</text><text class="s" x="428" y="352">engines, agent team,</text><text class="s" x="428" y="368">planning supervisor.</text></g><g><rect class="box new" x="622" y="290" width="204" height="96" rx="6"/><text class="t" x="636" y="316">Remember and learn</text><text class="s" x="636" y="336">City graph, Qdrant,</text><text class="s" x="636" y="352">episodes, sleep, bounded</text><text class="s" x="636" y="368">self-improvement.</text></g><g><rect class="box gate" x="414" y="396" width="412" height="80" rx="6"/><text class="t" x="428" y="422">Gate · the only way out</text><text class="s" x="428" y="442">Every call checked and signed. A person approves valve and</text><text class="s" x="428" y="458">grid calls.</text></g><rect class="frame " x="400" y="130" width="440" height="360" rx="10"/><text class="k" x="414" y="150">CITY BRAIN · THIS REPOSITORY</text><g><rect class="box partner" x="20" y="190" width="230" height="190" rx="6"/><text class="t" x="34" y="216">Twin · city engine</text><text class="s" x="34" y="236">The Twin team. Streams</text><text class="s" x="34" y="252">readings, runs actuator calls.</text><text class="s" x="34" y="268">MCP server. Today: a mock.</text></g><g><rect class="box partner" x="990" y="190" width="230" height="190" rx="6"/><text class="t" x="1004" y="216">Guardian · trust</text><text class="s" x="1004" y="236">The Guardian team. Judges every</text><text class="s" x="1004" y="252">reading, audits actuator calls,</text><text class="s" x="1004" y="268">quarantines devices.</text><text class="s" x="1004" y="284">REST service. Today: a mock,</text><text class="s" x="1004" y="300">and the team's own.</text></g><g><rect class="box new" x="400" y="526" width="440" height="80" rx="6"/><text class="t" x="414" y="552">People and operators</text><text class="s" x="414" y="572">The screen over SSE. An approver over REST with a scoped token.</text><text class="s" x="414" y="588">Grafana and Jaeger over OTLP and Prometheus.</text></g><path class="arrow " d="M250 214 H400" marker-end="url(#head)"/><text class="k" x="325" y="180" text-anchor="middle">readings</text><text class="k" x="325" y="193" text-anchor="middle">MCP · HTTP · MQTT</text><path class="arrow ember" d="M400 296 H250" marker-end="url(#headember)"/><text class="k" x="325" y="262" text-anchor="middle">signed calls</text><text class="k" x="325" y="275" text-anchor="middle">MCP tools</text><path class="arrow " d="M840 214 H990" marker-end="url(#head)"/><text class="k" x="915" y="180" text-anchor="middle">ask for a verdict</text><text class="k" x="915" y="193" text-anchor="middle">REST</text><path class="arrow " d="M990 296 H840" marker-end="url(#head)"/><text class="k" x="915" y="262" text-anchor="middle">signed verdict</text><text class="k" x="915" y="275" text-anchor="middle">+ quarantine list</text><path class="arrow ember" d="M840 344 H990" marker-end="url(#headember)"/><text class="k" x="915" y="312" text-anchor="middle">audited calls</text><text class="k" x="915" y="325" text-anchor="middle">v1 only</text><path class="arrow " d="M620 90 V130" marker-end="url(#head)"/><text class="k" x="632" y="100" text-anchor="start">MCP · A2A card · REST</text><path class="arrow " d="M620 490 V526" marker-end="url(#head)"/><text class="k" x="632" y="514" text-anchor="start">SSE · REST · OTLP · /metrics</text><path class="arrow ember" d="M1070 380 V646 H170 V380" marker-end="url(#headember)"/><path class="arrow " d="M70 380 V680 H1170 V380" marker-end="url(#head)"/><text class="k" x="620" y="638" text-anchor="middle">v1 only · audited calls forwarded to the Twin (POST /tools/{action}) and containment: isolate, quarantine</text><text class="k" x="620" y="698" text-anchor="middle">v1 only · readings the Twin pushes to the Guardian (POST /v1/readings) or the Guardian pulls · the Guardian forwards none of them to the Brain</text></svg>
