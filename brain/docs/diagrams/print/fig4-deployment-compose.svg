<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deployment with Docker Compose: a Brain container with persistent state, mock Twin and Guardian, Qdrant and Neo4j containers, optional observability, config as files and secrets from the environment. An offline hall kit sits beside it." viewBox="0 0 1240 616" width="1240" height="616"><title>Deployment with Docker Compose</title><style>
svg { font-family: Arial, Helvetica, sans-serif; }
.box, .card { fill: #fff; stroke: #000; stroke-width: 1.4; }
.box.new, .card.new { fill: #e3e3e3; }
.box.partner, .card.partner { fill: #fff; stroke-dasharray: 6 4; }
.box.gate, .card.gate { fill: #fff; stroke-width: 3.2; }
.frame { fill: none; stroke: #777; stroke-width: 1.2; }
.tile { fill: #fff; stroke: #999; stroke-width: 1; }
.arrow { fill: none; stroke: #000; stroke-width: 1.6; }
.arrow.ember { stroke-dasharray: 7 4; stroke-width: 2.2; }
.headfill, .headember { fill: #000; }
.t { font: 700 15px Arial, Helvetica, sans-serif; fill: #000; }
.s { font: 400 12.5px Arial, Helvetica, sans-serif; fill: #222; }
.k { font: 400 12px "Courier New", monospace; fill: #333; letter-spacing: .04em; }
.an { font: 400 12px Arial, Helvetica, sans-serif; fill: #333; text-transform: uppercase; letter-spacing: .06em; }
.cortex { fill: #f1f1f1; stroke: #000; stroke-width: 1.4; }
.cbl { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; stroke-dasharray: 3 4; }
.stem { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; }
.wire { fill: none; stroke: #444; stroke-width: 1.5; }
.wire.out { stroke: #000; stroke-width: 2.4; stroke-dasharray: 7 4; }
.tipfill { fill: #000; }
.dot { fill: #555; stroke: #000; stroke-width: 1; }
.dot.gate { fill: #000; }
.dot.agent { fill: #fff; stroke-width: 2.4; }
.dot.twin { fill: #fff; stroke-dasharray: 3 2; }
image { filter: grayscale(1) contrast(1.1); }
</style><rect width="100%" height="100%" fill="#fff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headfill"/></marker><marker id="headember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headember"/></marker></defs><rect class="frame " x="160" y="10" width="1060" height="520" rx="10"/><text class="k" x="174" y="30">DOCKER COMPOSE · PROJECT city-brain · PROFILE full</text><g><rect class="box new" x="190" y="50" width="300" height="112" rx="6"/><text class="t" x="204" y="76">Brain · container</text><text class="s" x="204" y="96">One instance. Health check on /health.</text><text class="s" x="204" y="112">Volumes for state and logs. Non-root.</text><text class="s" x="204" y="128">Ports: 8080 screen and API, /mcp,</text><text class="s" x="204" y="144">/metrics, on 127.0.0.1 only.</text></g><g><rect class="box partner" x="520" y="50" width="210" height="96" rx="6"/><text class="t" x="534" y="76">Twin mock</text><text class="s" x="534" y="96">Optional. Replace by</text><text class="s" x="534" y="112">pointing partners.yaml at</text><text class="s" x="534" y="128">the real Twin.</text></g><g><rect class="box partner" x="750" y="50" width="210" height="64" rx="6"/><text class="t" x="764" y="76">Guardian mock</text><text class="s" x="764" y="96">Optional. Same.</text></g><g><rect class="box new" x="980" y="50" width="220" height="128" rx="6"/><text class="t" x="994" y="76">Scenario run</text><text class="s" x="994" y="96">make full-scenario: brain</text><text class="s" x="994" y="112">scenario inside the Brain</text><text class="s" x="994" y="128">container, against the</text><text class="s" x="994" y="144">services. Exits non-zero on</text><text class="s" x="994" y="160">failure.</text></g><g><rect class="box new" x="190" y="250" width="220" height="80" rx="6"/><text class="t" x="204" y="276">Qdrant · container</text><text class="s" x="204" y="296">Knowledge and episode vectors.</text><text class="s" x="204" y="312">Volume.</text></g><g><rect class="box " x="430" y="250" width="220" height="80" rx="6"/><text class="t" x="444" y="276">Neo4j · container</text><text class="s" x="444" y="296">City graph, provenance,</text><text class="s" x="444" y="312">analytics. Volume.</text></g><g><rect class="box new" x="670" y="250" width="250" height="112" rx="6"/><text class="t" x="684" y="276">Config and .env</text><text class="s" x="684" y="296">partners.full.yaml, policy.yaml,</text><text class="s" x="684" y="312">models.yaml as files. Keys and</text><text class="s" x="684" y="328">tokens from .env, never in an</text><text class="s" x="684" y="344">image.</text></g><g><rect class="box new" x="940" y="250" width="260" height="96" rx="6"/><text class="t" x="954" y="276">Loopback ports</text><text class="s" x="954" y="296">Every published port is bound to</text><text class="s" x="954" y="312">127.0.0.1. One private network</text><text class="s" x="954" y="328">between the containers.</text></g><text class="k" x="1200" y="392" text-anchor="end">OBSERVABILITY PROFILE · OPTIONAL ON STAGE</text><g><rect class="box new" x="190" y="400" width="220" height="64" rx="6"/><text class="t" x="204" y="426">OTel collector</text><text class="s" x="204" y="446">Receives spans over OTLP.</text></g><g><rect class="box new" x="430" y="400" width="220" height="64" rx="6"/><text class="t" x="444" y="426">Jaeger</text><text class="s" x="444" y="446">One trace per reading.</text></g><g><rect class="box new" x="670" y="400" width="250" height="64" rx="6"/><text class="t" x="684" y="426">Prometheus</text><text class="s" x="684" y="446">Scrapes /metrics.</text></g><g><rect class="box new" x="940" y="400" width="260" height="80" rx="6"/><text class="t" x="954" y="426">Grafana</text><text class="s" x="954" y="446">Provisioned dashboard: gate, solver,</text><text class="s" x="954" y="462">retrieval, degraded.</text></g><g><rect class="box partner" x="20" y="50" width="120" height="120" rx="6"/><text class="t" x="34" y="76">Browser</text><text class="s" x="34" y="96">Screen on http</text><text class="s" x="34" y="112">://127.0.0.1:8</text><text class="s" x="34" y="128">080.</text></g><g><rect class="box new" x="20" y="300" width="120" height="130" rx="6"/><text class="t" x="34" y="326">Hall kit</text><text class="s" x="34" y="346">Images and</text><text class="s" x="34" y="362">models. Loads</text><text class="s" x="34" y="378">offline.</text></g><path class="arrow " d="M140 110 H190" marker-end="url(#head)"/><path class="arrow " d="M470 162 V250" marker-end="url(#head)"/><path class="arrow " d="M490 100 H520" marker-end="url(#head)"/><path class="arrow " d="M730 100 H750" marker-end="url(#head)"/><path class="arrow " d="M300 162 V250" marker-end="url(#head)"/><path class="arrow " d="M420 162 V380 H300 V400" marker-end="url(#head)"/><path class="arrow " d="M410 432 H430" marker-end="url(#head)"/><path class="arrow " d="M920 432 H940" marker-end="url(#head)"/><text class="s" x="600" y="582" text-anchor="middle">Compose profiles core, full, mqtt, obs run the same images on one laptop. The core profile is the default on stage.</text></svg>
