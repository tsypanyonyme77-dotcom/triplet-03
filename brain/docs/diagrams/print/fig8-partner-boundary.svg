<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Brain's logic in the middle, a port on each side, then the adapters and the partners, with the configuration file and the Interface Card below." viewBox="0 0 1240 458" width="1240" height="458"><title>Where logic ends and partners begin</title><style>
svg { font-family: Arial, Helvetica, sans-serif; }
.box, .card { fill: #fff; stroke: #000; stroke-width: 1.4; }
.box.new, .card.new { fill: #e3e3e3; }
.box.partner, .card.partner { fill: #fff; stroke-dasharray: 6 4; }
.box.gate, .card.gate { fill: #fff; stroke-width: 3.2; }
.frame { fill: none; stroke: #777; stroke-width: 1.2; }
.tile { fill: #fff; stroke: #999; stroke-width: 1; }
.arrow { fill: none; stroke: #000; stroke-width: 1.6; }
.arrow.ember { stroke-dasharray: 7 4; stroke-width: 2.2; }
.headfill, .headember { fill: #000; }
.t { font: 700 15px Arial, Helvetica, sans-serif; fill: #000; }
.s { font: 400 12.5px Arial, Helvetica, sans-serif; fill: #222; }
.k { font: 400 12px "Courier New", monospace; fill: #333; letter-spacing: .04em; }
.an { font: 400 12px Arial, Helvetica, sans-serif; fill: #333; text-transform: uppercase; letter-spacing: .06em; }
.cortex { fill: #f1f1f1; stroke: #000; stroke-width: 1.4; }
.cbl { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; stroke-dasharray: 3 4; }
.stem { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; }
.wire { fill: none; stroke: #444; stroke-width: 1.5; }
.wire.out { stroke: #000; stroke-width: 2.4; stroke-dasharray: 7 4; }
.tipfill { fill: #000; }
.dot { fill: #555; stroke: #000; stroke-width: 1; }
.dot.gate { fill: #000; }
.dot.agent { fill: #fff; stroke-width: 2.4; }
.dot.twin { fill: #fff; stroke-dasharray: 3 2; }
image { filter: grayscale(1) contrast(1.1); }
</style><rect width="100%" height="100%" fill="#fff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headfill"/></marker><marker id="headember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headember"/></marker></defs><g><rect class="box " x="472" y="90" width="312" height="96" rx="6"/><text class="t" x="486" y="116">Checks on entry</text><text class="s" x="486" y="136">Schema, contract version, signature, replay</text><text class="s" x="486" y="152">and id pattern. A refusal carries a code and</text><text class="s" x="486" y="168">a reason.</text></g><g><rect class="box " x="472" y="196" width="312" height="80" rx="6"/><text class="t" x="486" y="222">Decision logic</text><text class="s" x="486" y="242">Perception, triage, workspace, teams,</text><text class="s" x="486" y="258">solvers, safety gate. It knows no protocol.</text></g><rect class="frame " x="458" y="50" width="340" height="240" rx="10"/><text class="k" x="472" y="70">THE BRAIN'S LOGIC</text><g><rect class="box partner" x="10" y="50" width="190" height="240" rx="6"/><text class="t" x="24" y="76">Twin</text><text class="s" x="24" y="96">Any engine that speaks</text><text class="s" x="24" y="112">the Interface Card.</text></g><g><rect class="box " x="230" y="50" width="190" height="240" rx="6"/><text class="t" x="244" y="76">Twin adapters</text><text class="s" x="244" y="96">One class each: MCP</text><text class="s" x="244" y="112">(default), HTTP, MQTT.</text><text class="s" x="244" y="128">Protocol, TLS and retries</text><text class="s" x="244" y="144">stay here.</text><text class="s" x="244" y="160">With a v1 Guardian a</text><text class="s" x="244" y="176">gateway wraps it: audited</text><text class="s" x="244" y="192">actions go through the</text><text class="s" x="244" y="208">Guardian.</text></g><g><rect class="box " x="836" y="50" width="190" height="240" rx="6"/><text class="t" x="850" y="76">Guardian adapter</text><text class="s" x="850" y="96">Two classes: REST (our</text><text class="s" x="850" y="112">contract) and v1 (the</text><text class="s" x="850" y="128">Guardian team's 1.0).</text><text class="s" x="850" y="144">A missing or late verdict</text><text class="s" x="850" y="160">means no action, never a</text><text class="s" x="850" y="176">crash.</text></g><g><rect class="box partner" x="1056" y="50" width="174" height="240" rx="6"/><text class="t" x="1070" y="76">Guardian</text><text class="s" x="1070" y="96">Any service that</text><text class="s" x="1070" y="112">issues a verdict. The</text><text class="s" x="1070" y="128">team's one is fed by</text><text class="s" x="1070" y="144">the Twin directly,</text><text class="s" x="1070" y="160">audits actuator calls</text><text class="s" x="1070" y="176">and quarantines.</text></g><rect class="frame " x="430" y="50" width="18" height="240" rx="10"/><text class="k" x="439" y="40" text-anchor="middle">TwinPort</text><rect class="frame " x="808" y="50" width="18" height="240" rx="10"/><text class="k" x="817" y="40" text-anchor="middle">GuardianPort</text><path class="arrow " d="M200 156 H230" marker-end="url(#head)"/><path class="arrow ember" d="M230 192 H200" marker-end="url(#headember)"/><path class="arrow " d="M420 170 H458" marker-end="url(#head)"/><path class="arrow " d="M798 170 H836" marker-end="url(#head)"/><path class="arrow " d="M1026 156 H1056" marker-end="url(#head)"/><path class="arrow " d="M1056 192 H1026" marker-end="url(#head)"/><g><rect class="box " x="230" y="346" width="390" height="80" rx="6"/><text class="t" x="244" y="372">config/partners.yaml</text><text class="s" x="244" y="392">Each partner's adapter, address, secret variable name,</text><text class="s" x="244" y="408">renames and units. No partner address in the logic.</text></g><g><rect class="box " x="640" y="346" width="380" height="80" rx="6"/><text class="t" x="654" y="372">The Interface Card and the contract</text><text class="s" x="654" y="392">INTERFACE.md, JSON Schemas, an example of every</text><text class="s" x="654" y="408">message. JSON, HMAC-SHA256 or Ed25519, CloudEvents 1.0.</text></g><g><rect class="box " x="1040" y="346" width="190" height="96" rx="6"/><text class="t" x="1054" y="372">Conformance kit</text><text class="s" x="1054" y="392">brain conformance checks</text><text class="s" x="1054" y="408">a real partner against</text><text class="s" x="1054" y="424">the card.</text></g><path class="arrow " d="M325 346 V290" marker-end="url(#head)"/><path class="arrow " d="M560 346 V318 H931 V290" marker-end="url(#head)"/><text class="k" x="342" y="336" text-anchor="start">read at start-up</text></svg>
