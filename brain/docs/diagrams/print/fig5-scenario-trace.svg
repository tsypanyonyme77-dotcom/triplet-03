' r='11' fill='#111417'/><text x='40' y='176' font-size='12' font-weight='700' fill='#FFFFFF' text-anchor='middle' font-family="B612, sans-serif">1</text><path d='M153 176H476' fill='none' stroke='#111417' stroke-width='1.25' marker-end='url(#ink)'/><text x='315.0' y='170' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>sightings near the scene, all trusted</text><circle cx='40' cy='218' r='11' fill='#111417'/><text x='40' y='222' font-size='12' font-weight='700' fill='#FFFFFF' text-anchor='middle' font-family="B612, sans-serif">2</text><path d='M153 222H476' fill='none' stroke='#111417' stroke-width='1.25' marker-end='url(#ink)'/><text x='315.0' y='216' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>camera: robbery in Downtown (0.93)</text><path d='M477 248H314' fill='none' stroke='#111417' stroke-width='1.25' marker-end='url(#ink)'/><text x='395.0' y='242' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>verdict?</text><path d='M313 270H476' fill='none' stroke='#111417' stroke-width='1.25' stroke-dasharray='5 4' marker-end='url(#ink)'/><text x='395.0' y='264' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>trusted</text><rect x='385.0' y='280' width='190' height='25' rx='5' fill='#E6E9E4' stroke='#3F464A' stroke-width='1'/><text x='480' y='297' font-size='11.5' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif">incident inc-0001 opened</text><circle cx='40' cy='332' r='11' fill='#111417'/><text x='40' y='336' font-size='12' font-weight='700' fill='#FFFFFF' text-anchor='middle' font-family="B612, sans-serif">3</text><path d='M153 336H476' fill='none' stroke='#111417' stroke-width='1.25' marker-end='url(#ink)'/><text x='315.0' y='330' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>cit-88213 running 18 km/h (trusted)</text><path d='M483 362H646' fill='none' stroke='#111417' stroke-width='1.25' marker-end='url(#ink)'/><text x='565.0' y='356' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>score everyone</text><rect x='535.0' y='372' width='230' height='40' rx='5' fill='#E6E9E4' stroke='#3F464A' stroke-width='1'/><text x='650' y='389' font-size='11.5' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif">score 0.82: at the scene and fled,</text><text x='650' y='404' font-size='11.5' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif">nobody else fled → suspect</text><circle cx='40' cy='432' r='11' fill='#111417'/><text x='40' y='436' font-size='12' font-weight='700' fill='#FFFFFF' text-anchor='middle' font-family="B612, sans-serif">4</text><path d='M653 436H986' fill='none' stroke='#111417' stroke-width='1.25' marker-end='url(#ink)'/><text x='820.0' y='430' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>pursue cit-88213 (rule POL-001)</text><path d='M987 462H314' fill='none' stroke='#111417' stroke-width='1.25' marker-start='url(#ink)' marker-end='url(#ink)'/><text x='650.0' y='456' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>is this actuator quarantined?</text><path d='M987 492H154' fill='none' stroke='#1B49CF' stroke-width='1.75' marker-end='url(#blue)'/><text x='570.0' y='486' font-size='12' font-weight='700' fill='#1B49CF' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>dispatch_unit · pursuit · trust_ref · signed</text><text x='570.0' y='507' font-size='11' font-weight='400' fill='#636B6F' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>6 ms after the reading in step 3</text><circle cx='40' cy='540' r='11' fill='#111417'/><text x='40' y='544' font-size='12' font-weight='700' fill='#FFFFFF' text-anchor='middle' font-family="B612, sans-serif">5</text><path d='M653 544H816' fill='none' stroke='#111417' stroke-width='1.25' marker-end='url(#ink)'/><text x='735.0' y='538' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>ask for a plan</text><rect x='735.0' y='554' width='170' height='40' rx='5' fill='#E6E9E4' stroke='#3F464A' stroke-width='1'/><text x='820' y='571' font-size='11.5' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif">Analyst → Tactician</text><text x='820' y='586' font-size='11.5' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif">→ Chief → verifier</text><path d='M823 612H986' fill='none' stroke='#111417' stroke-width='1.25' marker-end='url(#ink)'/><text x='905.0' y='606' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>intercept + alert</text><path d='M987 640H154' fill='none' stroke='#1B49CF' stroke-width='1.75' marker-end='url(#blue)'/><text x='570.0' y='634' font-size='12' font-weight='700' fill='#1B49CF' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>dispatch_unit · contain  +  broadcast_alert</text><text x='570.0' y='655' font-size='11' font-weight='400' fill='#636B6F' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>0.1 s later with the scripted team · about 5.5 s with Groq agents (an earlier run)</text><circle cx='40' cy='688' r='11' fill='#111417'/><text x='40' y='692' font-size='12' font-weight='700' fill='#FFFFFF' text-anchor='middle' font-family="B612, sans-serif">6</text><path d='M153 692H476' fill='none' stroke='#111417' stroke-width='1.25' marker-end='url(#ink)'/><text x='315.0' y='686' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>unit_status … apprehended (trusted)</text><rect x='385.0' y='702' width='190' height='25' rx='5' fill='#E6E9E4' stroke='#3F464A' stroke-width='1'/><text x='480' y='719' font-size='11.5' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif">incident inc-0001 closed</text><circle cx='40' cy='754' r='11' fill='#111417'/><text x='40' y='758' font-size='12' font-weight='700' fill='#FFFFFF' text-anchor='middle' font-family="B612, sans-serif">7</text><path d='M653 758H986' fill='none' stroke='#111417' stroke-width='1.25' marker-end='url(#ink)'/><text x='820.0' y='752' font-size='12' font-weight='400' fill='#111417' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>stand down (rule POL-003)</text><path d='M987 786H154' fill='none' stroke='#1B49CF' stroke-width='1.75' marker-end='url(#blue)'/><text x='570.0' y='780' font-size='12' font-weight='700' fill='#1B49CF' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>recall_unit for every unit still out</text><text x='570.0' y='801' font-size='11' font-weight='400' fill='#636B6F' text-anchor='middle' font-family="B612, sans-serif" stroke='#FFFFFF' stroke-width='5' stroke-linejoin='round' paint-order='stroke'>3 ms after the arrest report</text><rect x='24' y='830' width='1052' height='52' rx='6' fill='#E6E9E4' stroke='#AEB5AF' stroke-width='1'/><text x='40' y='851' font-size='12' font-weight='400' fill='#3F464A' text-anchor='start' font-family="B612, sans-serif">Every arrow is also a timeline event: it appears on the Strip Board screen and in the hash-chained audit log.</text><text x='40' y='869' font-size='12' font-weight='400' fill='#3F464A' text-anchor='start' font-family="B612, sans-serif">If the Guardian answers untrusted in step 2 or 3, nothing is dispatched and the reading is held at the gate with its reason (shown for a flood in scenario d2).</text></svg>
