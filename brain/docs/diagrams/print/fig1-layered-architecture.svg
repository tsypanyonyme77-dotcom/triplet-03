<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Six planes of the Convergence architecture from the interop edge to learning, with the shared spine and the platform underneath. New boxes are filled with the accent." viewBox="0 0 1240 1258" width="1240" height="1258"><title>The layered architecture</title><style>
svg { font-family: Arial, Helvetica, sans-serif; }
.box, .card { fill: #fff; stroke: #000; stroke-width: 1.4; }
.box.new, .card.new { fill: #e3e3e3; }
.box.partner, .card.partner { fill: #fff; stroke-dasharray: 6 4; }
.box.gate, .card.gate { fill: #fff; stroke-width: 3.2; }
.frame { fill: none; stroke: #777; stroke-width: 1.2; }
.tile { fill: #fff; stroke: #999; stroke-width: 1; }
.arrow { fill: none; stroke: #000; stroke-width: 1.6; }
.arrow.ember { stroke-dasharray: 7 4; stroke-width: 2.2; }
.headfill, .headember { fill: #000; }
.t { font: 700 15px Arial, Helvetica, sans-serif; fill: #000; }
.s { font: 400 12.5px Arial, Helvetica, sans-serif; fill: #222; }
.k { font: 400 12px "Courier New", monospace; fill: #333; letter-spacing: .04em; }
.an { font: 400 12px Arial, Helvetica, sans-serif; fill: #333; text-transform: uppercase; letter-spacing: .06em; }
.cortex { fill: #f1f1f1; stroke: #000; stroke-width: 1.4; }
.cbl { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; stroke-dasharray: 3 4; }
.stem { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; }
.wire { fill: none; stroke: #444; stroke-width: 1.5; }
.wire.out { stroke: #000; stroke-width: 2.4; stroke-dasharray: 7 4; }
.tipfill { fill: #000; }
.dot { fill: #555; stroke: #000; stroke-width: 1; }
.dot.gate { fill: #000; }
.dot.agent { fill: #fff; stroke-width: 2.4; }
.dot.twin { fill: #fff; stroke-dasharray: 3 2; }
image { filter: grayscale(1) contrast(1.1); }
</style><rect width="100%" height="100%" fill="#fff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headfill"/></marker><marker id="headember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headember"/></marker></defs><rect class="frame " x="20" y="8" width="1200" height="160" rx="10"/><text class="k" x="34" y="28">1 · INTEROP EDGE · SENSORY INPUT</text><g><rect class="box " x="36" y="38" width="186" height="116" rx="6"/><text class="t" x="50" y="64">Twin adapter</text><text class="s" x="50" y="84">MCP client. Polls</text><text class="s" x="50" y="100">readings, calls actuator</text><text class="s" x="50" y="116">tools.</text></g><g><rect class="box " x="232" y="38" width="186" height="116" rx="6"/><text class="t" x="246" y="64">Guardian adapter</text><text class="s" x="246" y="84">REST client. A verdict</text><text class="s" x="246" y="100">per reading, quarantine</text><text class="s" x="246" y="116">checks.</text></g><g><rect class="box " x="428" y="38" width="186" height="116" rx="6"/><text class="t" x="442" y="64">API and feed</text><text class="s" x="442" y="84">REST, SSE with</text><text class="s" x="442" y="100">CloudEvents, schemas,</text><text class="s" x="442" y="116">OpenAPI.</text></g><g><rect class="box new" x="624" y="38" width="186" height="116" rx="6"/><text class="t" x="638" y="64">Brain MCP server</text><text class="s" x="638" y="84">Read-only tools,</text><text class="s" x="638" y="100">resources, a prompt,</text><text class="s" x="638" y="116">scoped by token. No</text><text class="s" x="638" y="132">actuating tool.</text></g><g><rect class="box new" x="820" y="38" width="186" height="116" rx="6"/><text class="t" x="834" y="64">Agent card and</text><text class="t" x="834" y="84">conformance kit</text><text class="s" x="834" y="104">A2A card. One command</text><text class="s" x="834" y="120">checks any Twin or</text><text class="s" x="834" y="136">Guardian.</text></g><g><rect class="box new" x="1016" y="38" width="186" height="116" rx="6"/><text class="t" x="1030" y="64">Onboarding mapper</text><text class="s" x="1030" y="84">Proposes renames and</text><text class="s" x="1030" y="100">units for an unknown</text><text class="s" x="1030" y="116">Twin. Never edits</text><text class="s" x="1030" y="132">config.</text></g><rect class="frame " x="20" y="194" width="1200" height="140" rx="10"/><text class="k" x="34" y="214">2 · SENSES AND TRUST · THALAMIC GATING, CEREBELLAR PREDICTION, THE AMYGDALA'S FAST ROUTE</text><g><rect class="box " x="36" y="224" width="225" height="96" rx="6"/><text class="t" x="50" y="250">Perception</text><text class="s" x="50" y="270">Contract, HMAC, replay,</text><text class="s" x="50" y="286">ranges. Drops demographic</text><text class="s" x="50" y="302">fields.</text></g><g><rect class="box " x="271" y="224" width="225" height="96" rx="6"/><text class="t" x="285" y="250">Forward models</text><text class="s" x="285" y="270">Predict each sensor from its</text><text class="s" x="285" y="286">history. Doubt a lone outlier.</text></g><g><rect class="box new" x="506" y="224" width="225" height="96" rx="6"/><text class="t" x="520" y="250">Kalman tracker</text><text class="s" x="520" y="270">Level and rate. Time to</text><text class="s" x="520" y="286">threshold with an interval.</text></g><g><rect class="box new" x="741" y="224" width="225" height="96" rx="6"/><text class="t" x="755" y="250">Belief</text><text class="s" x="755" y="270">Log-odds fusion of independent</text><text class="s" x="755" y="286">witnesses. Advisory.</text></g><g><rect class="box " x="976" y="224" width="225" height="96" rx="6"/><text class="t" x="990" y="250">Triage and workspace</text><text class="s" x="990" y="270">Seven incident types. Two</text><text class="s" x="990" y="286">attention slots.</text></g><rect class="frame " x="20" y="360" width="1200" height="140" rx="10"/><text class="k" x="34" y="380">3 · UNDERSTANDING · HIPPOCAMPAL INDEX, SEMANTIC MEMORY</text><g><rect class="box " x="36" y="390" width="284" height="96" rx="6"/><text class="t" x="50" y="416">City graph</text><text class="s" x="50" y="436">In memory on the decision path. Neo4j</text><text class="s" x="50" y="452">mirror written behind it.</text></g><g><rect class="box new" x="330" y="390" width="284" height="96" rx="6"/><text class="t" x="344" y="416">Knowledge base</text><text class="s" x="344" y="436">Qdrant hybrid search: dense, BM25,</text><text class="s" x="344" y="452">payload filters. Memory and Neo4j stay</text><text class="s" x="344" y="468">as options.</text></g><g><rect class="box new" x="624" y="390" width="284" height="96" rx="6"/><text class="t" x="638" y="416">Graph analytics</text><text class="s" x="638" y="436">Criticality, communities, N-1 cascade,</text><text class="s" x="638" y="452">written back to Neo4j.</text></g><g><rect class="box " x="918" y="390" width="284" height="96" rx="6"/><text class="t" x="932" y="416">Context and stories</text><text class="s" x="932" y="436">Zone facts. Similar past stories without</text><text class="s" x="932" y="452">outcome or identity.</text></g><rect class="frame " x="20" y="526" width="1200" height="156" rx="10"/><text class="k" x="34" y="546">4 · DECISION · GLOBAL WORKSPACE, REFLEXES AND HABITS, PREFRONTAL DELIBERATION</text><g><rect class="box " x="36" y="556" width="225" height="112" rx="6"/><text class="t" x="50" y="582">Reflex rules</text><text class="s" x="50" y="602">13 rules over six departments.</text><text class="s" x="50" y="618">No model.</text></g><g><rect class="box new" x="271" y="556" width="225" height="112" rx="6"/><text class="t" x="285" y="582">OR-Tools engines</text><text class="s" x="285" y="602">Min-cost flow for dispatch.</text><text class="s" x="285" y="618">CP-SAT for perimeter and load</text><text class="s" x="285" y="634">shedding. Each returns a</text><text class="s" x="285" y="650">certificate.</text></g><g><rect class="box new" x="506" y="556" width="225" height="112" rx="6"/><text class="t" x="520" y="582">Corridor and what-if</text><text class="s" x="520" y="602">Time-dependent shortest path,</text><text class="s" x="520" y="618">signals held green.</text></g><g><rect class="box " x="741" y="556" width="225" height="112" rx="6"/><text class="t" x="755" y="582">Agent team</text><text class="s" x="755" y="602">Analyst, Tactician, Chief.</text><text class="s" x="755" y="618">Checked by code before the</text><text class="s" x="755" y="634">gate.</text></g><g><rect class="box new" x="976" y="556" width="225" height="112" rx="6"/><text class="t" x="990" y="582">Planning supervisor</text><text class="s" x="990" y="602">LangGraph. Solve and</text><text class="s" x="990" y="618">deliberate in parallel,</text><text class="s" x="990" y="634">reconcile, pause for approval,</text><text class="s" x="990" y="650">checkpoint.</text></g><rect class="frame " x="20" y="708" width="1200" height="140" rx="10"/><text class="k" x="34" y="728">5 · SAFETY · BASAL GANGLIA: HOLD BACK, RELEASE ONE</text><g><rect class="box gate" x="36" y="738" width="382" height="96" rx="6"/><text class="t" x="50" y="764">Gate · the only way out</text><text class="s" x="50" y="784">Schema, capability, allowlist, incident, trusted</text><text class="s" x="50" y="800">verdict, evidence, approval, no repeat, cooling,</text><text class="s" x="50" y="816">quarantine, budget.</text></g><g><rect class="box new" x="428" y="738" width="382" height="96" rx="6"/><text class="t" x="442" y="764">Signed approval</text><text class="s" x="442" y="784">A person approves a valve or grid call. Bound to its</text><text class="s" x="442" y="800">parameters, used once.</text></g><g><rect class="box new" x="820" y="738" width="382" height="96" rx="6"/><text class="t" x="834" y="764">Authentication and red team</text><text class="s" x="834" y="784">Scoped tokens, size and rate limits. A suite of attacks</text><text class="s" x="834" y="800">that must be refused.</text></g><rect class="frame " x="20" y="874" width="1200" height="124" rx="10"/><text class="k" x="34" y="894">6 · LEARNING · REPLAY AND CONSOLIDATION IN SLEEP</text><g><rect class="box " x="36" y="904" width="382" height="80" rx="6"/><text class="t" x="50" y="930">Episodes and sleep</text><text class="s" x="50" y="950">Stories become reflexes only after six checks.</text></g><g><rect class="box " x="428" y="904" width="382" height="80" rx="6"/><text class="t" x="442" y="930">Academy</text><text class="s" x="442" y="950">Tunes listed parameters on held-out stories. 16 after</text><text class="s" x="442" y="966">this design, none in the gate.</text></g><g><rect class="box new" x="820" y="904" width="382" height="80" rx="6"/><text class="t" x="834" y="930">Improvement cycle</text><text class="s" x="834" y="950">Benchmarks with a ground truth, verify, promote, audit.</text></g><path class="arrow " d="M120 168 V194" marker-end="url(#head)"/><path class="arrow " d="M120 334 V360" marker-end="url(#head)"/><path class="arrow " d="M120 500 V526" marker-end="url(#head)"/><path class="arrow ember" d="M120 682 V708" marker-end="url(#headember)"/><path class="arrow " d="M120 848 V874" marker-end="url(#head)"/><text class="k" x="134" y="699" text-anchor="start">proposals</text><text class="k" x="134" y="865" text-anchor="start">evidence from every plane</text><text class="k" x="20" y="1030" text-anchor="start">SPINE AND PLATFORM, UNDER EVERY PLANE</text><g><rect class="box " x="36" y="1040" width="225" height="112" rx="6"/><text class="t" x="50" y="1066">Timeline</text><text class="s" x="50" y="1086">CloudEvents in a hash chain.</text><text class="s" x="50" y="1102">One trace id per reading.</text></g><g><rect class="box " x="271" y="1040" width="225" height="112" rx="6"/><text class="t" x="285" y="1066">Explain</text><text class="s" x="285" y="1086">Facts from the log.</text><text class="s" x="285" y="1102">Counterfactuals proven on the</text><text class="s" x="285" y="1118">gate. PROV export. Signed</text><text class="s" x="285" y="1134">bundle.</text></g><g><rect class="box new" x="506" y="1040" width="225" height="112" rx="6"/><text class="t" x="520" y="1066">Telemetry</text><text class="s" x="520" y="1086">OpenTelemetry spans and</text><text class="s" x="520" y="1102">Prometheus metrics from the</text><text class="s" x="520" y="1118">same events.</text></g><g><rect class="box " x="741" y="1040" width="225" height="112" rx="6"/><text class="t" x="755" y="1066">Screen</text><text class="s" x="755" y="1086">Strip Board and the glass-</text><text class="s" x="755" y="1102">brain canopy. Why panel,</text><text class="s" x="755" y="1118">approval strip, Optimiser</text><text class="s" x="755" y="1134">instrument.</text></g><g><rect class="box new" x="976" y="1040" width="225" height="112" rx="6"/><text class="t" x="990" y="1066">Journal and replay</text><text class="s" x="990" y="1086">Every input kept and signed.</text><text class="s" x="990" y="1102">brain replay reruns it. Agent</text><text class="s" x="990" y="1118">calls on a cassette.</text></g><g><rect class="box new" x="36" y="1162" width="284" height="80" rx="6"/><text class="t" x="50" y="1188">Images</text><text class="s" x="50" y="1208">One multi-stage build. Non-root.</text><text class="s" x="50" y="1224">Embedding model baked in.</text></g><g><rect class="box new" x="330" y="1162" width="284" height="80" rx="6"/><text class="t" x="344" y="1188">Compose profiles</text><text class="s" x="344" y="1208">core, full, mqtt, obs. One command, no</text><text class="s" x="344" y="1224">network.</text></g><g><rect class="box new" x="624" y="1162" width="284" height="80" rx="6"/><text class="t" x="638" y="1188">Full stack</text><text class="s" x="638" y="1208">make full: Brain, mocks, Neo4j, Qdrant,</text><text class="s" x="638" y="1224">agents on real models.</text></g><g><rect class="box new" x="918" y="1162" width="284" height="80" rx="6"/><text class="t" x="932" y="1188">Hall kit</text><text class="s" x="932" y="1208">Every image and the model cache in one</text><text class="s" x="932" y="1224">folder.</text></g></svg>
