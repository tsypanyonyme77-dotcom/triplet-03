<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The planning supervisor graph: assemble context, then solve and deliberate in parallel, reconcile, pause for approval, and pass to the gate. A checkpoint store sits under the graph." viewBox="0 0 1240 496" width="1240" height="496"><title>The planning graph</title><style>
svg { font-family: Arial, Helvetica, sans-serif; }
.box, .card { fill: #fff; stroke: #000; stroke-width: 1.4; }
.box.new, .card.new { fill: #e3e3e3; }
.box.partner, .card.partner { fill: #fff; stroke-dasharray: 6 4; }
.box.gate, .card.gate { fill: #fff; stroke-width: 3.2; }
.frame { fill: none; stroke: #777; stroke-width: 1.2; }
.tile { fill: #fff; stroke: #999; stroke-width: 1; }
.arrow { fill: none; stroke: #000; stroke-width: 1.6; }
.arrow.ember { stroke-dasharray: 7 4; stroke-width: 2.2; }
.headfill, .headember { fill: #000; }
.t { font: 700 15px Arial, Helvetica, sans-serif; fill: #000; }
.s { font: 400 12.5px Arial, Helvetica, sans-serif; fill: #222; }
.k { font: 400 12px "Courier New", monospace; fill: #333; letter-spacing: .04em; }
.an { font: 400 12px Arial, Helvetica, sans-serif; fill: #333; text-transform: uppercase; letter-spacing: .06em; }
.cortex { fill: #f1f1f1; stroke: #000; stroke-width: 1.4; }
.cbl { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; stroke-dasharray: 3 4; }
.stem { fill: #f1f1f1; stroke: #000; stroke-width: 1.2; }
.wire { fill: none; stroke: #444; stroke-width: 1.5; }
.wire.out { stroke: #000; stroke-width: 2.4; stroke-dasharray: 7 4; }
.tipfill { fill: #000; }
.dot { fill: #555; stroke: #000; stroke-width: 1; }
.dot.gate { fill: #000; }
.dot.agent { fill: #fff; stroke-width: 2.4; }
.dot.twin { fill: #fff; stroke-dasharray: 3 2; }
image { filter: grayscale(1) contrast(1.1); }
</style><rect width="100%" height="100%" fill="#fff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headfill"/></marker><marker id="headember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="headember"/></marker></defs><g><rect class="box " x="20" y="160" width="190" height="80" rx="6"/><text class="t" x="34" y="186">Incident ignites</text><text class="s" x="34" y="206">The workspace gives it</text><text class="s" x="34" y="222">attention.</text></g><g><rect class="box new" x="250" y="160" width="190" height="96" rx="6"/><text class="t" x="264" y="186">assemble</text><text class="s" x="264" y="206">City graph, knowledge,</text><text class="s" x="264" y="222">Kalman, belief and</text><text class="s" x="264" y="238">cascade facts.</text></g><g><rect class="box new" x="500" y="40" width="230" height="96" rx="6"/><text class="t" x="514" y="66">solve · milliseconds</text><text class="s" x="514" y="86">OR-Tools engines. Certificate</text><text class="s" x="514" y="102">with status, objective, gap.</text><text class="s" x="514" y="118">Works offline.</text></g><g><rect class="box " x="500" y="280" width="230" height="80" rx="6"/><text class="t" x="514" y="306">deliberate · 4 to 9 s</text><text class="s" x="514" y="326">The agent team, or the scripted</text><text class="s" x="514" y="342">team when there is no network.</text></g><g><rect class="box new" x="790" y="160" width="190" height="80" rx="6"/><text class="t" x="804" y="186">reconcile</text><text class="s" x="804" y="206">Better feasible plan</text><text class="s" x="804" y="222">wins. Regret recorded.</text></g><g><rect class="box new" x="1020" y="160" width="200" height="96" rx="6"/><text class="t" x="1034" y="186">approve · interrupt</text><text class="s" x="1034" y="206">Pauses for a signed</text><text class="s" x="1034" y="222">approval. Resumes after a</text><text class="s" x="1034" y="238">restart.</text></g><g><rect class="box gate" x="1020" y="360" width="200" height="80" rx="6"/><text class="t" x="1034" y="386">Gate</text><text class="s" x="1034" y="406">Checks and signs every</text><text class="s" x="1034" y="422">call.</text></g><g><rect class="box partner" x="790" y="400" width="190" height="80" rx="6"/><text class="t" x="804" y="426">Twin actuators</text><text class="s" x="804" y="446">Only tools the Twin</text><text class="s" x="804" y="462">lists.</text></g><g><rect class="box new" x="250" y="400" width="440" height="80" rx="6"/><text class="t" x="264" y="426">SQLite checkpoints</text><text class="s" x="264" y="446">One thread per incident. Replay a decision from its checkpoints</text><text class="s" x="264" y="462">to rebuild its explanation.</text></g><path class="arrow " d="M210 200 H250" marker-end="url(#head)"/><path class="arrow " d="M440 190 H470 V88 H500" marker-end="url(#head)"/><path class="arrow " d="M440 220 H470 V320 H500" marker-end="url(#head)"/><path class="arrow " d="M730 88 H760 V190 H790" marker-end="url(#head)"/><path class="arrow " d="M730 320 H760 V220 H790" marker-end="url(#head)"/><path class="arrow " d="M980 200 H1020" marker-end="url(#head)"/><path class="arrow ember" d="M1120 256 V360" marker-end="url(#headember)"/><path class="arrow ember" d="M1020 400 H980" marker-end="url(#headember)"/><path class="arrow ember" d="M615 40 V26 H1000 V374 H1020" marker-end="url(#headember)"/><text class="k" x="635" y="18" text-anchor="start">fast path: first proposals reach the gate at once</text><text class="k" x="1120" y="140" text-anchor="middle">high-impact actions only</text><path class="arrow " d="M1120 100 V160" marker-end="url(#head)"/><g><rect class="box new" x="1020" y="12" width="200" height="96" rx="6"/><text class="t" x="1034" y="38">A person</text><text class="s" x="1034" y="58">POST /api/approvals with</text><text class="s" x="1034" y="74">the approve scope, or the</text><text class="s" x="1034" y="90">Approve button.</text></g><path class="arrow " d="M885 240 V370 H710 V440 H690" marker-end="url(#head)"/></svg>
