.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1486" height="488" fill="#fff"/><rect class="dband" x="0" y="6" width="1486" height="112" rx="10"/><g class="k-twin"><circle class="dtint" cx="60.0" cy="44" r="22"/><g class="dg" transform="translate(46.8 30.8) scale(0.550)"><path d="M6 42V22h10v20M16 42V10h12v32M28 42V26h10v16M4 42h40"/></g></g><text class="dt" x="60" y="92" text-anchor="middle">Twin</text><rect class="dband" x="0" y="124" width="1486" height="112" rx="10"/><g class="k-guardian"><circle class="dtint" cx="60.0" cy="162" r="22"/><g class="dg" transform="translate(46.8 148.8) scale(0.550)"><path d="M24 5l15 5v12c0 9-6 16-15 20-9-4-15-11-15-20V10z"/><path 