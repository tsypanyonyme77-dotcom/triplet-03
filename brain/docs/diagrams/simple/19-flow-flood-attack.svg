<text class="ds" style="fill:var(--ink);font-size:13px" x="644.0" y="450" text-anchor="middle">passes</text></g><path class="dw  " d="M556.0 298.0 L569.0 298.0 L569.0 416.0 L582.0 416.0"/><polygon class="dh " points="582.0,416.0 571.0,421.5 571.0,410.5"/><g class="k-twin"><rect class="dcard" x="732" y="12" width="124" height="100" rx="10"/><circle class="dnum" cx="745" cy="25" r="10.5"/><text class="dn" x="745" y="29.5">5</text><circle class="dtint" cx="802.0" cy="33" r="15"/><g class="dg" transform="translate(793.0 24.0) scale(0.375)"><path d="M4 16c7-6 13 6 20 0s13 6 20 0M4 26c7-6 13 6 20 0s13 6 20 0M4 36c7-6 13 6 20 0s13 6 20 0"/></g><text class="ds" style="fill:var(--ink);font-size:13px" x="794.0" y="66" text-anchor="middle">The level crosses</text><text class="ds" style="fill:var(--ink);font-size:13px" x="794.0" y="81" text-anchor="middle">1.0 m</text></g><path class="dw  " d="M706.0 416.0 L719.0 416.0 L719.0 62.0 L732.0 62.0"/><polygon class="dh " points="732.0,62.0 721.0,67.5 721.0,56.5"/><g class="k-brain"><rect class="dcard" x="882" y="248" width="124" height="100" rx="10"/><circle class="dnum" cx="895" cy="261" r="10.5"/><text class="dn" x="895" y="265.5">6</text><circle class="dtint" cx="952.0" cy="269" r="15"/><g class="dg" transform="translate(943.0 260.0) scale(0.375)"><circle cx="21" cy="21" r="14"/><path d="M31 31l12 12"/></g><text class="ds" style="fill:var(--ink);font-size:13px" x="944.0" y="302" text-anchor="middle">Flood incident</text><text class="ds" style="fill:var(--ink);font-size:13px" x="944.0" y="317" text-anchor="middle">opened</text></g><path class="dw  " d="M856.0 62.0 L869.0 62.0 L869.0 298.0 L882.0 298.0"/><polygon class="dh " points="882.0,298.0 871.0,303.5 871.0,292.5"/><g class="k-bad"><rect class="dcard" x="1032" y="366" width="124" height="100" rx="10"/><circle class="dnum" cx="1045" cy="379" r="10.5"/><text class="dn" x="1045" y="383.5">7</text><circle class="dtint" cx="1102.0" cy="387" r="15"/><g class="dg" transform="translate