<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A reading moves left to right through five parts, then gets one of two answers. Both answers must pass the Safety gate. What is kept afterwards can become a new instant rule." viewBox="0 0 1240 560" width="1240" height="560"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="560" fill="#fff"/><g class="k-brain"><rect class="dcard" x="10" y="10" width="192" height="138" rx="12"/><rect class="dedge" x="24" y="10" width="164" height="0.1"/><circle class="dtint" cx="106.0" cy="43" r="23"/><g class="dg" transform="translate(92.2 29.2) scale(0.575)"><path d="M3 24c6-10 14-14 21-14s15 4 21 14c-6 10-14 14-21 14S9 34 3 24z"/><circle cx="24" cy="24" r="6"/></g><text class="dt" x="106.0" y="86" text-anchor="middle">Reads the city</text><text class="ds" x="106.0" y="104" text-anchor="middle">checks it, asks the</text><text class="ds" x="106.0" y="120" text-anchor="middle">Guardian</text></g><g class="k-brain"><rect class="dcard" x="255" y="10" width="192" height="138" rx="12"/><rect class="dedge" x="269" y="10" width="164" height="0.1"/><circle class="dtint" cx="351.0" cy="43" r="23"/><g class="dg" transform="translate(337.2 29.2) scale(0.575)"><path d="M6 6v36h36"/><path d="M13 32l9-11 7 6 11-15"/></g><text class="dt" x="351.0" y="86" text-anchor="middle">Spots the unusual</text><text class="ds" x="351.0" y="104" text-anchor="middle">each sensor's own normal</text></g><g class="k-brain"><rect class="dcard" x="500" y="10" width="192" height="138" rx="12"/><rect class="dedge" x="514" y="10" width="164" height="0.1"/><circle class="dtint" cx="596.0" cy="43" r="23"/><g class="dg" transform="translate(582.2 29.2) scale(0.575)"><circle cx="21" cy="21" r="14"/><path d="M31 31l12 12"/></g><text class="dt" x="596.0" y="86" text-anchor="middle">Sorts what matters</text><text class="ds" x="596.0" y="104" text-anchor="middle">readings become incidents</text></g><g class="k-brain"><rect class="dcard" x="745" y="10" width="192" height="138" rx="12"/><rect class="dedge" x="759" y="10" width="164" height="0.1"/><circle class="dtint" cx="841.0" cy="43" r="23"/><g class="dg" transform="translate(827.2 29.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><circle cx="24" cy="24" r="9"/><circle cx="24" cy="24" r="2"/></g><text class="dt" x="841.0" y="86" text-anchor="middle">Holds attention</text><text class="ds" x="841.0" y="104" text-anchor="middle">most urgent first</text></g><g class="k-brain"><rect class="dcard" x="990" y="10" width="230" height="138" rx="12"/><rect class="dedge" x="1004" y="10" width="202" height="0.1"/><circle class="dtint" cx="1105.0" cy="43" r="23"/><g class="dg" transform="translate(1091.2 29.2) scale(0.575)"><path d="M6 6h18l18 18-18 18L6 24z"/><circle cx="15" cy="15" r="3"/></g><text class="dt" x="1105.0" y="86" text-anchor="middle">Picks a department</text><text class="ds" x="1105.0" y="104" text-anchor="middle">police, fire, roads, grid</text></g><path class="dw  " d="M202.0 79.0 L255.0 79.0"/><polygon class="dh " points="255.0,79.0 244.0,84.5 244.0,73.5"/><path class="dw  " d="M447.0 79.0 L500.0 79.0"/><polygon class="dh " points="500.0,79.0 489.0,84.5 489.0,73.5"/><path class="dw  " d="M692.0 79.0 L745.0 79.0"/><polygon class="dh " points="745.0,79.0 734.0,84.5 734.0,73.5"/><path class="dw  " d="M937.0 79.0 L990.0 79.0"/><polygon class="dh " points="990.0,79.0 979.0,84.5 979.0,73.5"/><g class="k-brain"><rect class="dcard" x="500" y="210" width="192" height="138" rx="12"/><rect class="dedge" x="514" y="210" width="164" height="0.1"/><circle class="dtint" cx="596.0" cy="243" r="23"/><g class="dg" transform="translate(582.2 229.2) scale(0.575)"><path d="M28 4L9 28h13l-3 16 20-25H25z"/></g><text class="dt" x="596.0" y="286" text-anchor="middle">Instant rule</text><text class="ds" x="596.0" y="304" text-anchor="middle">a clear case, in</text><text class="ds" x="596.0" y="320" text-anchor="middle">milliseconds</text></g><g class="k-brain"><rect class="dcard" x="865" y="210" width="230" height="138" rx="12"/><rect class="dedge" x="879" y="210" width="202" height="0.1"/><circle class="dtint" cx="980.0" cy="243" r="23"/><g class="dg" transform="translate(966.2 229.2) scale(0.575)"><circle cx="24" cy="12" r="5"/><circle cx="10" cy="34" r="5"/><circle cx="38" cy="34" r="5"/><path d="M21 16l-8 14M27 16l8 14M15 36h18"/></g><text class="dt" x="980.0" y="286" text-anchor="middle">Team of agents</text><text class="ds" x="980.0" y="304" text-anchor="middle">a harder case, reasons it</text><text class="ds" x="980.0" y="320" text-anchor="middle">through</text></g><path class="dw  " d="M596.0 148.0 L596.0 210.0"/><polygon class="dh " points="596.0,210.0 590.5,199.0 601.5,199.0"/><text class="dl" x="610" y="190" text-anchor="start">clear</text><path class="dw gate dash" d="M841.0 148.0 L841.0 180.0 L940.0 180.0 L940.0 210.0"/><polygon class="dh gate" points="940.0,210.0 934.5,199.0 945.5,199.0"/><path class="dw gate dash" d="M1105.0 148.0 L1105.0 180.0 L1020.0 180.0 L1020.0 210.0"/><polygon class="dh gate" points="1020.0,210.0 1014.5,199.0 1025.5,199.0"/><text class="dl" x="1045" y="172" text-anchor="start">harder</text><g class="k-gate"><rect class="dcard" x="680" y="410" width="192" height="138" rx="12"/><rect class="dedge" x="694" y="410" width="164" height="0.1"/><circle class="dtint" cx="776.0" cy="443" r="23"/><g class="dg" transform="translate(762.2 429.2) scale(0.575)"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M16 21v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="31" r="2"/></g><text class="dt" x="776.0" y="486" text-anchor="middle">Safety gate</text><text class="ds" x="776.0" y="504" text-anchor="middle">the only way out</text></g><g class="k-twin"><rect class="dcard" x="1010" y="410" width="210" height="138" rx="12"/><rect class="dedge" x="1024" y="410" width="182" height="0.1"/><circle class="dtint" cx="1115.0" cy="443" r="23"/><g class="dg" transform="translate(1101.2 429.2) scale(0.575)"><path d="M6 42V22h10v20M16 42V10h12v32M28 42V26h10v16M4 42h40"/></g><text class="dt" x="1115.0" y="486" text-anchor="middle">Acts in the city</text><text class="ds" x="1115.0" y="504" text-anchor="middle">the Twin carries it out</text></g><path class="dw  " d="M596.0 348.0 L596.0 380.0 L740.0 380.0 L740.0 410.0"/><polygon class="dh " points="740.0,410.0 734.5,399.0 745.5,399.0"/><path class="dw gate dash" d="M980.0 348.0 L980.0 380.0 L810.0 380.0 L810.0 410.0"/><polygon class="dh gate" points="810.0,410.0 804.5,399.0 815.5,399.0"/><path class="dw gate " d="M872.0 479.0 L1010.0 479.0"/><polygon class="dh gate" points="1010.0,479.0 999.0,484.5 999.0,473.5"/><text class="dl" x="940" y="468" text-anchor="middle">signed</text><g class="k-brain"><rect class="dcard" x="255" y="410" width="192" height="138" rx="12"/><rect class="dedge" x="269" y="410" width="164" height="0.1"/><circle class="dtint" cx="351.0" cy="443" r="23"/><g class="dg" transform="translate(337.2 429.2) scale(0.575)"><path d="M24 12C19 7 11 7 5 9v29c6-2 14-2 19 3 5-5 13-5 19-3V9c-6-2-14-2-19 3z"/><path d="M24 12v29"/></g><text class="dt" x="351.0" y="486" text-anchor="middle">Remembers</text><text class="ds" x="351.0" y="504" text-anchor="middle">each closed incident</text></g><g class="k-brain"><rect class="dcard" x="10" y="410" width="192" height="138" rx="12"/><rect class="dedge" x="24" y="410" width="164" height="0.1"/><circle class="dtint" cx="106.0" cy="443" r="23"/><g class="dg" transform="translate(92.2 429.2) scale(0.575)"><path d="M35 31A16 16 0 0 1 17 9a16 16 0 1 0 18 22z"/></g><text class="dt" x="106.0" y="486" text-anchor="middle">Learns in quiet time</text><text class="ds" x="106.0" y="504" text-anchor="middle">repeated plans become</text><text class="ds" x="106.0" y="520" text-anchor="middle">rules</text></g><path class="dw  " d="M680.0 479.0 L447.0 479.0"/><polygon class="dh " points="447.0,479.0 458.0,473.5 458.0,484.5"/><text class="dl" x="565" y="468" text-anchor="middle">what happened</text><path class="dw  " d="M202.0 460.0 L255.0 460.0"/><polygon class="dh " points="255.0,460.0 244.0,465.5 244.0,454.5"/><text class="dl" x="228" y="450" text-anchor="middle">reads</text><path class="dw  " d="M351.0 410.0 L351.0 279.0 L500.0 279.0"/><polygon class="dh " points="500.0,279.0 489.0,284.5 489.0,273.5"/><text class="dl" x="360" y="269" text-anchor="middle">a new rule, once it passes</text></svg>