<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="When the city is calm, the Brain looks for plans the team made the same way more than once. Each candidate faces six checks. A learned rule only saves deliberation: it still passes the Safety gate, and it is retired if the team starts planning differently." viewBox="0 0 1240 412" width="1240" height="412"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="412" fill="#fff"/><g class="k-brain"><rect class="dcard" x="10" y="30" width="180" height="104" rx="12"/><rect class="dedge" x="24" y="30" width="152" height="0.1"/><circle class="dtint" cx="100.0" cy="63" r="23"/><g class="dg" transform="translate(86.2 49.2) scale(0.575)"><path d="M24 12C19 7 11 7 5 9v29c6-2 14-2 19 3 5-5 13-5 19-3V9c-6-2-14-2-19 3z"/><path d="M24 12v29"/></g><text class="dt" x="100.0" y="106" text-anchor="middle">Closed incidents</text><text class="ds" x="100.0" y="124" text-anchor="middle">kept as stories</text></g><g class="k-brain"><rect class="dcard" x="240" y="30" width="180" height="120" rx="12"/><rect class="dedge" x="254" y="30" width="152" height="0.1"/><circle class="dtint" cx="330.0" cy="63" r="23"/><g class="dg" transform="translate(316.2 49.2) scale(0.575)"><circle cx="21" cy="21" r="14"/><path d="M31 31l12 12"/></g><text class="dt" x="330.0" y="106" text-anchor="middle">Find repeats</text><text class="ds" x="330.0" y="124" text-anchor="middle">same plan, more than</text><text class="ds" x="330.0" y="140" text-anchor="middle">once</text></g><g class="k-gate"><rect class="dcard" x="470" y="30" width="230" height="120" rx="12"/><rect class="dedge" x="484" y="30" width="202" height="0.1"/><circle class="dtint" cx="585.0" cy="63" r="23"/><g class="dg" transform="translate(571.2 49.2) scale(0.575)"><path d="M35 31A16 16 0 0 1 17 9a16 16 0 1 0 18 22z"/></g><text class="dt" x="585.0" y="106" text-anchor="middle">Six checks</text><text class="ds" x="585.0" y="124" text-anchor="middle">source, safety, limit,</text><text class="ds" x="585.0" y="140" text-anchor="middle">rehearsal, variants, Test Book</text></g><g class="k-good"><rect class="dcard" x="780" y="30" width="190" height="104" rx="12"/><rect class="dedge" x="794" y="30" width="162" height="0.1"/><circle class="dtint" cx="875.0" cy="63" r="23"/><g class="dg" transform="translate(861.2 49.2) scale(0.575)"><path d="M28 4L9 28h13l-3 16 20-25H25z"/></g><text class="dt" x="875.0" y="106" text-anchor="middle">New instant rule</text><text class="ds" x="875.0" y="124" text-anchor="middle">can be rolled back</text></g><g class="k-gate"><rect class="dcard" x="1030" y="30" width="190" height="120" rx="12"/><rect class="dedge" x="1044" y="30" width="162" height="0.1"/><circle class="dtint" cx="1125.0" cy="63" r="23"/><g class="dg" transform="translate(1111.2 49.2) scale(0.575)"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M16 21v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="31" r="2"/></g><text class="dt" x="1125.0" y="106" text-anchor="middle">Used next time</text><text class="ds" x="1125.0" y="124" text-anchor="middle">still checked by the</text><text class="ds" x="1125.0" y="140" text-anchor="middle">gate</text></g><path class="dw  " d="M190.0 82.0 L240.0 82.0"/><polygon class="dh " points="240.0,82.0 229.0,87.5 229.0,76.5"/><path class="dw  " d="M420.0 90.0 L470.0 90.0"/><polygon class="dh " points="470.0,90.0 459.0,95.5 459.0,84.5"/><path class="dw good " d="M700.0 82.0 L780.0 82.0"/><polygon class="dh good" points="780.0,82.0 769.0,87.5 769.0,76.5"/><text class="dl" x="740.0" y="74.0" text-anchor="middle">all pass</text><path class="dw good " d="M970.0 82.0 L1030.0 82.0"/><polygon class="dh good" points="1030.0,82.0 1019.0,87.5 1019.0,76.5"/><g class="k-bad"><rect class="dcard" x="470" y="240" width="230" height="104" rx="12"/><rect class="dedge" x="484" y="240" width="202" height="0.1"/><circle class="dtint" cx="585.0" cy="273" r="23"/><g class="dg" transform="translate(571.2 259.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M16 16l16 16M32 16L16 32"/></g><text class="dt" x="585.0" y="316" text-anchor="middle">Turned away</text><text class="ds" x="585.0" y="334" text-anchor="middle">with the reason</text></g><path class="dw bad " d="M585.0 150.0 L585.0 240.0"/><polygon class="dh bad" points="585.0,240.0 579.5,229.0 590.5,229.0"/><text class="dl" x="600" y="214" text-anchor="start">any fails</text><g class="k-bad"><rect class="dcard" x="1030" y="240" width="190" height="104" rx="12"/><rect class="dedge" x="1044" y="240" width="162" height="0.1"/><circle class="dtint" cx="1125.0" cy="273" r="23"/><g class="dg" transform="translate(1111.2 259.2) scale(0.575)"><circle cx="24" cy="12" r="5"/><circle cx="10" cy="34" r="5"/><circle cx="38" cy="34" r="5"/><path d="M21 16l-8 14M27 16l8 14M15 36h18"/></g><text class="dt" x="1125.0" y="316" text-anchor="middle">Team disagrees later</text><text class="ds" x="1125.0" y="334" text-anchor="middle">the rule is retired</text></g><path class="dw  dash" d="M1125.0 150.0 L1125.0 240.0"/><polygon class="dh " points="1125.0,240.0 1119.5,229.0 1130.5,229.0"/><text class="dl" x="1120" y="222" text-anchor="end">checked over time</text><g class="k-store"><rect class="dcard" x="10" y="240" width="240" height="120" rx="12"/><rect class="dedge" x="24" y="240" width="212" height="0.1"/><circle class="dtint" cx="130.0" cy="273" r="23"/><g class="dg" transform="translate(116.2 259.2) scale(0.575)"><path d="M7 35a17 17 0 1 1 34 0"/><path d="M24 35l9-13"/><circle cx="24" cy="35" r="2.5"/></g><text class="dt" x="130.0" y="316" text-anchor="middle">Academy</text><text class="ds" x="130.0" y="334" text-anchor="middle">tunes only 13 listed numbers,</text><text class="ds" x="130.0" y="350" text-anchor="middle">each with a range</text></g><text class="dl" x="130" y="395" text-anchor="middle">a separate, bounded way to improve</text></svg>