<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Each role can read but never act. Code checks the plan before the gate sees it. If a model call fails, a scripted stand-in takes that role and the scenario still passes, which is what happened with Groq's parse errors in the real-model runs." viewBox="0 0 1240 370" width="1240" height="370"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="370" fill="#fff"/><rect class="dframe" x="0" y="28" width="712" height="148" rx="14"/><g class="k-brain"><rect class="dcard" x="10" y="40" width="190" height="120" rx="12"/><rect class="dedge" x="24" y="40" width="162" height="0.1"/><circle class="dtint" cx="105.0" cy="73" r="23"/><g class="dg" transform="translate(91.2 59.2) scale(0.575)"><circle cx="24" cy="12" r="5"/><circle cx="10" cy="34" r="5"/><circle cx="38" cy="34" r="5"/><path d="M21 16l-8 14M27 16l8 14M15 36h18"/></g><text class="dt" x="105.0" y="116" text-anchor="middle">Analyst</text><text class="ds" x="105.0" y="134" text-anchor="middle">builds the case, cites</text><text class="ds" x="105.0" y="150" text-anchor="middle">sources</text></g><g class="k-brain"><rect class="dcard" x="260" y="40" width="190" height="104" rx="12"/><rect class="dedge" x="274" y="40" width="162" height="0.1"/><circle class="dtint" cx="355.0" cy="73" r="23"/><g class="dg" transform="translate(341.2 59.2) scale(0.575)"><circle cx="24" cy="12" r="5"/><circle cx="10" cy="34" r="5"/><circle cx="38" cy="34" r="5"/><path d="M21 16l-8 14M27 16l8 14M15 36h18"/></g><text class="dt" x="355.0" y="116" text-anchor="middle">Tactician</text><text class="ds" x="355.0" y="134" text-anchor="middle">prepares options</text></g><g class="k-brain"><rect class="dcard" x="510" y="40" width="190" height="104" rx="12"/><rect class="dedge" x="524" y="40" width="162" height="0.1"/><circle class="dtint" cx="605.0" cy="73" r="23"/><g class="dg" transform="translate(591.2 59.2) scale(0.575)"><circle cx="24" cy="12" r="5"/><circle cx="10" cy="34" r="5"/><circle cx="38" cy="34" r="5"/><path d="M21 16l-8 14M27 16l8 14M15 36h18"/></g><text class="dt" x="605.0" y="116" text-anchor="middle">Chief</text><text class="ds" x="605.0" y="134" text-anchor="middle">chooses one option</text></g><g class="k-good"><rect class="dcard" x="760" y="40" width="190" height="104" rx="12"/><rect class="dedge" x="774" y="40" width="162" height="0.1"/><circle class="dtint" cx="855.0" cy="73" r="23"/><g class="dg" transform="translate(841.2 59.2) scale(0.575)"><path d="M16 13L5 24l11 11M32 13l11 11-11 11M28 8l-8 32"/></g><text class="dt" x="855.0" y="116" text-anchor="middle">Code check</text><text class="ds" x="855.0" y="134" text-anchor="middle">verify_case, verify_plan</text></g><g class="k-gate"><rect class="dcard" x="1020" y="40" width="190" height="104" rx="12"/><rect class="dedge" x="1034" y="40" width="162" height="0.1"/><circle class="dtint" cx="1115.0" cy="73" r="23"/><g class="dg" transform="translate(1101.2 59.2) scale(0.575)"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M16 21v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="31" r="2"/></g><text class="dt" x="1115.0" y="116" text-anchor="middle">Safety gate</text><text class="ds" x="1115.0" y="134" text-anchor="middle">still checks each action</text></g><path class="dw  " d="M200.0 92.0 L260.0 92.0"/><polygon class="dh " points="260.0,92.0 249.0,97.5 249.0,86.5"/><path class="dw  " d="M450.0 92.0 L510.0 92.0"/><polygon class="dh " points="510.0,92.0 499.0,97.5 499.0,86.5"/><path class="dw  " d="M700.0 92.0 L760.0 92.0"/><polygon class="dh " points="760.0,92.0 749.0,97.5 749.0,86.5"/><path class="dw good " d="M950.0 92.0 L1020.0 92.0"/><polygon class="dh good" points="1020.0,92.0 1009.0,97.5 1009.0,86.5"/><text class="dl" x="985" y="74" text-anchor="middle">if it holds</text><g class="k-store"><rect class="dcard" x="135" y="240" width="230" height="104" rx="12"/><rect class="dedge" x="149" y="240" width="202" height="0.1"/><circle class="dtint" cx="250.0" cy="273" r="23"/><g class="dg" transform="translate(236.2 259.2) scale(0.575)"><path d="M24 12C19 7 11 7 5 9v29c6-2 14-2 19 3 5-5 13-5 19-3V9c-6-2-14-2-19 3z"/><path d="M24 12v29"/></g><text class="dt" x="250.0" y="316" text-anchor="middle">Read-only tools</text><text class="ds" x="250.0" y="334" text-anchor="middle">city graph, playbooks, history</text></g><g class="k-store"><rect class="dcard" x="510" y="240" width="250" height="120" rx="12"/><rect class="dedge" x="524" y="240" width="222" height="0.1"/><circle class="dlogo" cx="635.0" cy="273" r="23"/><image href="data:image/svg+xml;base64," x="614.2" y="258.6" width="41.7" height="28.8" preserveAspectRatio="xMidYMid meet"/><text class="dt" x="635.0" y="316" text-anchor="middle">Real model</text><text class="ds" x="635.0" y="334" text-anchor="middle">or the scripted stand-in if the</text><text class="ds" x="635.0" y="350" text-anchor="middle">call fails</text></g><path class="dw  dash" d="M250.0 240.0 L250.0 176.0"/><polygon class="dh " points="250.0,176.0 255.5,187.0 244.5,187.0"/><text class="dl" x="262" y="226" text-anchor="middle">read only</text><path class="dw  dash" d="M605.0 240.0 L605.0 176.0"/><polygon class="dh " points="605.0,176.0 610.5,187.0 599.5,187.0"/><text class="dl" x="620" y="226" text-anchor="middle">answers each role</text><g class="k-bad"><rect class="dcard" x="830" y="240" width="190" height="104" rx="12"/><rect class="dedge" x="844" y="240" width="162" height="0.1"/><circle class="dtint" cx="925.0" cy="273" r="23"/><g class="dg" transform="translate(911.2 259.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M16 16l16 16M32 16L16 32"/></g><text class="dt" x="925.0" y="316" text-anchor="middle">Plan refused</text><text class="ds" x="925.0" y="334" text-anchor="middle">nothing is sent</text></g><path class="dw bad " d="M925.0 144.0 L925.0 240.0"/><polygon class="dh bad" points="925.0,240.0 919.5,229.0 930.5,229.0"/><text class="dl" x="868" y="222" text-anchor="start">if it breaks a rule</text></svg>