<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engines work out the best move with mathematics, each off unless a scenario turns it on. A solver's answer comes with a certificate and goes through the same gate as anything else. If a solver fails, the Brain says so and uses the plain answer." viewBox="0 0 1240 278" width="1240" height="278"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="278" fill="#fff"/><rect class="dframe" x="268" y="0" width="570" height="268" rx="14"/><g class="k-bad"><rect class="dcard" x="10" y="70" width="190" height="120" rx="12"/><rect class="dedge" x="24" y="70" width="162" height="0.1"/><circle class="dtint" cx="105.0" cy="103" r="23"/><g class="dg" transform="translate(91.2 89.2) scale(0.575)"><path d="M24 6l19 34H5z"/><path d="M24 18v10M24 33v2"/></g><text class="dt" x="105.0" y="146" text-anchor="middle">A hard choice</text><text class="ds" x="105.0" y="164" text-anchor="middle">two collisions, one</text><text class="ds" x="105.0" y="180" text-anchor="middle">close ambulance</text></g><g class="k-brain"><rect class="dcard" x="280" y="10" width="172" height="118" rx="12"/><rect class="dedge" x="294" y="10" width="144" height="0.1"/><circle class="dtint" cx="366.0" cy="43" r="23"/><g class="dg" transform="translate(352.2 29.2) scale(0.575)"><path d="M6 32v-8l5-11h26l5 11v8z"/><path d="M6 24h36"/><circle cx="15" cy="34" r="4"/><circle cx="33" cy="34" r="4"/></g><text class="dt" x="366.0" y="86" text-anchor="middle">Dispatch</text><text class="ds" x="366.0" y="104" text-anchor="middle">who goes where</text></g><g class="k-brain"><rect class="dcard" x="466" y="10" width="172" height="118" rx="12"/><rect class="dedge" x="480" y="10" width="144" height="0.1"/><circle class="dtint" cx="552.0" cy="43" r="23"/><g class="dg" transform="translate(538.2 29.2) scale(0.575)"><circle cx="10" cy="38" r="5"/><circle cx="38" cy="10" r="5"/><path d="M15 38h15a7 7 0 0 0 0-14H18a7 7 0 0 1 0-14h15"/></g><text class="dt" x="552.0" y="86" text-anchor="middle">Clear road</text><text class="ds" x="552.0" y="104" text-anchor="middle">a green corridor</text></g><g class="k-brain"><rect class="dcard" x="652" y="10" width="172" height="118" rx="12"/><rect class="dedge" x="666" y="10" width="144" height="0.1"/><circle class="dtint" cx="738.0" cy="43" r="23"/><g class="dg" transform="translate(724.2 29.2) scale(0.575)"><path d="M3 24c6-10 14-14 21-14s15 4 21 14c-6 10-14 14-21 14S9 34 3 24z"/><circle cx="24" cy="24" r="6"/></g><text class="dt" x="738.0" y="86" text-anchor="middle">Perimeter</text><text class="ds" x="738.0" y="104" text-anchor="middle">seal the suspect in</text></g><g class="k-brain"><rect class="dcard" x="280" y="140" width="172" height="118" rx="12"/><rect class="dedge" x="294" y="140" width="144" height="0.1"/><circle class="dtint" cx="366.0" cy="173" r="23"/><g class="dg" transform="translate(352.2 159.2) scale(0.575)"><path d="M28 4L9 28h13l-3 16 20-25H25z"/></g><text class="dt" x="366.0" y="216" text-anchor="middle">Load shed</text><text class="ds" x="366.0" y="234" text-anchor="middle">the cheapest grid cut</text></g><g class="k-brain"><rect class="dcard" x="466" y="140" width="172" height="118" rx="12"/><rect class="dedge" x="480" y="140" width="144" height="0.1"/><circle class="dtint" cx="552.0" cy="173" r="23"/><g class="dg" transform="translate(538.2 159.2) scale(0.575)"><path d="M4 16c7-6 13 6 20 0s13 6 20 0M4 26c7-6 13 6 20 0s13 6 20 0M4 36c7-6 13 6 20 0s13 6 20 0"/></g><text class="dt" x="552.0" y="216" text-anchor="middle">Flood forecast</text><text class="ds" x="552.0" y="234" text-anchor="middle">time to the line</text></g><path class="dw  " d="M200.0 134.0 L268.0 134.0"/><polygon class="dh " points="268.0,134.0 257.0,139.5 257.0,128.5"/><g class="k-good"><rect class="dcard" x="890" y="60" width="170" height="138" rx="12"/><rect class="dedge" x="904" y="60" width="142" height="0.1"/><circle class="dtint" cx="975.0" cy="93" r="23"/><g class="dg" transform="translate(961.2 79.2) scale(0.575)"><path d="M18 26c0-5-4-7-4-13a10 10 0 0 1 20 0c0 6-4 8-4 13z"/><path d="M8 34c0-4 3-8 8-8h16c5 0 8 4 8 8v3H8zM8 43h32"/></g><text class="dt" x="975.0" y="136" text-anchor="middle">Answer +</text><text class="dt" x="975.0" y="154" text-anchor="middle">certificate</text><text class="ds" x="975.0" y="172" text-anchor="middle">how good, and against</text><text class="ds" x="975.0" y="188" text-anchor="middle">what</text></g><g class="k-gate"><rect class="dcard" x="1090" y="60" width="140" height="104" rx="12"/><rect class="dedge" x="1104" y="60" width="112" height="0.1"/><circle class="dtint" cx="1160.0" cy="93" r="23"/><g class="dg" transform="translate(1146.2 79.2) scale(0.575)"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M16 21v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="31" r="2"/></g><text class="dt" x="1160.0" y="136" text-anchor="middle">Safety gate</text><text class="ds" x="1160.0" y="154" text-anchor="middle">decides</text></g><path class="dw  " d="M838.0 134.0 L890.0 134.0"/><polygon class="dh " points="890.0,134.0 879.0,139.5 879.0,128.5"/><path class="dw good " d="M1060.0 112.0 L1090.0 112.0"/><polygon class="dh good" points="1090.0,112.0 1079.0,117.5 1079.0,106.5"/></svg>