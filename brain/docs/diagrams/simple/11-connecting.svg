<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Brain talks to one small interface, and a different adapter fits each way a Twin can speak. A Twin with different field names needs only a config entry, which `brain onboard` proposes. `brain conformance` checks a partner against the contract." viewBox="0 0 1240 434" width="1240" height="434"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="434" fill="#fff"/><g class="k-twin"><rect class="dcard" x="10" y="0" width="200" height="104" rx="12"/><rect class="dedge" x="24" y="0" width="172" height="0.1"/><circle class="dlogo" cx="110.0" cy="33" r="23"/><image href="data:image/svg+xml;base64," x="95.6" y="18.6" width="28.8" height="28.8" preserveAspectRatio="xMidYMid meet"/><text class="dt" x="110.0" y="76" text-anchor="middle">MCP Twin</text><text class="ds" x="110.0" y="94" text-anchor="middle">the default</text></g><g class="k-twin"><rect class="dcard" x="10" y="160" width="200" height="104" rx="12"/><rect class="dedge" x="24" y="160" width="172" height="0.1"/><circle class="dtint" cx="110.0" cy="193" r="23"/><g class="dg" transform="translate(96.2 179.2) scale(0.575)"><path d="M17 5v11M31 5v11M11 16h26v8a13 13 0 0 1-26 0z"/><path d="M24 37v7"/></g><text class="dt" x="110.0" y="236" text-anchor="middle">HTTP Twin</text><text class="ds" x="110.0" y="254" text-anchor="middle">plain REST</text></g><g class="k-twin"><rect class="dcard" x="10" y="320" width="200" height="104" rx="12"/><rect class="dedge" x="24" y="320" width="172" height="0.1"/><circle class="dlogo" cx="110.0" cy="353" r="23"/><image href="data:image/svg+xml;base64," x="95.6" y="338.6" width="28.8" height="28.8" preserveAspectRatio="xMidYMid meet"/><text class="dt" x="110.0" y="396" text-anchor="middle">MQTT Twin</text><text class="ds" x="110.0" y="414" text-anchor="middle">through a broker</text></g><g class="k-brain"><rect class="dcard" x="320" y="150" width="230" height="120" rx="12"/><rect class="dedge" x="334" y="150" width="202" height="0.1"/><circle class="dtint" cx="435.0" cy="183" r="23"/><g class="dg" transform="translate(421.2 169.2) scale(0.575)"><path d="M6 6h18l18 18-18 18L6 24z"/><circle cx="15" cy="15" r="3"/></g><text class="dt" x="435.0" y="226" text-anchor="middle">Name mapping</text><text class="ds" x="435.0" y="244" text-anchor="middle">a Twin's own words to the</text><text class="ds" x="435.0" y="260" text-anchor="middle">contract's</text></g><g class="k-brain"><rect class="dcard" x="650" y="150" width="210" height="120" rx="12"/><rect class="dedge" x="664" y="150" width="182" height="0.1"/><circle class="dtint" cx="755.0" cy="183" r="23"/><g class="dg" transform="translate(741.2 169.2) scale(0.575)"><circle cx="24" cy="24" r="5"/><circle cx="9" cy="13" r="3"/><circle cx="39" cy="13" r="3"/><circle cx="8" cy="34" r="3"/><circle cx="40" cy="34" r="3"/><circle cx="24" cy="6" r="3"/><path d="M20 21L11 15M28 21l9-6M20 28l-9 5M28 28l9 5M24 19V9"/></g><text class="dt" x="755.0" y="226" text-anchor="middle">City Brain</text><text class="ds" x="755.0" y="244" text-anchor="middle">one interface, whatever the</text><text class="ds" x="755.0" y="260" text-anchor="middle">Twin</text></g><g class="k-guardian"><rect class="dcard" x="1000" y="0" width="210" height="120" rx="12"/><rect class="dedge" x="1014" y="0" width="182" height="0.1"/><circle class="dtint" cx="1105.0" cy="33" r="23"/><g class="dg" transform="translate(1091.2 19.2) scale(0.575)"><path d="M24 5l15 5v12c0 9-6 16-15 20-9-4-15-11-15-20V10z"/><path d="M17 24l5 5 9-10"/></g><text class="dt" x="1105.0" y="76" text-anchor="middle">Guardian</text><text class="ds" x="1105.0" y="94" text-anchor="middle">REST: our contract or the</text><text class="ds" x="1105.0" y="110" text-anchor="middle">Guardian team's v1</text></g><g class="k-store"><rect class="dcard" x="1000" y="160" width="210" height="104" rx="12"/><rect class="dedge" x="1014" y="160" width="182" height="0.1"/><circle class="dlogo" cx="1105.0" cy="193" r="23"/><image href="data:image/svg+xml;base64," x="1090.6" y="178.6" width="28.8" height="28.8" preserveAspectRatio="xMidYMid meet"/><text class="dt" x="1105.0" y="236" text-anchor="middle">Other teams' agents</text><text class="ds" x="1105.0" y="254" text-anchor="middle">call our 10 MCP tools</text></g><g class="k-person"><rect class="dcard" x="1000" y="320" width="210" height="104" rx="12"/><rect class="dedge" x="1014" y="320" width="182" height="0.1"/><circle class="dlogo" cx="1105.0" cy="353" r="23"/><image href="data:image/svg+xml;base64," x="1090.6" y="338.6" width="28.8" height="28.8" preserveAspectRatio="xMidYMid meet"/><text class="dt" x="1105.0" y="396" text-anchor="middle">API and live feed</text><text class="ds" x="1105.0" y="414" text-anchor="middle">REST and server-sent events</text></g><path class="dw  " d="M210.0 52.0 L265.0 52.0 L265.0 210.0 L320.0 210.0"/><polygon class="dh " points="320.0,210.0 309.0,215.5 309.0,204.5"/><path class="dw  " d="M210.0 212.0 L265.0 212.0 L265.0 210.0 L320.0 210.0"/><polygon class="dh " points="320.0,210.0 309.0,215.5 309.0,204.5"/><path class="dw  " d="M210.0 372.0 L265.0 372.0 L265.0 210.0 L320.0 210.0"/><polygon class="dh " points="320.0,210.0 309.0,215.5 309.0,204.5"/><path class="dw  " d="M550.0 210.0 L650.0 210.0"/><polygon class="dh " points="650.0,210.0 639.0,215.5 639.0,204.5"/><text class="dl" x="600.0" y="202.0" text-anchor="middle">readings</text><path class="dw  " d="M860.0 210.0 L930.0 210.0 L930.0 60.0 L1000.0 60.0"/><polygon class="dh " points="1000.0,60.0 989.0,65.5 989.0,54.5"/><text class="dl" x="930" y="60" text-anchor="middle">ask</text><path class="dw  dash" d="M1000.0 212.0 L930.0 212.0 L930.0 210.0 L860.0 210.0"/><polygon class="dh " points="860.0,210.0 871.0,204.5 871.0,215.5"/><path class="dw  " d="M860.0 210.0 L930.0 210.0 L930.0 372.0 L1000.0 372.0"/><polygon class="dh " points="1000.0,372.0 989.0,377.5 989.0,366.5"/><text class="dl" x="930" y="380" text-anchor="middle">events</text></svg>