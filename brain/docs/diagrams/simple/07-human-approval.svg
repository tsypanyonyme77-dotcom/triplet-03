<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Closing a valve or cutting a feeder waits for a person when approval is on. The approval is signed and fits only that exact call, expires and works once, and the call then goes back through the gate." viewBox="0 0 1240 374" width="1240" height="374"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="374" fill="#fff"/><g class="k-bad"><rect class="dcard" x="10" y="40" width="190" height="104" rx="12"/><rect class="dedge" x="24" y="40" width="162" height="0.1"/><circle class="dtint" cx="105.0" cy="73" r="23"/><g class="dg" transform="translate(91.2 59.2) scale(0.575)"><path d="M24 5c7 10 14 17 14 25a14 14 0 0 1-28 0c0-8 7-15 14-25z"/></g><text class="dt" x="105.0" y="116" text-anchor="middle">High-impact action</text><text class="ds" x="105.0" y="134" text-anchor="middle">a valve, a grid cut</text></g><g class="k-gate"><rect class="dcard" x="260" y="40" width="190" height="104" rx="12"/><rect class="dedge" x="274" y="40" width="162" height="0.1"/><circle class="dtint" cx="355.0" cy="73" r="23"/><g class="dg" transform="translate(341.2 59.2) scale(0.575)"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M16 21v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="31" r="2"/></g><text class="dt" x="355.0" y="116" text-anchor="middle">Safety gate</text><text class="ds" x="355.0" y="134" text-anchor="middle">holds it: needs a person</text></g><g class="k-store"><rect class="dcard" x="510" y="40" width="170" height="104" rx="12"/><rect class="dedge" x="524" y="40" width="142" height="0.1"/><circle class="dtint" cx="595.0" cy="73" r="23"/><g class="dg" transform="translate(581.2 59.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M24 12v12l8 6"/></g><text class="dt" x="595.0" y="116" text-anchor="middle">Waiting</text><text class="ds" x="595.0" y="134" text-anchor="middle">kept across a restart</text></g><g class="k-person"><rect class="dcard" x="740" y="40" width="200" height="120" rx="12"/><rect class="dedge" x="754" y="40" width="172" height="0.1"/><circle class="dtint" cx="840.0" cy="73" r="23"/><g class="dg" transform="translate(826.2 59.2) scale(0.575)"><circle cx="24" cy="15" r="7"/><path d="M9 42c0-9 7-14 15-14s15 5 15 14"/></g><text class="dt" x="840.0" y="116" text-anchor="middle">A person decides</text><text class="ds" x="840.0" y="134" text-anchor="middle">with the approve</text><text class="ds" x="840.0" y="150" text-anchor="middle">permission</text></g><g class="k-person"><rect class="dcard" x="1010" y="40" width="210" height="120" rx="12"/><rect class="dedge" x="1024" y="40" width="182" height="0.1"/><circle class="dtint" cx="1115.0" cy="73" r="23"/><g class="dg" transform="translate(1101.2 59.2) scale(0.575)"><circle cx="15" cy="24" r="9"/><path d="M24 24h19M36 24v8M43 24v6"/></g><text class="dt" x="1115.0" y="116" text-anchor="middle">Signed approval</text><text class="ds" x="1115.0" y="134" text-anchor="middle">exact call, expires, used</text><text class="ds" x="1115.0" y="150" text-anchor="middle">once</text></g><path class="dw  " d="M200.0 92.0 L260.0 92.0"/><polygon class="dh " points="260.0,92.0 249.0,97.5 249.0,86.5"/><path class="dw  " d="M450.0 92.0 L510.0 92.0"/><polygon class="dh " points="510.0,92.0 499.0,97.5 499.0,86.5"/><text class="dl" x="480.0" y="84.0" text-anchor="middle">requested</text><path class="dw  " d="M680.0 92.0 L740.0 92.0"/><polygon class="dh " points="740.0,92.0 729.0,97.5 729.0,86.5"/><path class="dw good " d="M940.0 100.0 L1010.0 100.0"/><polygon class="dh good" points="1010.0,100.0 999.0,105.5 999.0,94.5"/><text class="dl" x="975.0" y="92.0" text-anchor="middle">grants</text><g class="k-bad"><rect class="dcard" x="740" y="260" width="200" height="104" rx="12"/><rect class="dedge" x="754" y="260" width="172" height="0.1"/><circle class="dtint" cx="840.0" cy="293" r="23"/><g class="dg" transform="translate(826.2 279.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M16 16l16 16M32 16L16 32"/></g><text class="dt" x="840.0" y="336" text-anchor="middle">Denied</text><text class="ds" x="840.0" y="354" text-anchor="middle">nothing is sent</text></g><path class="dw bad " d="M840.0 160.0 L840.0 260.0"/><polygon class="dh bad" points="840.0,260.0 834.5,249.0 845.5,249.0"/><text class="dl" x="855" y="228" text-anchor="start">denies</text><g class="k-gate"><rect class="dcard" x="1010" y="260" width="210" height="104" rx="12"/><rect class="dedge" x="1024" y="260" width="182" height="0.1"/><circle class="dtint" cx="1115.0" cy="293" r="23"/><g class="dg" transform="translate(1101.2 279.2) scale(0.575)"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M16 21v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="31" r="2"/></g><text class="dt" x="1115.0" y="336" text-anchor="middle">Gate checks again</text><text class="ds" x="1115.0" y="354" text-anchor="middle">every later check runs</text></g><path class="dw good " d="M1115.0 160.0 L1115.0 260.0"/><polygon class="dh good" points="1115.0,260.0 1109.5,249.0 1120.5,249.0"/></svg>