card" x="780" y="345" width="230" height="118" rx="12"/><rect class="dedge" x="794" y="345" width="202" height="0.1"/><circle class="dtint" cx="895.0" cy="378" r="23"/><g class="dg" transform="translate(881.2 364.2) scale(0.575)"><path d="M12 5h17l9 9v29H12z"/><path d="M29 5v9h9"/><path d="M18 24h14M18 31h14M18 38h8"/></g><text class="dt" x="895.0" y="421" text-anchor="middle">.env</text><text class="ds" x="895.0" y="439" text-anchor="middle">Groq key, Neo4j password</text></g><path class="dw  dash" d="M780.0 404.0 L690.0 404.0 L690.0 240.0"/><polygon class="dh " points="690.0,240.0 695.5,251.0 684.5,251.0"/><text class="dl" x="702" y="332" text-anchor="start">secrets</text></svg>