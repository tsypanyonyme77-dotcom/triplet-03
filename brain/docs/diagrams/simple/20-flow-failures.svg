<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Each failure has a planned answer, and each is checked by a test or a scenario. The rule is the same throughout: lose a helper and carry on; lose trust and stop acting." viewBox="0 0 1240 626" width="1240" height="626"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="626" fill="#fff"/><g class="k-guardian"><rect class="dcard" x="10" y="0" width="300" height="112" rx="12"/><rect class="dedge" x="24" y="0" width="272" height="0.1"/><circle class="dtint" cx="160.0" cy="33" r="23"/><g class="dg" transform="translate(146.2 19.2) scale(0.575)"><path d="M24 5l15 5v12c0 9-6 16-15 20-9-4-15-11-15-20V10z"/><path d="M17 24l5 5 9-10"/></g><text class="dt" x="160.0" y="76" text-anchor="middle">Guardian stops answering</text><text class="ds" x="160.0" y="94" text-anchor="middle">t15</text></g><g class="k-bad"><rect class="dcard" x="420" y="0" width="380" height="112" rx="12"/><rect class="dedge" x="434" y="0" width="352" height="0.1"/><circle class="dtint" cx="610.0" cy="33" r="23"/><g class="dg" transform="translate(596.2 19.2) scale(0.575)"><path d="M16 5h16l11 11v16L32 43H16L5 32V16z"/><path d="M16 24h16"/></g><text class="dt" x="610.0" y="76" text-anchor="middle">Low-impact actions only, and it says so</text><text class="dt" x="610.0" y="94" text-anchor="middle">once</text></g><g class="k-gate"><rect class="dcard" x="910" y="0" width="320" height="112" rx="12"/><rect class="dedge" x="924" y="0" width="292" height="0.1"/><circle class="dtint" cx="1070.0" cy="33" r="23"/><g class="dg" transform="translate(1056.2 19.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M15 25l6 6 12-14"/></g><text class="dt" x="1070.0" y="76" text-anchor="middle">Safe: no high-impact action on</text><text class="dt" x="1070.0" y="94" text-anchor="middle">unjudged data</text></g><path class="dw  " d="M310.0 56.0 L420.0 56.0"/><polygon class="dh " points="420.0,56.0 409.0,61.5 409.0,50.5"/><path class="dw  " d="M800.0 56.0 L910.0 56.0"/><polygon class="dh " points="910.0,56.0 899.0,61.5 899.0,50.5"/><g class="k-twin"><rect class="dcard" x="10" y="126" width="300" height="112" rx="12"/><rect class="dedge" x="24" y="126" width="272" height="0.1"/><circle class="dtint" cx="160.0" cy="159" r="23"/><g class="dg" transform="translate(146.2 145.2) scale(0.575)"><path d="M6 42V22h10v20M16 42V10h12v32M28 42V26h10v16M4 42h40"/></g><text class="dt" x="160.0" y="202" text-anchor="middle">Twin unreachable mid-pursuit</text><text class="ds" x="160.0" y="220" text-anchor="middle">tests</text></g><g class="k-brain"><rect class="dcard" x="420" y="126" width="380" height="112" rx="12"/><rect class="dedge" x="434" y="126" width="352" height="0.1"/><circle class="dtint" cx="610.0" cy="159" r="23"/><g class="dg" transform="translate(596.2 145.2) scale(0.575)"><path d="M38 20a14 14 0 0 0-26-4"/><path d="M12 8v8h8"/><path d="M10 28a14 14 0 0 0 26 4"/><path d="M36 40v-8h-8"/></g><text class="dt" x="610.0" y="202" text-anchor="middle">Says it is degraded, asks again every 2 s</text></g><g class="k-good"><rect class="dcard" x="910" y="126" width="320" height="112" rx="12"/><rect class="dedge" x="924" y="126" width="292" height="0.1"/><circle class="dtint" cx="1070.0" cy="159" r="23"/><g class="dg" transform="translate(1056.2 145.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M15 25l6 6 12-14"/></g><text class="dt" x="1070.0" y="202" text-anchor="middle">Twin returns; the run carries on</text></g><path class="dw  " d="M310.0 182.0 L420.0 182.0"/><polygon class="dh " points="420.0,182.0 409.0,187.5 409.0,176.5"/><path class="dw  " d="M800.0 182.0 L910.0 182.0"/><polygon class="dh " points="910.0,182.0 899.0,187.5 899.0,176.5"/><g class="k-store"><rect class="dcard" x="10" y="252" width="300" height="112" rx="12"/><rect class="dedge" x="24" y="252" width="272" height="0.1"/><circle class="dlogo" cx="160.0" cy="285" r="23"/><image href="data:image/svg+xml;base64," x="145.6" y="270.6" width="28.8" height="28.8" preserveAspectRatio="xMidYMid meet"/><text class="dt" x="160.0" y="328" text-anchor="middle">Vector store stops</text><text class="ds" x="160.0" y="346" text-anchor="middle">tests</text></g><g class="k-good"><rect class="dcard" x="420" y="252" width="380" height="112" rx="12"/><rect class="dedge" x="434" y="252" width="352" height="0.1"/><circle class="dtint" cx="610.0" cy="285" r="23"/><g class="dg" transform="translate(596.2 271.2) scale(0.575)"><path d="M24 12C19 7 11 7 5 9v29c6-2 14-2 19 3 5-5 13-5 19-3V9c-6-2-14-2-19 3z"/><path d="M24 12v29"/></g><text class="dt" x="610.0" y="328" text-anchor="middle">Copy in memory answers the search</text></g><g class="k-good"><rect class="dcard" x="910" y="252" width="320" height="112" rx="12"/><rect class="dedge" x="924" y="252" width="292" height="0.1"/><circle class="dtint" cx="1070.0" cy="285" r="23"/><g class="dg" transform="translate(1056.2 271.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M15 25l6 6 12-14"/></g><text class="dt" x="1070.0" y="328" text-anchor="middle">Decisions do not change; the switch</text><text class="dt" x="1070.0" y="346" text-anchor="middle">is logged</text></g><path class="dw  " d="M310.0 308.0 L420.0 308.0"/><polygon class="dh " points="420.0,308.0 409.0,313.5 409.0,302.5"/><path class="dw  " d="M800.0 308.0 L910.0 308.0"/><polygon class="dh " points="910.0,308.0 899.0,313.5 899.0,302.5"/><g class="k-store"><rect class="dcard" x="10" y="378" width="300" height="112" rx="12"/><rect class="dedge" x="24" y="378" width="272" height="0.1"/><circle class="dlogo" cx="160.0" cy="411" r="23"/><image href="data:image/svg+xml;base64," x="139.2" y="396.6" width="41.7" height="28.8" preserveAspectRatio="xMidYMid meet"/><text class="dt" x="160.0" y="454" text-anchor="middle">A model call fails</text><text class="ds" x="160.0" y="472" text-anchor="middle">real runs</text></g><g class="k-good"><rect class="dcard" x="420" y="378" width="380" height="112" rx="12"/><rect class="dedge" x="434" y="378" width="352" height="0.1"/><circle class="dtint" cx="610.0" cy="411" r="23"/><g class="dg" transform="translate(596.2 397.2) scale(0.575)"><circle cx="24" cy="12" r="5"/><circle cx="10" cy="34" r="5"/><circle cx="38" cy="34" r="5"/><path d="M21 16l-8 14M27 16l8 14M15 36h18"/></g><text class="dt" x="610.0" y="454" text-anchor="middle">Scripted stand-in takes the role</text></g><g class="k-good"><rect class="dcard" x="910" y="378" width="320" height="112" rx="12"/><rect class="dedge" x="924" y="378" width="292" height="0.1"/><circle class="dtint" cx="1070.0" cy="411" r="23"/><g class="dg" transform="translate(1056.2 397.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M15 25l6 6 12-14"/></g><text class="dt" x="1070.0" y="454" text-anchor="middle">Scenario still passes; fallback</text><text class="dt" x="1070.0" y="472" text-anchor="middle">logged</text></g><path class="dw  " d="M310.0 434.0 L420.0 434.0"/><polygon class="dh " points="420.0,434.0 409.0,439.5 409.0,428.5"/><path class="dw  " d="M800.0 434.0 L910.0 434.0"/><polygon class="dh " points="910.0,434.0 899.0,439.5 899.0,428.5"/><g class="k-bad"><rect class="dcard" x="10" y="504" width="300" height="112" rx="12"/><rect class="dedge" x="24" y="504" width="272" height="0.1"/><circle class="dtint" cx="160.0" cy="537" r="23"/><g class="dg" transform="translate(146.2 523.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M16 16l16 16M32 16L16 32"/></g><text class="dt" x="160.0" y="580" text-anchor="middle">Attacker replays a reading</text><text class="ds" x="160.0" y="598" text-anchor="middle">red team</text></g><g class="k-bad"><rect class="dcard" x="420" y="504" width="380" height="112" rx="12"/><rect class="dedge" x="434" y="504" width="352" height="0.1"/><circle class="dtint" cx="610.0" cy="537" r="23"/><g class="dg" transform="translate(596.2 523.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M24 12v12l8 6"/></g><text class="dt" x="610.0" y="580" text-anchor="middle">Refused: seen before</text></g><g class="k-gate"><rect class="dcard" x="910" y="504" width="320" height="112" rx="12"/><rect class="dedge" x="924" y="504" width="292" height="0.1"/><circle class="dtint" cx="1070.0" cy="537" r="23"/><g class="dg" transform="translate(1056.2 523.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M15 25l6 6 12-14"/></g><text class="dt" x="1070.0" y="580" text-anchor="middle">Nothing happens; refusal logged</text></g><path class="dw  " d="M310.0 560.0 L420.0 560.0"/><polygon class="dh " points="420.0,560.0 409.0,565.5 409.0,554.5"/><path class="dw  " d="M800.0 560.0 L910.0 560.0"/><polygon class="dh " points="910.0,560.0 899.0,565.5 899.0,554.5"/></svg>