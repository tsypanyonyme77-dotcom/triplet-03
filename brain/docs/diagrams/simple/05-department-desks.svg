<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fire, Ambulance and medical, Traffic control, Disaster response and Utilities each have an analyst and a chief. The chief picks which neighbouring zones to warn, code checks the choice, and the public wording is fixed in policy, so a model never writes a public message." viewBox="0 0 1240 420" width="1240" height="420"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="420" fill="#fff"/><g class="k-bad"><rect class="dcard" x="10" y="70" width="190" height="120" rx="12"/><rect class="dedge" x="24" y="70" width="162" height="0.1"/><circle class="dtint" cx="105.0" cy="103" r="23"/><g class="dg" transform="translate(91.2 89.2) scale(0.575)"><path d="M24 5c2 9 12 13 12 25a12 12 0 0 1-24 0c0-6 4-9 5-14 3 2 4 5 4 7 3-4 4-11 3-18z"/></g><text class="dt" x="105.0" y="146" text-anchor="middle">An incident</text><text class="ds" x="105.0" y="164" text-anchor="middle">reviewed again when a</text><text class="ds" x="105.0" y="180" text-anchor="middle">new source joins</text></g><g class="k-brain"><rect class="dcard" x="260" y="70" width="180" height="104" rx="12"/><rect class="dedge" x="274" y="70" width="152" height="0.1"/><circle class="dtint" cx="350.0" cy="103" r="23"/><g class="dg" transform="translate(336.2 89.2) scale(0.575)"><circle cx="24" cy="12" r="5"/><circle cx="10" cy="34" r="5"/><circle cx="38" cy="34" r="5"/><path d="M21 16l-8 14M27 16l8 14M15 36h18"/></g><text class="dt" x="350.0" y="146" text-anchor="middle">Desk analyst</text><text class="ds" x="350.0" y="164" text-anchor="middle">how serious is it?</text></g><g class="k-brain"><rect class="dcard" x="500" y="70" width="180" height="104" rx="12"/><rect class="dedge" x="514" y="70" width="152" height="0.1"/><circle class="dtint" cx="590.0" cy="103" r="23"/><g class="dg" transform="translate(576.2 89.2) scale(0.575)"><circle cx="24" cy="12" r="5"/><circle cx="10" cy="34" r="5"/><circle cx="38" cy="34" r="5"/><path d="M21 16l-8 14M27 16l8 14M15 36h18"/></g><text class="dt" x="590.0" y="146" text-anchor="middle">Desk chief</text><text class="ds" x="590.0" y="164" text-anchor="middle">warn which zones?</text></g><g class="k-good"><rect class="dcard" x="740" y="70" width="190" height="120" rx="12"/><rect class="dedge" x="754" y="70" width="162" height="0.1"/><circle class="dtint" cx="835.0" cy="103" r="23"/><g class="dg" transform="translate(821.2 89.2) scale(0.575)"><path d="M16 13L5 24l11 11M32 13l11 11-11 11M28 8l-8 32"/></g><text class="dt" x="835.0" y="146" text-anchor="middle">Code check</text><text class="ds" x="835.0" y="164" text-anchor="middle">within 2 hops, at most 3</text><text class="ds" x="835.0" y="180" text-anchor="middle">zones</text></g><g class="k-gate"><rect class="dcard" x="1000" y="70" width="200" height="104" rx="12"/><rect class="dedge" x="1014" y="70" width="172" height="0.1"/><circle class="dtint" cx="1100.0" cy="103" r="23"/><g class="dg" transform="translate(1086.2 89.2) scale(0.575)"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M16 21v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="31" r="2"/></g><text class="dt" x="1100.0" y="146" text-anchor="middle">Safety gate</text><text class="ds" x="1100.0" y="164" text-anchor="middle">then the alert goes out</text></g><path class="dw  " d="M200.0 122.0 L260.0 122.0"/><polygon class="dh " points="260.0,122.0 249.0,127.5 249.0,116.5"/><path class="dw  " d="M440.0 122.0 L500.0 122.0"/><polygon class="dh " points="500.0,122.0 489.0,127.5 489.0,116.5"/><path class="dw  " d="M680.0 122.0 L740.0 122.0"/><polygon class="dh " points="740.0,122.0 729.0,127.5 729.0,116.5"/><text class="dl" x="710.0" y="114.0" text-anchor="middle">zone ids</text><path class="dw good " d="M930.0 122.0 L1000.0 122.0"/><polygon class="dh good" points="1000.0,122.0 989.0,127.5 989.0,116.5"/><g class="k-store"><rect class="dcard" x="740" y="270" width="190" height="104" rx="12"/><rect class="dedge" x="754" y="270" width="162" height="0.1"/><circle class="dtint" cx="835.0" cy="303" r="23"/><g class="dg" transform="translate(821.2 289.2) scale(0.575)"><path d="M12 5h17l9 9v29H12z"/><path d="M29 5v9h9"/><path d="M18 24h14M18 31h14M18 38h8"/></g><text class="dt" x="835.0" y="346" text-anchor="middle">Fixed wording</text><text class="ds" x="835.0" y="364" text-anchor="middle">written in policy.yaml</text></g><path class="dw  dash" d="M835.0 270.0 L835.0 190.0"/><polygon class="dh " points="835.0,190.0 840.5,201.0 829.5,201.0"/><text class="dl" x="848" y="256" text-anchor="start">the message</text><g class="k-brain"><rect class="dcard" x="10" y="270" width="195" height="112" rx="12"/><rect class="dedge" x="24" y="270" width="167" height="0.1"/><circle class="dtint" cx="107.5" cy="303" r="23"/><g class="dg" transform="translate(93.7 289.2) scale(0.575)"><path d="M24 5c2 9 12 13 12 25a12 12 0 0 1-24 0c0-6 4-9 5-14 3 2 4 5 4 7 3-4 4-11 3-18z"/></g><text class="dt" x="107.5" y="346" text-anchor="middle">Fire</text></g><g class="k-brain"><rect class="dcard" x="260" y="270" width="195" height="112" rx="12"/><rect class="dedge" x="274" y="270" width="167" height="0.1"/><circle class="dtint" cx="357.5" cy="303" r="23"/><g class="dg" transform="translate(343.7 289.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M16 16l16 16M32 16L16 32"/></g><text class="dt" x="357.5" y="346" text-anchor="middle">Ambulance</text></g><g class="k-brain"><rect class="dcard" x="510" y="270" width="195" height="112" rx="12"/><rect class="dedge" x="524" y="270" width="167" height="0.1"/><circle class="dtint" cx="607.5" cy="303" r="23"/><g class="dg" transform="translate(593.7 289.2) scale(0.575)"><rect x="16" y="4" width="16" height="32" rx="4"/><circle cx="24" cy="12" r="3"/><circle cx="24" cy="20" r="3"/><circle cx="24" cy="28" r="3"/><path d="M24 36v8"/></g><text class="dt" x="607.5" y="346" text-anchor="middle">Traffic</text></g><g class="k-brain"><rect class="dcard" x="760" y="270" width="195" height="112" rx="12"/><rect class="dedge" x="774" y="270" width="167" height="0.1"/><circle class="dtint" cx="857.5" cy="303" r="23"/><g class="dg" transform="translate(843.7 289.2) scale(0.575)"><path d="M24 5c7 10 14 17 14 25a14 14 0 0 1-28 0c0-8 7-15 14-25z"/></g><text class="dt" x="857.5" y="346" text-anchor="middle">Disaster</text></g><g class="k-brain"><rect class="dcard" x="1010" y="270" width="195" height="112" rx="12"/><rect class="dedge" x="1024" y="270" width="167" height="0.1"/><circle class="dtint" cx="1107.5" cy="303" r="23"/><g class="dg" transform="translate(1093.7 289.2) scale(0.575)"><path d="M16 13L5 24l11 11M32 13l11 11-11 11M28 8l-8 32"/></g><text class="dt" x="1107.5" y="346" text-anchor="middle">Utilities</text></g><text class="dl" x="320" y="402" text-anchor="middle">five desks; Police has its own team of three</text></svg>