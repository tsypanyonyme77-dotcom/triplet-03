<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Any decision or held action can be explained from the Brain's own log, with nothing invented: what it rested on, which check it passed or failed, and what would have changed it. The same explanation reaches four places." viewBox="0 0 1240 502" width="1240" height="502"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="502" fill="#fff"/><g class="k-good"><rect class="dcard" x="10" y="190" width="200" height="120" rx="12"/><rect class="dedge" x="24" y="190" width="172" height="0.1"/><circle class="dtint" cx="110.0" cy="223" r="23"/><g class="dg" transform="translate(96.2 209.2) scale(0.575)"><rect x="4" y="17" width="20" height="14" rx="7"/><rect x="24" y="17" width="20" height="14" rx="7"/><path d="M17 24h14"/></g><text class="dt" x="110.0" y="266" text-anchor="middle">The sealed log</text><text class="ds" x="110.0" y="284" text-anchor="middle">what really happened</text></g><g class="k-brain"><rect class="dcard" x="320" y="190" width="250" height="120" rx="12"/><rect class="dedge" x="334" y="190" width="222" height="0.1"/><circle class="dtint" cx="445.0" cy="223" r="23"/><g class="dg" transform="translate(431.2 209.2) scale(0.575)"><circle cx="21" cy="21" r="14"/><path d="M31 31l12 12"/></g><text class="dt" x="445.0" y="266" text-anchor="middle">Explanation</text><text class="ds" x="445.0" y="284" text-anchor="middle">built from the log, for one</text><text class="ds" x="445.0" y="300" text-anchor="middle">decision or hold</text></g><path class="dw  " d="M210.0 250.0 L320.0 250.0"/><polygon class="dh " points="320.0,250.0 309.0,255.5 309.0,244.5"/><g class="k-person"><rect class="dcard" x="780" y="0" width="400" height="114" rx="12"/><rect class="dedge" x="794" y="0" width="372" height="0.1"/><circle class="dtint" cx="980.0" cy="33" r="23"/><g class="dg" transform="translate(966.2 19.2) scale(0.575)"><rect x="5" y="9" width="38" height="24" rx="3"/><path d="M17 41h14M24 33v8"/></g><text class="dt" x="980.0" y="76" text-anchor="middle">Side panel</text><text class="ds" x="980.0" y="94" text-anchor="middle">steps, gate, what would change it</text></g><path class="dw  " d="M570.0 250.0 L675.0 250.0 L675.0 57.0 L780.0 57.0"/><polygon class="dh " points="780.0,57.0 769.0,62.5 769.0,51.5"/><g class="k-person"><rect class="dcard" x="780" y="126" width="400" height="114" rx="12"/><rect class="dedge" x="794" y="126" width="372" height="0.1"/><circle class="dtint" cx="980.0" cy="159" r="23"/><g class="dg" transform="translate(966.2 145.2) scale(0.575)"><circle cx="24" cy="24" r="5"/><circle cx="9" cy="13" r="3"/><circle cx="39" cy="13" r="3"/><circle cx="8" cy="34" r="3"/><circle cx="40" cy="34" r="3"/><circle cx="24" cy="6" r="3"/><path d="M20 21L11 15M28 21l9-6M20 28l-9 5M28 28l9 5M24 19V9"/></g><text class="dt" x="980.0" y="202" text-anchor="middle">Replay in the 3D brain</text><text class="ds" x="980.0" y="220" text-anchor="middle">camera visits each part (W key)</text></g><path class="dw  " d="M570.0 250.0 L675.0 250.0 L675.0 183.0 L780.0 183.0"/><polygon class="dh " points="780.0,183.0 769.0,188.5 769.0,177.5"/><g class="k-store"><rect class="dcard" x="780" y="252" width="400" height="114" rx="12"/><rect class="dedge" x="794" y="252" width="372" height="0.1"/><circle class="dlogo" cx="980.0" cy="285" r="23"/><image href="data:image/svg+xml;base64," x="965.6" y="270.6" width="28.8" height="28.8" preserveAspectRatio="xMidYMid meet"/><text class="dt" x="980.0" y="328" text-anchor="middle">Other teams' agents</text><text class="ds" x="980.0" y="346" text-anchor="middle">ask through an MCP tool</text></g><path class="dw  " d="M570.0 250.0 L675.0 250.0 L675.0 309.0 L780.0 309.0"/><polygon class="dh " points="780.0,309.0 769.0,314.5 769.0,303.5"/><g class="k-store"><rect class="dcard" x="780" y="378" width="400" height="114" rx="12"/><rect class="dedge" x="794" y="378" width="372" height="0.1"/><circle class="dtint" cx="980.0" cy="411" r="23"/><g class="dg" transform="translate(966.2 397.2) scale(0.575)"><path d="M12 5h17l9 9v29H12z"/><path d="M29 5v9h9"/><path d="M18 24h14M18 31h14M18 38h8"/></g><text class="dt" x="980.0" y="454" text-anchor="middle">Provenance export</text><text class="ds" x="980.0" y="472" text-anchor="middle">standard PROV format</text></g><path class="dw  " d="M570.0 250.0 L675.0 250.0 L675.0 435.0 L780.0 435.0"/><polygon class="dh " points="780.0,435.0 769.0,440.5 769.0,429.5"/></svg>