<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Play a run's inputs back and the decisions must match. Change any line of a log and the chain shows it. Re-run the scenarios and every decision must equal the frozen record. Recorded model answers let the agents replay with no network." viewBox="0 0 1240 526" width="1240" height="526"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="526" fill="#fff"/><g class="k-store"><rect class="dcard" x="60" y="0" width="300" height="120" rx="12"/><rect class="dedge" x="74" y="0" width="272" height="0.1"/><circle class="dtint" cx="210.0" cy="33" r="23"/><g class="dg" transform="translate(196.2 19.2) scale(0.575)"><path d="M12 5h17l9 9v29H12z"/><path d="M29 5v9h9"/><path d="M18 24h14M18 31h14M18 38h8"/></g><text class="dt" x="210.0" y="76" text-anchor="middle">Input journal</text><text class="ds" x="210.0" y="94" text-anchor="middle">every input kept</text></g><g class="k-brain"><rect class="dcard" x="470" y="0" width="300" height="120" rx="12"/><rect class="dedge" x="484" y="0" width="272" height="0.1"/><circle class="dtint" cx="620.0" cy="33" r="23"/><g class="dg" transform="translate(606.2 19.2) scale(0.575)"><path d="M38 20a14 14 0 0 0-26-4"/><path d="M12 8v8h8"/><path d="M10 28a14 14 0 0 0 26 4"/><path d="M36 40v-8h-8"/></g><text class="dt" x="620.0" y="76" text-anchor="middle">brain replay</text><text class="ds" x="620.0" y="94" text-anchor="middle">plays the inputs back</text></g><g class="k-good"><rect class="dcard" x="880" y="0" width="300" height="120" rx="12"/><rect class="dedge" x="894" y="0" width="272" height="0.1"/><circle class="dtint" cx="1030.0" cy="33" r="23"/><g class="dg" transform="translate(1016.2 19.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M15 25l6 6 12-14"/></g><text class="dt" x="1030.0" y="76" text-anchor="middle">Same decisions</text><text class="ds" x="1030.0" y="94" text-anchor="middle">exit 0 match, 1 difference</text></g><path class="dw  " d="M360.0 60.0 L470.0 60.0"/><polygon class="dh " points="470.0,60.0 459.0,65.5 459.0,54.5"/><path class="dw  " d="M770.0 60.0 L880.0 60.0"/><polygon class="dh " points="880.0,60.0 869.0,65.5 869.0,54.5"/><g class="k-store"><rect class="dcard" x="60" y="132" width="300" height="120" rx="12"/><rect class="dedge" x="74" y="132" width="272" height="0.1"/><circle class="dtint" cx="210.0" cy="165" r="23"/><g class="dg" transform="translate(196.2 151.2) scale(0.575)"><rect x="4" y="17" width="20" height="14" rx="7"/><rect x="24" y="17" width="20" height="14" rx="7"/><path d="M17 24h14"/></g><text class="dt" x="210.0" y="208" text-anchor="middle">Sealed log</text><text class="ds" x="210.0" y="226" text-anchor="middle">each event hashes the last, head signed</text></g><g class="k-brain"><rect class="dcard" x="470" y="132" width="300" height="120" rx="12"/><rect class="dedge" x="484" y="132" width="272" height="0.1"/><circle class="dtint" cx="620.0" cy="165" r="23"/><g class="dg" transform="translate(606.2 151.2) scale(0.575)"><circle cx="21" cy="21" r="14"/><path d="M31 31l12 12"/></g><text class="dt" x="620.0" y="208" text-anchor="middle">brain audit verify</text><text class="ds" x="620.0" y="226" text-anchor="middle">walks the chain</text></g><g class="k-good"><rect class="dcard" x="880" y="132" width="300" height="120" rx="12"/><rect class="dedge" x="894" y="132" width="272" height="0.1"/><circle class="dtint" cx="1030.0" cy="165" r="23"/><g class="dg" transform="translate(1016.2 151.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M15 25l6 6 12-14"/></g><text class="dt" x="1030.0" y="208" text-anchor="middle">Any changed line shows</text><text class="ds" x="1030.0" y="226" text-anchor="middle">the chain breaks there</text></g><path class="dw  " d="M360.0 192.0 L470.0 192.0"/><polygon class="dh " points="470.0,192.0 459.0,197.5 459.0,186.5"/><path class="dw  " d="M770.0 192.0 L880.0 192.0"/><polygon class="dh " points="880.0,192.0 869.0,197.5 869.0,186.5"/><g class="k-store"><rect class="dcard" x="60" y="264" width="300" height="120" rx="12"/><rect class="dedge" x="74" y="264" width="272" height="0.1"/><circle class="dtint" cx="210.0" cy="297" r="23"/><g class="dg" transform="translate(196.2 283.2) scale(0.575)"><path d="M24 12C19 7 11 7 5 9v29c6-2 14-2 19 3 5-5 13-5 19-3V9c-6-2-14-2-19 3z"/><path d="M24 12v29"/></g><text class="dt" x="210.0" y="340" text-anchor="middle">Test Book</text><text class="ds" x="210.0" y="358" text-anchor="middle">38 scenarios</text></g><g class="k-brain"><rect class="dcard" x="470" y="264" width="300" height="120" rx="12"/><rect class="dedge" x="484" y="264" width="272" height="0.1"/><circle class="dtint" cx="620.0" cy="297" r="23"/><g class="dg" transform="translate(606.2 283.2) scale(0.575)"><path d="M24 8v32M12 40h24M10 14h28"/><path d="M10 14l-5 12h10zM38 14l-5 12h10z"/></g><text class="dt" x="620.0" y="340" text-anchor="middle">brain baseline --check</text><text class="ds" x="620.0" y="358" text-anchor="middle">against a frozen record</text></g><g class="k-good"><rect class="dcard" x="880" y="264" width="300" height="120" rx="12"/><rect class="dedge" x="894" y="264" width="272" height="0.1"/><circle class="dtint" cx="1030.0" cy="297" r="23"/><g class="dg" transform="translate(1016.2 283.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M15 25l6 6 12-14"/></g><text class="dt" x="1030.0" y="340" text-anchor="middle">Every decision as recorded</text><text class="ds" x="1030.0" y="358" text-anchor="middle">or the check fails</text></g><path class="dw  " d="M360.0 324.0 L470.0 324.0"/><polygon class="dh " points="470.0,324.0 459.0,329.5 459.0,318.5"/><path class="dw  " d="M770.0 324.0 L880.0 324.0"/><polygon class="dh " points="880.0,324.0 869.0,329.5 869.0,318.5"/><g class="k-store"><rect class="dcard" x="60" y="396" width="300" height="120" rx="12"/><rect class="dedge" x="74" y="396" width="272" height="0.1"/><circle class="dlogo" cx="210.0" cy="429" r="23"/><image href="data:image/svg+xml;base64," x="189.2" y="414.6" width="41.7" height="28.8" preserveAspectRatio="xMidYMid meet"/><text class="dt" x="210.0" y="472" text-anchor="middle">Agent cassette</text><text class="ds" x="210.0" y="490" text-anchor="middle">model answers on tape</text></g><g class="k-brain"><rect class="dcard" x="470" y="396" width="300" height="120" rx="12"/><rect class="dedge" x="484" y="396" width="272" height="0.1"/><circle class="dtint" cx="620.0" cy="429" r="23"/><g class="dg" transform="translate(606.2 415.2) scale(0.575)"><circle cx="24" cy="12" r="5"/><circle cx="10" cy="34" r="5"/><circle cx="38" cy="34" r="5"/><path d="M21 16l-8 14M27 16l8 14M15 36h18"/></g><text class="dt" x="620.0" y="472" text-anchor="middle">Scenario in replay mode</text><text class="ds" x="620.0" y="490" text-anchor="middle">no network, no tokens</text></g><g class="k-good"><rect class="dcard" x="880" y="396" width="300" height="120" rx="12"/><rect class="dedge" x="894" y="396" width="272" height="0.1"/><circle class="dtint" cx="1030.0" cy="429" r="23"