<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Twin is the city and the Guardian judges every reading. The City Brain decides, and only its Safety gate can send an action back to the city. A live screen shows all of it." viewBox="0 0 1240 500" width="1240" height="500"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="500" fill="#fff"/><g class="k-twin"><rect class="dcard" x="20" y="150" width="210" height="120" rx="12"/><rect class="dedge" x="34" y="150" width="182" height="0.1"/><circle class="dtint" cx="125.0" cy="183" r="23"/><g class="dg" transform="translate(111.2 169.2) scale(0.575)"><path d="M6 42V22h10v20M16 42V10h12v32M28 42V26h10v16M4 42h40"/></g><text class="dt" x="125.0" y="226" text-anchor="middle">Twin</text><text class="ds" x="125.0" y="244" text-anchor="middle">the simulated city, built</text><text class="ds" x="125.0" y="260" text-anchor="middle">by a partner team</text></g><g class="k-brain"><rect class="dcard" x="515" y="110" width="210" height="220" rx="12"/><rect class="dedge" x="529" y="110" width="182" height="0.1"/><circle class="dtint" cx="594.0" cy="143" r="23"/><g class="dg" transform="translate(580.2 129.2) scale(0.575)"><circle cx="24" cy="24" r="5"/><circle cx="9" cy="13" r="3"/><circle cx="39" cy="13" r="3"/><circle cx="8" cy="34" r="3"/><circle cx="40" cy="34" r="3"/><circle cx="24" cy="6" r="3"/><path d="M20 21L11 15M28 21l9-6M20 28l-9 5M28 28l9 5M24 19V9"/></g><circle class="dlogo" cx="646.0" cy="143" r="23"/><image href="data:image/svg+xml;base64," x="631.6" y="128.6" width="28.8" height="28.8" preserveAspectRatio="xMidYMid meet"/><text class="dt" x="620.0" y="186" text-anchor="middle">City Brain</text><text class="ds" x="620.0" y="204" text-anchor="middle">our layer: decides the</text><text class="ds" x="620.0" y="220" text-anchor="middle">response</text></g><g class="k-guardian"><rect class="dcard" x="1010" y="150" width="210" height="120" rx="12"/><rect class="dedge" x="1024" y="150" width="182" height="0.1"/><circle class="dtint" cx="1115.0" cy="183" r="23"/><g class="dg" transform="translate(1101.2 169.2) scale(0.575)"><path d="M24 5l15 5v12c0 9-6 16-15 20-9-4-15-11-15-20V10z"/><path d="M17 24l5 5 9-10"/></g><text class="dt" x="1115.0" y="226" text-anchor="middle">Guardian</text><text class="ds" x="1115.0" y="244" text-anchor="middle">says whether each reading</text><text class="ds" x="1115.0" y="260" text-anchor="middle">can be trusted</text></g><g class="k-gate"><rect class="dcard" x="530" y="390" width="180" height="104" rx="12"/><rect class="dedge" x="544" y="390" width="152" height="0.1"/><circle class="dtint" cx="620.0" cy="423" r="23"/><g class="dg" transform="translate(606.2 409.2) scale(0.575)"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M16 21v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="31" r="2"/></g><text class="dt" x="620.0" y="466" text-anchor="middle">Safety gate</text><text class="ds" x="620.0" y="484" text-anchor="middle">the only way out</text></g><g class="k-person"><rect class="dcard" x="960" y="390" width="180" height="104" rx="12"/><rect class="dedge" x="974" y="390" width="152" height="0.1"/><circle class="dtint" cx="1050.0" cy="423" r="23"/><g class="dg" transform="translate(1036.2 409.2) scale(0.575)"><rect x="5" y="9" width="38" height="24" rx="3"/><path d="M17 41h14M24 33v8"/></g><text class="dt" x="1050.0" y="466" text-anchor="middle">Live screen</text><text class="ds" x="1050.0" y="484" text-anchor="middle">timeline and 3D brain</text></g><g class="k-store"><rect class="dcard" x="530" y="0" width="180" height="90" rx="12"/><rect class="dedge" x="544" y="0" width="152" height="0.1"/><circle class="dlogo" cx="620.0" cy="33" r="23"/><image href="data:image/svg+xml;base64," x="605.6" y="18.6" width="28.8" height="28.8" preserveAspectRatio="xMidYMid meet"/><text class="dt" x="620.0" y="76" text-anchor="middle">Other teams</text></g><path class="dw  " d="M230.0 190.0 L515.0 190.0"/><polygon class="dh " points="515.0,190.0 504.0,195.5 504.0,184.5"/><text class="dl" x="372" y="180" text-anchor="middle">sensor readings</text><path class="dw  " d="M725.0 190.0 L1010.0 190.0"/><polygon class="dh " points="1010.0,190.0 999.0,195.5 999.0,184.5"/><text class="dl" x="868" y="180" text-anchor="middle">“can I trust this?”</text><path class="dw  " d="M1010.0 250.0 L725.0 250.0"/><polygon class="dh " points="725.0,250.0 736.0,244.5 736.0,255.5"/><text class="dl" x="868" y="240" text-anchor="middle">verdict</text><path class="dw  " d="M620.0 330.0 L620.0 390.0"/><polygon class="dh " points="620.0,390.0 614.5,379.0 625.5,379.0"/><text class="dl" x="630" y="362" text-anchor="start">every proposed action</text><path class="dw gate " d="M530.0 440.0 L125.0 440.0 L125.0 280.0"/><polygon class="dh gate" points="125.0,280.0 130.5,291.0 119.5,291.0"/><text class="dl" x="330" y="430" text-anchor="middle">signed actions</text><path class="dw  " d="M725.0 300.0 L1050.0 300.0 L1050.0 390.0"/><polygon class="dh " points="1050.0,390.0 1044.5,379.0 1055.5,379.0"/><text class="dl" x="890" y="290" text-anchor="middle">live events</text><path class="dw  " d="M620.0 90.0 L620.0 110.0"/><polygon class="dh " points="620.0,110.0 614.5,99.0 625.5,99.0"/><text class="dl" x="636" y="104" text-anchor="start">ask through tools</text></svg>