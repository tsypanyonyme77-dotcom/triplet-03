<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One crime, two answers: a written rule sends the pursuit in tens of milliseconds, then a team of agents plans the perimeter. That took 0.1 to 0.5 s with the scripted stand-ins in our runs, and takes longer on a real model. Both stop at the same gate." viewBox="0 0 1240 314" width="1240" height="314"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1240" height="314" fill="#fff"/><g class="k-bad"><rect class="dcard" x="10" y="110" width="190" height="120" rx="12"/><rect class="dedge" x="24" y="110" width="162" height="0.1"/><circle class="dtint" cx="105.0" cy="143" r="23"/><g class="dg" transform="translate(91.2 129.2) scale(0.575)"><path d="M24 6l19 34H5z"/><path d="M24 18v10M24 33v2"/></g><text class="dt" x="105.0" y="186" text-anchor="middle">A suspect is seen</text><text class="ds" x="105.0" y="204" text-anchor="middle">the crime in scenario</text><text class="ds" x="105.0" y="220" text-anchor="middle">t14</text></g><g class="k-brain"><rect class="dcard" x="310" y="0" width="210" height="104" rx="12"/><rect class="dedge" x="324" y="0" width="182" height="0.1"/><circle class="dtint" cx="415.0" cy="33" r="23"/><g class="dg" transform="translate(401.2 19.2) scale(0.575)"><path d="M28 4L9 28h13l-3 16 20-25H25z"/></g><text class="dt" x="415.0" y="76" text-anchor="middle">Instant rule</text><text class="ds" x="415.0" y="94" text-anchor="middle">rule POL-001: pursue</text></g><g class="k-brain"><rect class="dcard" x="310" y="200" width="210" height="104" rx="12"/><rect class="dedge" x="324" y="200" width="182" height="0.1"/><circle class="dtint" cx="415.0" cy="233" r="23"/><g class="dg" transform="translate(401.2 219.2) scale(0.575)"><circle cx="24" cy="12" r="5"/><circle cx="10" cy="34" r="5"/><circle cx="38" cy="34" r="5"/><path d="M21 16l-8 14M27 16l8 14M15 36h18"/></g><text class="dt" x="415.0" y="276" text-anchor="middle">Team of agents</text><text class="ds" x="415.0" y="294" text-anchor="middle">Analyst, Tactician, Chief</text></g><g class="k-gate"><rect class="dcard" x="660" y="110" width="190" height="104" rx="12"/><rect class="dedge" x="674" y="110" width="162" height="0.1"/><circle class="dtint" cx="755.0" cy="143" r="23"/><g class="dg" transform="translate(741.2 129.2) scale(0.575)"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M16 21v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="31" r="2"/></g><text class="dt" x="755.0" y="186" text-anchor="middle">Safety gate</text><text class="ds" x="755.0" y="204" text-anchor="middle">the same checks for both</text></g><g class="k-twin"><rect class="dcard" x="990" y="0" width="220" height="104" rx="12"/><rect class="dedge" x="1004" y="0" width="192" height="0.1"/><circle class="dtint" cx="1100.0" cy="33" r="23"/><g class="dg" transform="translate(1086.2 19.2) scale(0.575)"><path d="M6 32v-8l5-11h26l5 11v8z"/><path d="M6 24h36"/><circle cx="15" cy="34" r="4"/><circle cx="33" cy="34" r="4"/></g><text class="dt" x="1100.0" y="76" text-anchor="middle">One unit pursues</text><text class="ds" x="1100.0" y="94" text-anchor="middle">fast, simple, certain</text></g><g class="k-twin"><rect class="dcard" x="990" y="200" width="220" height="104" rx="12"/><rect class="dedge" x="1004" y="200" width="192" height="0.1"/><circle class="dtint" cx="1100.0" cy="233" r="23"/><g class="dg" transform="translate(1086.2 219.2) scale(0.575)"><circle cx="10" cy="38" r="5"/><circle cx="38" cy="10" r="5"/><path d="M15 38h15a7 7 0 0 0 0-14H18a7 7 0 0 1 0-14h15"/></g><text class="dt" x="1100.0" y="276" text-anchor="middle">A full plan</text><text class="ds" x="1100.0" y="294" text-anchor="middle">2 perimeter units, 1 alert</text></g><path class="dw  " d="M200.0 170.0 L255.0 170.0 L255.0 52.0 L310.0 52.0"/><polygon class="dh " points="310.0,52.0 299.0,57.5 299.0,46.5"/><text class="dl" x="255.0" y="103.0" text-anchor="middle">fast path</text><path class="dw  " d="M200.0 170.0 L255.0 170.0 L255.0 252.0 L310.0 252.0"/><polygon class="dh " points="310.0,252.0 299.0,257.5 299.0,246.5"/><text class="dl" x="255" y="300" text-anchor="middle">slow path</text><path class="dw  " d="M520.0 52.0 L590.0 52.0 L590.0 162.0 L660.0 162.0"/><polygon class="dh " points="660.0,162.0 649.0,167.5 649.0,156.5"/><text class="dl" x="526" y="44.0" text-anchor="start">tens of ms</text><path class="dw  " d="M520.0 252.0 L590.0 252.0 L590.0 162.0 L660.0 162.0"/><polygon class="dh " points="660.0,162.0 649.0,167.5 649.0,156.5"/><text class="dl" x="526" y="270.0" text-anchor="start">under a second</text><path class="dw gate " d="M850.0 162.0 L920.0 162.0 L920.0 52.0 L990.0 52.0"/><polygon class="dh gate" points="990.0,52.0 979.0,57.5 979.0,46.5"/><path class="dw gate " d="M850.0 162.0 L920.0 162.0 L920.0 252.0 L990.0 252.0"/><polygon class="dh gate" points="990.0,252.0 979.0,257.5 979.0,246.5"/></svg>