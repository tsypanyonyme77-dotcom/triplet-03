<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Each layer stops a different attack, and all 22 red-team attacks were refused. The Guardian judges the data, the gate judges the action, and the log proves afterwards what happened." viewBox="0 0 1250 364" width="1250" height="364"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1250" height="364" fill="#fff"/><g class="k-brain"><rect class="dcard" x="10" y="40" width="132" height="166" rx="12"/><rect class="dedge" x="24" y="40" width="104" height="0.1"/><circle class="dtint" cx="76.0" cy="73" r="23"/><g class="dg" transform="translate(62.2 59.2) scale(0.575)"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M16 21v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="31" r="2"/></g><text class="dt" x="76.0" y="116" text-anchor="middle">Encrypted link</text><text class="ds" x="76.0" y="134" text-anchor="middle">TLS, when</text><text class="ds" x="76.0" y="150" text-anchor="middle">switched on</text><circle class="dnum" cx="24" cy="54" r="11"/><text class="dn" x="24" y="58.5">1</text></g><g class="k-brain"><rect class="dcard" x="164" y="40" width="132" height="166" rx="12"/><rect class="dedge" x="178" y="40" width="104" height="0.1"/><circle class="dtint" cx="230.0" cy="73" r="23"/><g class="dg" transform="translate(216.2 59.2) scale(0.575)"><circle cx="15" cy="24" r="9"/><path d="M24 24h19M36 24v8M43 24v6"/></g><text class="dt" x="230.0" y="116" text-anchor="middle">Token</text><text class="ds" x="230.0" y="134" text-anchor="middle">scoped,</text><text class="ds" x="230.0" y="150" text-anchor="middle">short-lived</text><circle class="dnum" cx="178" cy="54" r="11"/><text class="dn" x="178" y="58.5">2</text></g><path class="dw  " d="M142.0 123.0 L164.0 123.0"/><polygon class="dh " points="164.0,123.0 153.0,128.5 153.0,117.5"/><g class="k-brain"><rect class="dcard" x="318" y="40" width="132" height="166" rx="12"/><rect class="dedge" x="332" y="40" width="104" height="0.1"/><circle class="dtint" cx="384.0" cy="73" r="23"/><g class="dg" transform="translate(370.2 59.2) scale(0.575)"><path d="M18 26c0-5-4-7-4-13a10 10 0 0 1 20 0c0 6-4 8-4 13z"/><path d="M8 34c0-4 3-8 8-8h16c5 0 8 4 8 8v3H8zM8 43h32"/></g><text class="dt" x="384.0" y="116" text-anchor="middle">Signature</text><text class="ds" x="384.0" y="134" text-anchor="middle">right key, not</text><text class="ds" x="384.0" y="150" text-anchor="middle">rotated out</text><circle class="dnum" cx="332" cy="54" r="11"/><text class="dn" x="332" y="58.5">3</text></g><path class="dw  " d="M296.0 123.0 L318.0 123.0"/><polygon class="dh " points="318.0,123.0 307.0,128.5 307.0,117.5"/><g class="k-brain"><rect class="dcard" x="472" y="40" width="132" height="166" rx="12"/><rect class="dedge" x="486" y="40" width="104" height="0.1"/><circle class="dtint" cx="538.0" cy="73" r="23"/><g class="dg" transform="translate(524.2 59.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M24 12v12l8 6"/></g><text class="dt" x="538.0" y="116" text-anchor="middle">No replay</text><text class="ds" x="538.0" y="134" text-anchor="middle">time and one-use</text><text class="ds" x="538.0" y="150" text-anchor="middle">nonce</text><circle class="dnum" cx="486" cy="54" r="11"/><text class="dn" x="486" y="58.5">4</text></g><path class="dw  " d="M450.0 123.0 L472.0 123.0"/><polygon class="dh " points="472.0,123.0 461.0,128.5 461.0,117.5"/><g class="k-brain"><rect class="dcard" x="626" y="40" width="132" height="166" rx="12"/><rect class="dedge" x="640" y="40" width="104" height="0.1"/><circle class="dtint" cx="692.0" cy="73" r="23"/><g class="dg" transform="translate(678.2 59.2) scale(0.575)"><path d="M16 13L5 24l11 11M32 13l11 11-11 11M28 8l-8 32"/></g><text class="dt" x="692.0" y="116" text-anchor="middle">Clean fields</text><text class="ds" x="692.0" y="134" text-anchor="middle">safe ids, no</text><text class="ds" x="692.0" y="150" text-anchor="middle">injection</text><circle class="dnum" cx="640" cy="54" r="11"/><text class="dn" x="640" y="58.5">5</text></g><path class="dw  " d="M604.0 123.0 L626.0 123.0"/><polygon class="dh " points="626.0,123.0 615.0,128.5 615.0,117.5"/><g class="k-guardian"><rect class="dcard" x="780" y="40" width="132" height="166" rx="12"/><rect class="dedge" x="794" y="40" width="104" height="0.1"/><circle class="dtint" cx="846.0" cy="73" r="23"/><g class="dg" transform="translate(832.2 59.2) scale(0.575)"><path d="M24 5l15 5v12c0 9-6 16-15 20-9-4-15-11-15-20V10z"/><path d="M17 24l5 5 9-10"/></g><text class="dt" x="846.0" y="116" text-anchor="middle">Guardian</text><text class="ds" x="846.0" y="134" text-anchor="middle">trusted verdict</text><circle class="dnum" cx="794" cy="54" r="11"/><text class="dn" x="794" y="58.5">6</text></g><path class="dw  " d="M758.0 123.0 L780.0 123.0"/><polygon class="dh " points="780.0,123.0 769.0,128.5 769.0,117.5"/><g class="k-gate"><rect class="dcard" x="934" y="40" width="132" height="166" rx="12"/><rect class="dedge" x="948" y="40" width="104" height="0.1"/><circle class="dtint" cx="1000.0" cy="73" r="23"/><g class="dg" transform="translate(986.2 59.2) scale(0.575)"><rect x="11" y="21" width="26" height="20" rx="3"/><path d="M16 21v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="31" r="2"/></g><text class="dt" x="1000.0" y="116" text-anchor="middle">Safety gate</text><text class="ds" x="1000.0" y="134" text-anchor="middle">eleven checks</text><circle class="dnum" cx="948" cy="54" r="11"/><text class="dn" x="948" y="58.5">7</text></g><path class="dw  " d="M912.0 123.0 L934.0 123.0"/><polygon class="dh " points="934.0,123.0 923.0,128.5 923.0,117.5"/><g class="k-good"><rect class="dcard" x="1088" y="40" width="132" height="166" rx="12"/><rect class="dedge" x="1102" y="40" width="104" height="0.1"/><circle class="dtint" cx="1154.0" cy="73" r="23"/><g class="dg" transform="translate(1140.2 59.2) scale(0.575)"><rect x="4" y="17" width="20" height="14" rx="7"/><rect x="24" y="17" width="20" height="14" rx="7"/><path d="M17 24h14"/></g><text class="dt" x="1154.0" y="116" text-anchor="middle">Sealed log</text><text class="ds" x="1154.0" y="134" text-anchor="middle">hash chain,</text><text class="ds" x="1154.0" y="150" text-anchor="middle">signed head</text><circle class="dnum" cx="1102" cy="54" r="11"/><text class="dn" x="1102" y="58.5">8</text></g><path class="dw  " d="M1066.0 123.0 L1088.0 123.0"/><polygon class="dh " points="1088.0,123.0 1077.0,128.5 1077.0,117.5"/><g class="k-bad"><rect class="dcard" x="420" y="250" width="320" height="104" rx="12"/><rect class="dedge" x="434" y="250" width="292" height="0.1"/><circle class="dtint" cx="580.0" cy="283" r="23"/><g class="dg" transform="translate(566.2 269.2) scale(0.575)"><circle cx="24" cy="24" r="18"/><path d="M16 16l16 16M32 16L16 32"/></g><text class="dt" x="580.0" y="326" text-anchor="middle">Refused at any step</text><text class="ds" x="580.0" y="344" text-anchor="middle">with its reason written to the log</text></g><path class="dw bad " d="M580.0 206.0 L580.0 250.0"/><polygon class="dh bad" points="580.0,250.0 574.5,239.0 585.5,239.0"/><text class="dl" x="595" y="232" text-anchor="start">forged, replayed, hostile, out of scope</text></svg>