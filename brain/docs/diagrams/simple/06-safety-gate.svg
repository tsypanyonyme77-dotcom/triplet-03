<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Every action from every source passes these checks in this order. The first one that fails stops the action and records why. Only a call that passes all of them is signed and sent." viewBox="0 0 1262 360" width="1262" height="360"><style>svg{--paper:#F7F9FB;--card:#FFFFFF;--ink:#16202B;--ink2:#4C5968;--line:#C5CFD9;--lane:#EEF2F6;--twin:#0B7A75;--guardian:#6D3FC4;--brain:#1B5FD0;--gate:#B86E00;--person:#A62C7F;--store:#4A6275;--bad:#C7301E;--good:#167A49;--dfont:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.dcard{fill:var(--card);stroke:var(--line);stroke-width:1.5}.dt{font:700 14.5px var(--dfont);fill:var(--ink)}.ds{font:400 12.5px var(--dfont);fill:var(--ink2)}
.dl{font:700 12px var(--dfont);fill:var(--ink2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.dw{fill:none;stroke:var(--ink2);stroke-width:2}.dw.good{stroke:var(--good)}.dw.bad{stroke:var(--bad)}.dw.gate{stroke:var(--gate)}.dw.dash{stroke-dasharray:6 5}
.dh{fill:var(--ink2)}.dh.good{fill:var(--good)}.dh.bad{fill:var(--bad)}.dh.gate{fill:var(--gate)}
.dg{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dlogo{fill:#fff;stroke:var(--line)}
.dband{fill:var(--lane);stroke:none}.dframe{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}.dn{font:700 12px var(--dfont);fill:var(--card);text-anchor:middle}
.k-twin .dg{stroke:var(--twin)}.k-twin .dtint{fill:var(--twin);fill-opacity:.14}.k-twin .dedge{stroke:var(--twin);stroke-width:2.5}.k-twin .dnum{fill:var(--twin)}.k-guardian .dg{stroke:var(--guardian)}.k-guardian .dtint{fill:var(--guardian);fill-opacity:.14}.k-guardian .dedge{stroke:var(--guardian);stroke-width:2.5}.k-guardian .dnum{fill:var(--guardian)}.k-brain .dg{stroke:var(--brain)}.k-brain .dtint{fill:var(--brain);fill-opacity:.14}.k-brain .dedge{stroke:var(--brain);stroke-width:2.5}.k-brain .dnum{fill:var(--brain)}.k-gate .dg{stroke:var(--gate)}.k-gate .dtint{fill:var(--gate);fill-opacity:.14}.k-gate .dedge{stroke:var(--gate);stroke-width:2.5}.k-gate .dnum{fill:var(--gate)}.k-person .dg{stroke:var(--person)}.k-person .dtint{fill:var(--person);fill-opacity:.14}.k-person .dedge{stroke:var(--person);stroke-width:2.5}.k-person .dnum{fill:var(--person)}.k-store .dg{stroke:var(--store)}.k-store .dtint{fill:var(--store);fill-opacity:.14}.k-store .dedge{stroke:var(--store);stroke-width:2.5}.k-store .dnum{fill:var(--store)}.k-bad .dg{stroke:var(--bad)}.k-bad .dtint{fill:var(--bad);fill-opacity:.14}.k-bad .dedge{stroke:var(--bad);stroke-width:2.5}.k-bad .dnum{fill:var(--bad)}.k-good .dg{stroke:var(--good)}.k-good .dtint{fill:var(--good);fill-opacity:.14}.k-good .dedge{stroke:var(--good);stroke-width:2.5}.k-good .dnum{fill:var(--good)}</style><rect width="1262" height="360" fill="#fff"/><rect class="dframe" x="200" y="16" width="1052" height="176" rx="14"/><g class="k-brain"><rect class="dcard" x="10" y="30" width="170" height="148" rx="12"/><rect class="dedge" x="24" y="30" width="142" height="0.1"/><circle class="dtint" cx="95.0" cy="63" r="23"/><g class="dg" transform="translate(81.2 49.2) scale(0.575)"><path d="M28 4L9 28h13l-3 16 20-25H25z"/></g><text class="dt" x="95.0" y="106" text-anchor="middle">A proposed action</text><text class="ds" x="95.0" y="124" text-anchor="middle">from a rule, the team</text><text class="ds" x="95.0" y="140" text-anchor="middle">or a desk</text></g><g class="k-gate"><rect class="dcard" x="210" y="30" width="88" height="148" rx="10"/><circle class="dtint" cx="254.0" cy="62" r="19"/><g class="dg" transform="translate(242.6 50.6) scale(0.475)"><path d="M16 13L5 24l11 11M32 13l11 11-11 11M28 8l-8 32"/></g><circle class="dnum" cx="222" cy="42" r="10"/><text class="dn" x="222" y="46.5">1</text><text class="ds" style="fill:var(--ink);font-weight:700" x="254.0" y="104" text-anchor="middle">Follows the</text><text class="ds" style="fill:var(--ink);font-weight:700" x="254.0" y="119" text-anchor="middle">contract</text></g><g class="k-gate"><rect class="dcard" x="305" y="30" width="88" height="148" rx="10"/><circle class="dtint" cx="349.0" cy="62" r="19"/><g class="dg" transform="translate(337.6 50.6) scale(0.475)"><path d="M17 5v11M31 5v11M11 16h26v8a13 13 0 0 1-26 0z"/><path d="M24 37v7"/></g><circle class="dnum" cx="317" cy="42" r="10"/><text class="dn" x="317" y="46.5">2</text><text class="ds" style="fill:var(--ink);font-weight:700" x="349.0" y="104" text-anchor="middle">City can do</text><text class="ds" style="fill:var(--ink);font-weight:700" x="349.0" y="119" text-anchor="middle">this</text></g><g class="k-gate"><rect class="dcard" x="400" y="30" width="88" height="148" rx="10"/><circle class="dtint" cx="444.0" cy="62" r="19"/><g class="dg" transform="translate(432.6 50.6) scale(0.475)"><path d="M6 6h18l18 18-18 18L6 24z"/><circle cx="15" cy="15" r="3"/></g><circle class="dnum" cx="412" cy="42" r="10"/><text class="dn" x="412" y="46.5">3</text><text class="ds" style="fill:var(--ink);font-weight:700" x="444.0" y="104" text-anchor="middle">Department's</text><text class="ds" style="fill:var(--ink);font-weight:700" x="444.0" y="119" text-anchor="middle">remit</text></g><g class="k-gate"><rect class="dcard" x="495" y="30" width="88" height="148" rx="10"/><circle class="dtint" cx="539.0" cy="62" r="19"/><g class="dg" transform="translate(527.6 50.6) scale(0.475)"><circle cx="24" cy="24" r="18"/><path d="M1