or="middle">Person</text><text class="ds" style="fill:var(--ink);font-weight:700" x="824.0" y="119" text-anchor="middle">agreed, if</text><text class="ds" style="fill:var(--ink);font-weight:700" x="824.0" y="134" text-anchor="middle">high impact</text></g><g class="k-gate"><rect class="dcard" x="875" y="30" width="88" height="148" rx="10"/><circle class="dtint" cx="919.0" cy="62" r="19"/><g class="dg" transform="translate(907.6 50.6) scale(0.475)"><circle cx="15" cy="24" r="9"/><path d="M24 24h19M36 24v8M43 24v6"/></g><circle class="dnum" cx="887" cy="42" r="10"/><text class="dn" x="887" y="46.5">8</text><text class="ds" style="fill:var(--ink);font-weight:700" x="919.0" y="104" text-anchor="middle">Not already</text><text class="ds" style="fill:var(--ink);font-weight:700" x="919.0" y="119" text-anchor="middle">sent</text></g><g class="k-gate"><rect class="dcard" x="970" y="30" width="88" height="148" rx="10"/><circle class="dtint" cx="1014.0" cy="62" r="19"/><g class="dg" transform="translate(1002.6 50.6) scale(0.475)"><circle cx="24" cy="24" r="18"/><path d="M24 12v12l8 6"/></g><circle class="dnum" cx="982" cy="42" r="10"/><text class="dn" x="982" y="46.5">9</text><text class="ds" style="fill:var(--ink);font-weight:700" x="1014.0" y="104" text-anchor="middle">Not driven</text><text class="ds" style="fill:var(--ink);font-weight:700" x="1014.0" y="119" text-anchor="middle">too often</text></g><g class="k-gate"><rect class="dcard" x="1065" y="30" width="88" height="148" rx="10"/><circle class="dtint" cx="1109.0" cy="62" r="19"/><g class="dg" transform="translate(1097.6 50.6) scale(0.475)"><path d="M16 5h16l11 11v16L32 43H16L5 32V16z"/><path d="M16 24h16"/></g><circle class="dnum" cx="1077" cy="42" r="10"/><text class="dn" x="1077" y="46.5">10</text><text class="ds" style="fill:var(--ink);font-weight:700" x="1109.0" y="104" text-anchor="middle">Not</text><text class="ds" style="fill:var(--ink);font-weight:700" x="1109.0" y="119" text-anchor="middle">quarantined</text><