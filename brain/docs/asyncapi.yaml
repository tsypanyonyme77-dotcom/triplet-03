asyncapi: 3.0.0
info:
  title: City Brain event feed
  version: '2026-09-17'
  description: CloudEvents 1.0 over Server-Sent Events. Replays the run so far, then
    follows. Each event carries `traceid = <sensor_id>:<sequence_no>` of the reading
    that caused it.
servers:
  brain:
    host: localhost:8080
    protocol: http
    description: GET /events (text/event-stream)
channels:
  events:
    address: /events
    messages:
