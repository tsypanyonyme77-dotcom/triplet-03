repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy src
        language: system
        types: [python]
        pass_filenames: false
      - id: no-env
        name: never commit .env
        entry: .env must not be committed
        language: fail
        files: '^\.env$'
